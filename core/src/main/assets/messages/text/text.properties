text.textchallenges.real_intelligence = Real Intelligence
text.textchallenges.real_intelligence_desc = Unbelievable. Compared with the monsters from Swarm Intelligence, these monsters seem to have learned real skills...\n\n_-_ Monsters gain the same five equipment slots as the player!\n\n_-_ Weapons, armor, and rings work for every monster just as they do for the player!\n\n_-_ Some monsters have special interactions with weapons. Inspect a monster for details.\n\n_-_ Some monsters use different AI while wielding specific weapons. Inspect a monster for details.\n\n_-_ Monsters may even randomly carry potions or use scrolls!\n\n_-_ Some monsters behave a little differently while wielding weapons or wearing armor.\n\n_-_ The player gains two artifacts that take up no inventory space and can briefly deprive enemies of the power granted by their equipment.\n\n_-_ Monsters receive an overall stat increase.
