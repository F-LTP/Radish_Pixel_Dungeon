actors.buffs.rector.rectorskills$correct.name=惩戒之力
actors.buffs.rector.rectorskills$correct.desc=指定一个区域，对其中最近的敌人，造成_%s点伤害_。这个伤害对_亡灵和恶魔_翻_1.5倍_。\n\n这个技能需要消耗_5点信仰_。

actors.buffs.rector.rectorskills$correct.name_plus=神罚时刻
actors.buffs.rector.rectorskills$correct.desc_plus=指定一个区域，对其中最近的敌人，造成_%s点伤害_。这个伤害对_亡灵和恶魔_翻_1.5倍_。\n\n这个技能需要消耗_5点信仰_。\n\n惩戒之力已被转职进行专属强化，_伤害+50%%_，并会在释放前_额外指定一个视野内的随机目标_进行相同的_神罚时刻_效果。如果额外释放行动已经完成，则扣减信仰值。


actors.buffs.rector.rectorskills$clean.name=纯净净化
actors.buffs.rector.rectorskills$clean.desc=选择一件装备并削弱其上的诅咒，给予自身_100回合的发光_与_20回合祝福_。\n\n这个技能需要消耗_15点信仰_。

actors.buffs.rector.rectorskills$lightimuee.name=光能灌注
actors.buffs.rector.rectorskills$lightimuee.desc=获得_%1$s点_临时生命，并获得_%2$s回合_的体力充沛。\n\n临时生命不会消失，且可以_抵挡包括饥饿_在内的_任何伤害_，以_黄色条_显示。\n\n这个技能需要消耗_12点信仰_。
actors.buffs.rector.belief.lightimuee_success=你感觉到生命力得到了充沛。

actors.buffs.rector.rectorskills$lightimuee.name_plus=光明领域
actors.buffs.rector.rectorskills$lightimuee.desc_plus=获得_%1$s回合_的临时生命。\n\n临时生命不会消失，且可以_抵挡包括饥饿_在内的_任何伤害_，以_黄色条_显示。\n\n这个技能需要消耗_12点信仰_。\n\n光能灌注已被转职进行专属强化，_%2$s体力充沛点_与_%3$s回合_激素涌动。

actors.buffs.rector.rectorskills$prayers.name=虔诚祷告
actors.buffs.rector.rectorskills$prayers.desc=进行祈祷，祈求神灵的保佑，以下是可能的祈祷效果。\n\n_-_获得_财富之戒_的_随机中级掉落_（蓝色）。\n\n_-_获得当前等级升级所需_经验的1/2_。\n\n_-__完全净化_背包内以及穿戴的_所有装备_。\n\n_-_回复_1/3_的最大血量，并获得与_恢复血量数同等回合_的祝福。\n\n这个技能需要消耗_20点信仰_。

actors.buffs.rector.rectorskills$bless.name=圣光之耀
actors.buffs.rector.rectorskills$bless.desc=获得_60回合_祈福形态，并在此期间内获得_25%的物理伤害_提升与_25%的所有伤害_减免。\n\n这个技能需要消耗_15点信仰值_。

actors.buffs.rector.rectorskills$apower.name=宽恕裁决
actors.buffs.rector.rectorskills$apower.desc=立刻击杀攻击范围内一名_生命值低于60%的敌人_，且非首领。\n\n这个技能需要消耗_4点信仰值_。\n\n释放失败不会扣减信仰值。
actors.buffs.rector.belief.deadkill_success=%s已得到了主的宽恕。
actors.buffs.rector.belief.deadkill_noattack=在攻击范围未找到低于60%生命值的目标。
actors.buffs.rector.belief.deadkill_nomobs=未发现合适的敌人，无法进行宽恕裁决。
actors.buffs.rector.belief.deadkill_prompt=选择一个目标进行宽恕裁决

actors.buffs.rector.belief.enddead_success=随着一道红光闪过，有%s名敌人得到了最终行刑！

actors.buffs.rector.rectorskills$backmessage.name=背信弃义
actors.buffs.rector.rectorskills$backmessage.desc=指定视野范围内的一点，其_3*3范围_内的所有生物获得初始值为_楼层数+3的流血_。\n\n这个技能需要消耗_12点信仰值_。

actors.buffs.rector.rectorskills$deadmode.name=最终行刑
actors.buffs.rector.rectorskills$deadmode.desc=秒杀视野范围内的_至多5名非Boss敌人_，自身扣除相当于_击杀他们的经验值_。\n\n这个技能需要消耗_20点信仰值_。


actors.buffs.holylowburinng.name=圣火灼烧
actors.buffs.holylowburinng.heromsg=你的灵魂正在被圣火灼烧！
actors.buffs.holylowburinng.burnsup=%s被圣火的焰浪吞噬了！
actors.buffs.holylowburinng.ondeath=你被圣火的焰浪吞噬至死…
actors.buffs.holylowburinng.rankings_desc=灵魂被圣火灼烧至死……
actors.buffs.holylowburinng.desc=没什么比被圣火吞噬更痛苦了。 \n\n圣火会每回合都会造成伤害直到它自行消散，且被圣火吞噬的生物受到的伤害提升1.3倍。\n\n圣火灼烧效果剩余时长：%s回合

actors.buffs.halomethaneburning.name=圣火灼烧
actors.buffs.halomethaneburning.heromsg=你的灵魂正在被圣火灼烧！
actors.buffs.halomethaneburning.burnsup=%s被圣火的焰浪吞噬了！
actors.buffs.halomethaneburning.ondeath=你被圣火的焰浪吞噬至死…
actors.buffs.halomethaneburning.rankings_desc=灵魂被圣火灼烧至死……
actors.buffs.halomethaneburning.desc=没什么比被圣火吞噬更痛苦了。 \n\n圣火会每回合都会造成伤害直到它自行消散，且被圣火吞噬的生物受到的伤害提升1.3倍。 \n\n此外，圣火灼烧还会点燃所有接触到的可燃地形与可燃物。 \n\n圣火灼烧效果剩余时长：%s回合

actors.buffs.rector.rectorskills$holyfire.name=圣火审判
actors.buffs.rector.rectorskills$holyfire.desc=指定一个地格，在其_3×3区域_生成_圣火场_，火场内的_所有生物受到的伤害增加1.3倍_且沾染上_圣火_。\n\n这个技能需要消耗_10点信仰值_。



actors.buffs.rector.rectorskills$holyland.name=圣地领域
actors.buffs.rector.rectorskills$holyland.desc=指定一个地格，并以其为中心生成_一片%1$s_的_圣地区域_。\n\n在圣地区域内的_非英雄非飞行角色_都_会减少33%%移速_，对_亡灵与恶魔_类怪物则是_减少50%%移速_，并且每回合它们受到_%2$s点伤害_。\n\n这个技能需要消耗_8点信仰值_。

