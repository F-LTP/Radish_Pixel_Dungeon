### 新T4天赋 - 天赋重做
# 战士 T4-2：高端饮食
actors.hero.talent.high_diet.title=高端饮食
actors.hero.talent.high_diet.desc=_+1：_战士的最大饱食度上升至550。当饱食度在450以上时，生命自然回复速率上升15%。\n\n_+2：_最大饱食度上升至600，回复速率上升24%。\n\n_+3：_最大饱食度上升至650，回复速率上升33%。\n\n_+4：_最大饱食度上升至700，回复速率上升45%。

# 角斗士 T4-4：武器大师
actors.hero.talent.weapon_master.title=武器大师
actors.hero.talent.weapon_master.desc=_+1：_角斗士在更换武器后，将连击数调整至_3_，并且获得持续_2_回合的50%攻速加成。\n\n_+2：_连击数调整至_3_，攻速加成持续_3_回合。\n\n_+3：_连击数调整至_4_，攻速加成持续_3_回合。\n\n_+4：_连击数调整至_4_，攻速加成持续_4_回合。
actors.hero.talent.weapon_master_activated=你借着新武器的势头获得%d连击数并加快了攻击速度。

# 战法 T4-3：短棍格斗
actors.hero.talent.wand_dodge.title=短棍格斗
actors.hero.talent.wand_dodge.desc=_+1_:老魔杖近战攻击后，战斗法师有_10%_概率获得一次闪避机动。老魔杖造成的物理伤害上升_2_点.\n\n_+2：_老魔杖近战攻击后，战斗法师有_15%_概率获得一次闪避机动。老魔杖造成的物理伤害上升_4_点。\n\n_+3：__20%_概率获得闪避机动，物理伤害上升_6_点。\n\n_+4：__25%_概率获得闪避机动，物理伤害上升_8_点。

# 术士 T4-4：腐化怨灵
actors.hero.talent.corrupt_spirit.title=腐化怨灵
actors.hero.talent.corrupt_spirit.desc=_+1：_术士每进入新的一层就在身边生成_2_只腐化怨灵。每有一只怨灵死亡，同一层的所有怪物就下降_1_点闪避与精准。\n\n_+2：_生成_2_只怨灵，降低同层怪物_2_点闪避与精准。\n\n_+3：_生成_3_只怨灵，降低同层怪物_2_点闪避与精准。\n\n_+4：_生成3只怨灵，降低同层怪物_3_点闪避与精准。
actors.mobs.corruptspirit.name=腐化怨灵
actors.mobs.corruptspirit.desc=术士召唤的腐化怨灵。它们在死亡时会降低同一层所有怪物的闪避和精准。

# 狙击 T4-3：通识射击
actors.hero.talent.common_shot.title=通识射击
actors.hero.talent.common_shot.desc=_+1：_狙击手的近战攻击有33%的概率给予狙击标记。\n\n_+2：_66%概率给予狙击标记。\n\n_+3：_近战攻击必定给予狙击标记。\n\n_+4：_你始终具有拥有狙击标记的怪物的视野。

# 守望 T4-3/4-4
actors.hero.talent.more_darts.title=药水涂镖
actors.hero.talent.more_darts.desc=_+1：_守望者可以使用一瓶药水为_4_枚飞镖涂药。\n\n_+2：_可以使用一瓶药水为_6_枚飞镖涂药。
actors.hero.talent.grass_vision.title=草地视野
actors.hero.talent.grass_vision.desc=_+1：_守望者获得所有绿草的视野。\n\n_+2：_在+1基础上，守望者获得所有高草的视野。\n\n_+3：_在+1，+2基础上，守望者获得所有矮草的视野。\n\n_+4：_在草地上的敌人的移速下降20%。

# 月华 T4-1/4-2
actors.hero.talent.light_eternity.title=光之永恒
actors.hero.talent.light_eternity.desc=_+1：_每当月华因怪物攻击而失去生命，他的生命自然回复速率就上升15%，持续8回合。每个回复增加效果独立计算。\n\n_+2：_回复速率上升23%。\n\n_+3：_回复速率上升31%。\n\n_+4：_回复速率上升40%。
actors.hero.talent.moon_glory.title=月之辉煌
actors.hero.talent.moon_glory.desc=_+1：_每当月华使用了12点法杖充能，就为所携带的法杖回复随机2点充能。\n\n_+2：_每使用12点充能，回复3点充能。\n\n_+3：_每使用11点充能，回复3点充能。\n\n_+4：_每使用10点充能，回复3点充能。

# 小骑士 T4-3/4-4
actors.hero.talent.shield_poke.title=盾戳战术
actors.hero.talent.shield_poke.desc=_+1：_小骑士的伏击伤害上升5点。若小骑士装备的是盾牌类武器，则他的攻击变为伤害为15～20点必定伏击的戳刺。\n\n_+2：_伏击伤害上升6点，戳刺伤害15～25点。\n\n_+3：_伏击伤害上升7点，戳刺伤害15～30点。\n\n_+4：_伏击伤害上升8点，戳刺伤害15～35点。戳刺继承武器的附魔效果，享受攻速加成。
actors.hero.talent.knight_spirit.title=骑士精神
actors.hero.talent.knight_spirit.desc=_+1：_小骑士获得命中敌人25%的格挡/伤害减免/伤害/闪避与命中值，持续1回合。\n\n_+2：_持续2回合。\n\n_+3：_持续3回合。\n\n_+4：_持续4回合。效果持续直到那名敌人离开小骑士的攻击范围。

# 骰子法师 T4-3/4-4
actors.hero.talent.spell_empower.title=法术强效
actors.hero.talent.spell_empower.desc=_+1：_回复骰子法师所有法术的惩罚效果。每当升级此天赋，回复骰子法师所有法术的惩罚效果。\n\n_+2：_骰子法师的回复类法术对自身拥有25%的回复效果。\n\n_+3：_骰子法师的伤害类法术伤害上升25%。\n\n_+4：_骰子法师的范围类法术范围上升1，效果回合数增加3。
actors.hero.talent.egg_basket.title=鸡蛋篮子
actors.hero.talent.egg_basket.desc=_+1：_骰子法师的所有法杖伤害最小值变为1，伤害最大值增加最小值变化的数值*125%。\n\n_+2：_伤害最大值增加最小值变化的数值*150%。\n\n_+3：_伤害最大值增加最小值变化的数值*175%。\n\n_+4：_伤害最大值增加最小值变化的数值*200%。
actors.mobs.whiteplasticchair.name=白色塑料椅
actors.mobs.whiteplasticchair.desc=一把平平无奇的白色塑料椅。不知为何，你感觉这东西放在这里非常合适。
actors.mobs.whiteplasticchair.kick=踹一脚
actors.mobs.whiteplasticchair.too_far=你需要站在椅子旁边才能踹它。
actors.mobs.whiteplasticchair.kicked=塑料椅振动，一把刀掉了出来！
