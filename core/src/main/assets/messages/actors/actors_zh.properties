items.wands.yetwand.holyland$mobslowspeed.name=圣地法则
items.wands.yetwand.holyland$mobslowspeed.desc=在圣地区域内的_非英雄非飞行角色_都会减少_33%%移速_。
items.wands.yetwand.holyland$mobslowspeed.damage_desc=在圣地区域内的_非英雄非飞行角色_都会减少_33%%移速_。\n\n并且_每回合_它们受到来自_圣地的%s点法术伤害_。

items.wands.yetwand.holyland$demonslowspeed.name=圣地质问
items.wands.yetwand.holyland$demonslowspeed.desc=在圣地区域内的_恶魔,亡灵_属性会减少_50%%移速_。\n\n并且_每回合_它们受到来自_圣地的%s点法术伤害_。

actors.blobs.halomethanefire.name=圣火
actors.blobs.halomethanefire.desc=神秘莫测的圣火正在这里肆意燃烧，吞噬着周围一切的不洁之物。

