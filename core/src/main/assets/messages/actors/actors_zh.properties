items.armor.armor.ac_sharpening_edge=砥砺锋芒
actors.hero.talents.moonlight.sharpeningedgetalent.no_target=现在没有需要鉴定的同类物品。
actors.hero.talents.moonlight.sharpeningedgetalent.prompt=消耗这件已鉴定的装备，鉴定一件你背包中的同类型装备。
actors.hero.talents.moonlight.sharpeningedgetalent.success=你在旧的装备上打磨新的装备，因此得知了新装备的成色。\n但是在打磨测试时，你的旧装备磨没了！

