####
actors.hero.talent.iron_will.meta_desc=_如果这个天赋被其它英雄获得_，那么它在没有破损纹章的情况下也可以提供护盾。
actors.hero.talent.liquid_willpower.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1时生成等同于5%最大生命值的护盾，+2时生成7.5%最大生命值的护盾。
actors.hero.talent.runic_transference.meta_desc=_如果这个天赋被其它英雄获得_，那么它会使护甲刻印必定不会被升级卷轴消除的上限等级提高。天赋+1时，护甲在+6开始有概率消除刻印(原来在+4)，天赋+2时则为+7(原来在+4)。+8时仍然必定消除。
actors.hero.talent.wand_preservation.meta_desc=_如果这个天赋被其它英雄获得_，那么它会增加法杖于炼金釜中转化为奥术树脂的数量。+1时法杖转化的树脂数量增加1，+2时则增加2。
actors.hero.talent.aggressive_barrier.meta_desc=_如果这个天赋被其它英雄获得_，那么此天赋变为在低生命值时使用近战攻击获得此护盾。此时这个天赋有50回合的冷却时间。
actors.hero.talent.focused_meal.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1时使英雄的下一次物理攻击造成角色等级/3的额外伤害，+2时提升至角色等级/2。
actors.hero.talent.weapon_recharging.meta_desc=_如果这个天赋被其它英雄获得_，那么处于任一充能状态的情况下，+1时造成额外5%近战伤害，+2时造成额外7.5%近战伤害。
actors.hero.talent.lethal_haste.meta_desc=_如果这个天赋被其它英雄获得_，那么此天赋可以由常规的武器攻击触发，但会有100回合的冷却时间。
actors.hero.talent.precise_assault.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在+1/+2/+3等级时提高10/20/30%的近战精准。

### RadishEnemyBoss
actors.mobs.radishboss.bigsnake_zikk.name=大蛇兹克
actors.mobs.radishboss.bigsnake_zikk.desc=这条蛇比你之前见过的蛇更长也更粗，由于自身是下水道食物链中的高级存在，也无需将花色贴近自然。\n据说这条蛇拥有剧毒，并且阴险狡诈，很难应对。
actors.mobs.radishboss.bigsnake_zikk.notice=嘶～
actors.mobs.radishboss.bigsnake_zikk.poison=嘶！～嘶～～
actors.mobs.radishboss.bigsnake_zikk.defeated=……

actors.mobs.radishboss.gnollking.name=豺狼大酋长
actors.mobs.radishboss.gnollking.desc=豺狼大酋长是豺狼族群的最高存在。凭借手中的关刀蕴含的神秘魔力，它在豺狼族群中长久称霸。
actors.mobs.radishboss.gnollking.leap=豺狼大酋长正在准备突刺！
actors.mobs.radishboss.gnollking.eye=豺狼大酋长瞪视着黑暗中的你，你将无处遁形。
actors.mobs.radishboss.gnollking.notice=尔等鼠辈，既见本王，为何不拜？忤逆朕者，应斩立决！
actors.mobs.radishboss.gnollking.defeated=不……

actors.mobs.radishboss.gnollking$eyeattack.name=锐目
actors.mobs.radishboss.gnollking$eyeattack.desc=豺狼大酋长向友方传递着魔法的力量，你现在无处遁形。\n\n无论你处于什么状态，所有敌人都将持续锁定你的位置\n\n效果剩余回合还有：%s。

actors.mobs.radishboss.gnollshamanking.name=豺狼大祭司
actors.mobs.radishboss.gnollshamanking.desc=豺狼大祭司是酋长身边的最高护法，其恶毒的魔法让敌人闻风丧胆，它将竭尽全力保卫酋长的安全。
actors.mobs.radishboss.gnollshamanking.notice=若汝企图深入，则应度此考验。若无此志，速速退下！
actors.mobs.radishboss.gnollshamanking.rock_down=豺狼大祭司用法杖叩地，你周围的岩石一瞬之间似乎不再稳定……几乎要塌了……
actors.mobs.radishboss.gnollshamanking.bolt_kill=豺狼大祭司的魔力的冲击粉碎了你...
actors.mobs.radishboss.gnollshamanking.reach_attack=豺狼大祭司的法杖发出诡异的光，附近的豺狼守卫被赋予了进行一次远程攻击的能力。
actors.mobs.radishboss.gnollshamanking.defeated=可……


###blobs
actors.blobs.blizzard.desc=这里刮起了一阵暴风雪。

actors.blobs.confusiongas.desc=这里盘绕着一片致眩气体。

actors.blobs.electricity.desc=火花在这片电能力场中不断闪烁着。
actors.blobs.electricity.rankings_desc=触电
actors.blobs.electricity.ondeath=你因触电而亡……

actors.blobs.fire.desc=一团火焰正在这里肆虐隐没隐没

actors.blobs.foliage.desc=光柱刺破了地下花园中的黑暗。

actors.blobs.freezing.desc=这里的空气寒冷刺骨，很不寻常。

actors.blobs.goowarn.desc=黑暗能量正在这里涌动！

actors.blobs.inferno.desc=此处已成为燃烧着烈焰的人间地狱。

actors.blobs.paralyticgas.desc=这里盘绕着一片麻痹气体。

actors.blobs.sacrificialfire.desc=这是一个承载着献祭火焰的圣坛。在此殒命的生物都将成为献给地城之灵的祭品。\n\n或许献祭够多，就能得到回报？
actors.blobs.sacrificialfire.worthy=火焰吞噬了你的祭品，烧得愈发旺盛起来。
actors.blobs.sacrificialfire.unworthy=火焰吞噬了你的祭品，然而没有任何变化。
actors.blobs.sacrificialfire.reward=火焰喷薄而起，随后消散于空气，最终留下一份奖励！

actors.blobs.smokescreen.desc=这里盘绕着一片乌黑的浓烟。

actors.blobs.stenchgas.desc=这里盘绕着一片腐烂的臭气。

actors.blobs.stormcloud.desc=这里盘绕着一片翻腾的水汽。

actors.blobs.toxicgas.desc=这里盘绕着一片发绿的毒气。
actors.blobs.toxicgas.rankings_desc=窒息而死
actors.blobs.toxicgas.ondeath=你被毒气毒死了…

actors.blobs.corrosivegas.desc=这里盘绕着一片致命的侵蚀性酸雾。

actors.blobs.waterofawareness.procced=在你小酌一口时，你感觉到知识涌入了你的头脑。
actors.blobs.waterofawareness.desc=知识的力量正在从这口井的水里涌出。饮下井中的水以揭示所有已装备物品以及本层所有物品的秘密。
actors.blobs.waterofawareness.holy_spring_title=神圣泉水
actors.blobs.waterofawareness.holy_spring_desc=你可以将这口知识之泉转化为卷轴！
actors.blobs.waterofawareness.holy_spring_normal=正常饮用
actors.blobs.waterofawareness.holy_spring_transform=转化为卷轴
actors.blobs.waterofawareness.holy_spring_transformed=泉水之力化作了卷轴！

actors.blobs.waterofhealth.procced=就在你小酌一口时，你感到你的伤口完全愈合了。
actors.blobs.waterofhealth.desc=生命的力量正在从这口井的水里涌出。\n饮下井中的水以治疗你的伤口并填满你的肚子。
actors.blobs.waterofhealth.holy_spring_title=神圣泉水
actors.blobs.waterofhealth.holy_spring_desc=你可以将这口生命之泉转化为卷轴！
actors.blobs.waterofhealth.holy_spring_normal=正常饮用
actors.blobs.waterofhealth.holy_spring_transform=转化为卷轴
actors.blobs.waterofhealth.holy_spring_transformed=泉水之力化作了卷轴！

actors.blobs.wateroftransmutation.desc=变化的力量正在从这口井的水里涌出。\n扔进一个物品以将其转化为其他物品。

actors.blobs.web.desc=这里所有东西都被厚厚的蜘蛛网覆盖着。任何接触或丢向蛛网的东西都会打破它，但也都会被固定在原地。



###buffs
actors.buffs.adrenaline.name=激素涌动
actors.buffs.adrenaline.desc=由肾上腺素带来的纯粹的潜能爆发，激素涌动能够增强一名角色的移动和攻击速度。\n\n激素涌动允许角色拥有2倍的移动速度和1.5倍的攻击速度。\n\n激素涌动持续时间：%s 回合。

actors.buffs.adrenalinesurge.name=力量激发
actors.buffs.adrenalinesurge.desc=一股强大的力量，不过很可惜不是永久的。\n\n力量加成：+%d。\n距离效果衰减还有：%s回合。

actors.buffs.amok.name=狂乱
actors.buffs.amok.desc=狂乱导致状态下的生物进入一种极度愤怒和混乱的状态。 \n\n狂乱的生物会不分敌我地攻击任何靠近它们的人。\n\n狂乱效果的剩余时长：%s回合

actors.buffs.ankhinvulnerability.name=无敌
actors.buffs.ankhinvulnerability.desc=你的重生十字架已消耗了它的能量，恢复了你的生命值的同时还给予了你短暂的无敌时间！\n\n效果剩余时长：%s回合。

actors.buffs.arcanearmor.name=奥术护甲
actors.buffs.arcanearmor.desc=一层淡薄的护盾环绕着你，可为你抵挡一定的魔法伤害。\n\n当前你的魔法护甲值为: 0~%d。\n\n距离秘法护盾衰减还有： %s 回合。

actors.buffs.artifactrecharge.name=神器充能
actors.buffs.artifactrecharge.desc=魔力在你体内奔腾而过，提高你手中神器的充能速率。 \n\n每件神器受到的影响都不尽相同，但它们的充能速率都会大幅提升。\n\n神器充能剩余时长：%s回合

actors.buffs.ascensionchallenge.name=护符诡咒
actors.buffs.ascensionchallenge.desc=不知为何古神仍能借护身符维系自己对这个世界的影响，祂正借此设法阻止你向上返程！\n\n古神运用祂的力量使你的敌人变得更为众多、强大，整座地牢也因此变得更危险了！所幸你可以通过击败古神所加强过的敌人来削弱他的力量，若是置之不理则只会使古神之力愈发强大。
actors.buffs.ascensionchallenge.desc_clear=护身符中散发出的黑暗能量现今已被最大程度的削弱了。
actors.buffs.ascensionchallenge.desc_beckon=护身符正在_呼唤远处的敌人_，向它们通告你的位置。
actors.buffs.ascensionchallenge.desc_haste=护身符正_为远处的敌人加速_，令它们得以更快接近你！
actors.buffs.ascensionchallenge.desc_slow=护身符正_使你减速_，并阻止了一切加速效果！
actors.buffs.ascensionchallenge.desc_damage=护身符中涌动的黑暗能量已极为强大，它正在_直接对你造成伤害_！
actors.buffs.ascensionchallenge.beckon=护身符开始呼唤远处的敌人前来。
actors.buffs.ascensionchallenge.haste=护身符开始为周遭的敌人提升移速！
actors.buffs.ascensionchallenge.slow=你背包中的护身符此刻恍如重逾千钧！
actors.buffs.ascensionchallenge.damage=护身符开始释放黑暗能量。它烧着了！
actors.buffs.ascensionchallenge.weaken_info=你必须击败敌人来削弱护符的诅咒！
actors.buffs.ascensionchallenge.weaken=你能感受到护身符上的诅咒正缓慢地消退。
actors.buffs.ascensionchallenge.break=你花上点时间歇一口气，感受到身上的伤口开始愈合！
actors.buffs.ascensionchallenge.almost=你能感觉到古神对护身符的掌控愈发微弱了起来，胜利的曙光已然在你面前！
actors.buffs.ascensionchallenge.on_kill=黑暗能量最终还是吞噬了你……

actors.buffs.barkskin.name=树肤韧甲
actors.buffs.barkskin.desc=你的皮肤硬化了，摸起来如同树皮般粗糙而坚固。 \n\n硬化的皮肤增强了你的护甲，使你能更好地抵御物理攻击。\n\n当前增加的护甲值：0~%d。\n距离效果衰减还有：%s 回合。

actors.buffs.barrier.name=奥术屏障
actors.buffs.barrier.desc=一团可以抵挡全部伤害的能量屏障。\n\n只要奥术屏障的能量仍然存在，它将完全抵挡单位所受到的任何伤害。同时这种能量会随时间逐渐衰减。\n\n护盾能量剩余：%d。

actors.buffs.berserk.angered=愤怒
actors.buffs.berserk.berserk=狂暴
actors.buffs.berserk.exhausted=力竭
actors.buffs.berserk.recovering=恢复
actors.buffs.berserk.angered_desc=狂战士所造成的伤害会增强他的攻击力。狂战士造成物理伤害时会积攒怒气，赋予他更强的攻击力。被护甲抵挡的伤害也会积攒怒气。\n\n怒气会随时间而减淡。狂战士生命值越低，怒气存留的时间越长。\n\n积满怒气并且装备着纹章的狂战士在生命值降至0时，他会狂暴并在短时间内_抗拒死亡_。\n\n当前怒气：_%.0f%%_ \n_+%.0f%%_攻击
actors.buffs.berserk.berserk_desc=在濒死之际，恐惧和不安已经烟消云散，留存下来的只剩怒火。这种濒死情况下的狂战士会变得无比强大，_额外造成50%的伤害，获得额外的护盾值，并且无法死亡。_\n\n狂战士的护甲越强，获得的额外护盾值也会越多。护盾值会随时间消失殆尽，降至0后狂战士会彻底消亡。\n\n任何形式的治疗都会让狂战士恢复稳定，不过他会变得精疲力竭。力竭的狂战士需要得到足够的经验才可以再次积攒怒气。
actors.buffs.berserk.recovering_desc=内在力量是有限的。狂战士必须充分休息才能再次释放他的狂暴。\n\n正在恢复的狂战士不能积攒怒气。\n\n恢复所需等级：_%.2f_
actors.buffs.berserk.no_rages=濒死时的狂暴会造成永久性的创伤，每次都会降低狂战士的生命上限。
actors.buffs.berserk.past_rages=狂战士狂暴次数：_%d_\n生命上限降至：_%d%%_
actors.buffs.berserk.rankings_desc=暴走至死
actors.buffs.berserk.recovering_desc_turns=恢复所需回合数：%d
actors.buffs.berserk.recovering_desc_levels=---------------------
actors.buffs.berserk.action_name=狂暴
actors.buffs.berserk.no_seal=你需要破损纹章才能进入狂暴！
actors.buffs.berserk.roar1=_复仇怒号_ 消耗_75%_的怒气，使视野内的所有敌人_残疾_5回合，技能释放消耗1回合。
actors.buffs.berserk.roar2=_复仇怒号_ 消耗_65%_的怒气，使视野内的所有敌人_残疾和失明_5回合，技能释放不消耗时间。
actors.buffs.berserk.roar3=_复仇怒号_ 消耗_50%_的怒气，使视野内的所有敌人_残疾和失明_5回合，技能释放不消耗时间。
actors.buffs.berserk.roar4=_复仇怒号_ 消耗_50%_的怒气，使视野内的所有敌人_残疾和失明_5回合，并造成相当于一次攻击的伤害，技能释放不消耗时间。
actors.buffs.berserk.toberserk=_狂暴化_ 消耗_100%_的怒气，额外造成50%的伤害且获得额外的护盾值，期间不能发动其他狂怒战技。狂暴结束后，狂战士需要休息，而后才可以重新积攒怒气。


actors.buffs.bleeding.name=流血
actors.buffs.bleeding.ondeath=你因失血过多而死……
actors.buffs.bleeding.heromsg=你正在流血！
actors.buffs.bleeding.rankings_desc=流血致死
actors.buffs.bleeding.desc=伤口正在令人不安地涌出大量血液。 \n\n流血每回合都会造成伤害。每回合这个伤害数值都会随机减少，直到出血最终停止。 \n\n当前流血伤害：%d

actors.buffs.bless.name=赐福
actors.buffs.bless.desc=你的集中力正在喷薄而出，有人说这是神赐的礼物。 \n\n赐福状态能够提高自己25%%的精准与闪避属性，使被赐福者在战斗中势如破竹。 \n\n赐福效果剩余时长：%s回合

actors.buffs.blindness.name=失明
actors.buffs.blindness.heromsg=你失明了！
actors.buffs.blindness.desc=失明使周遭的一切陷入黑暗。 \n\n失明时，角色不能看到周身一格以外的环境、致使远程攻击变得毫无作用、同时也很容易丢失正在追踪的敌人的动向。此外，失明的英雄也无法读书或使用卷轴。 \n\n失明效果剩余时长：%s回合

actors.buffs.buff.heromsg=

actors.buffs.burning.name=燃烧
actors.buffs.burning.heromsg=你着火了！
actors.buffs.burning.burnsup=%s被烧毁了！
actors.buffs.burning.ondeath=你被燃烧至死…
actors.buffs.burning.rankings_desc=燃烧殆尽
actors.buffs.burning.desc=没什么比被火焰吞没更痛苦了。 \n\n火焰会每回合都会造成伤害直到它被液体扑灭或者自行消散。火会在你进入水中时熄灭，打碎药瓶产生的水花也具有同样的效果。 \n\n此外，火焰还会点燃所有接触到的可燃地形与可燃物。 \n\n燃烧效果剩余时长：%s回合

actors.buffs.championenemy.warn=你感受到了强敌的气场。
actors.buffs.championenemy$blazing.name=烈焰精英
actors.buffs.championenemy$blazing.desc=烈焰精英造成 25% 额外近战伤害，会点燃攻击目标，免疫火焰，且会在死亡时引燃周遭。
actors.buffs.championenemy$projecting.name=索敌精英
actors.buffs.championenemy$projecting.desc=索敌精英拥有 25% 额外近战伤害，且攻击范围变为 12 。
actors.buffs.championenemy$antimagic.name=敌法精英
actors.buffs.championenemy$antimagic.desc=敌法精英拥有 25% 的伤害减免，且完全免疫所有魔法效果。
actors.buffs.championenemy$giant.name=巨型精英
actors.buffs.championenemy$giant.desc=巨型精英拥有 75% 的伤害减免与额外的一格近战攻击距离，但无法进入狭窄的空间。
actors.buffs.championenemy$blessed.name=天佑精英
actors.buffs.championenemy$blessed.desc=天佑精英拥有 200% 额外精准与躲避。
actors.buffs.championenemy$growing.name=成长精英
actors.buffs.championenemy$growing.desc=成长精英拥有会稳步增长的额外精准、躲避、近战伤害与伤害减免。\n\n当前精准、躲避、近战伤害加成：%1$d%%\n当前伤害减免：%2$d%%

actors.buffs.championhero$blazing.name=烈焰精英
actors.buffs.championhero$blazing.desc=造成 25%% 额外近战伤害，会点燃攻击目标，免疫火焰。\n\n精英化剩余时长：%s回合
actors.buffs.championhero$blazing.descforshow=造成 25% 额外近战伤害，会点燃攻击目标，免疫火焰。
actors.buffs.championhero$projecting.name=索敌精英
actors.buffs.championhero$projecting.desc=拥有 25%% 额外近战伤害，且能攻击到看得见的任何目标。\n\n精英化剩余时长：%s回合
actors.buffs.championhero$projecting.descforshow=拥有 25% 额外近战伤害，且能攻击到看得见的任何目标。
actors.buffs.championhero$antimagic.name=敌法精英
actors.buffs.championhero$antimagic.desc=拥有 25%% 的伤害减免，且完全免疫所有魔法效果及一些负面效果。\n\n精英化剩余时长：%s回合
actors.buffs.championhero$antimagic.descforshow=拥有 25% 的伤害减免，且完全免疫所有魔法效果及一些负面效果。
actors.buffs.championhero$giant.name=巨型精英
actors.buffs.championhero$giant.desc=拥有 75%% 的伤害减免与两格的基础近战攻击距离(与手中武器取较长者)，但在狭窄处移动速度减少 50%% 。\n\n精英化剩余时长：%s回合
actors.buffs.championhero$giant.descforshow=拥有 75%% 的伤害减免与两格的基础近战攻击距离(与手中武器取较长者)，但在狭窄处移动速度减少 50% 。
actors.buffs.championhero$blessed.name=天佑精英
actors.buffs.championhero$blessed.desc=拥有 200%% 额外精准与躲避。\n\n精英化剩余时长：%s回合
actors.buffs.championhero$blessed.descforshow=拥有 200% 额外精准与躲避。
actors.buffs.championhero$growing.name=成长精英
actors.buffs.championhero$growing.desc=拥有会稳步增长的额外精准、躲避、近战伤害与伤害减免。\n\n当前精准、躲避、近战伤害加成：%1$d%%\n当前伤害减免：%2$d%%\n\n精英化剩余时长：%3$s回合
actors.buffs.championhero$growing.descforshow=拥有会稳步增长的额外精准、躲避、近战伤害与伤害减免。

actors.buffs.championhero$battlerector.name=祈福
actors.buffs.championhero$battlerector.desc=造成 25%% 额外近战伤害，获得25 %% 的伤害减免。\n\n剩余时长：%s回合

actors.buffs.charm.name=魅惑
actors.buffs.charm.heromsg=你被魅惑了！
actors.buffs.charm.cant_attack=你被目标敌人魅惑了，因此无法对其发起攻击。
actors.buffs.charm.desc=魅惑是一种能让一对夙敌暂时陷入互相倾慕的控制类魔法。\n\n被魅惑的单位将无法对魅惑施行者进行直接攻击，但依然可以攻击其他敌人。伤痛会激醒被魅惑单位，减少魅惑状态的持续时间。\n\n魅惑效果剩余时间：%s回合。

actors.buffs.chill.name=冻伤
actors.buffs.chill.freezes=%s冻住了！
actors.buffs.chill.desc=还没有完全冻住，不过已经非常冷了。\n\n冻伤的目标所有行动都会更加缓慢，减速程度取决于剩余的冻伤效果时间。最严重的冻伤情况等同于迟缓效果。\n\n冻伤效果剩余时长：%1$s回合\n当前减少的速度：%2$s%%

actors.buffs.combo.name=连击
actors.buffs.combo.action_name=连击
actors.buffs.combo.combo=%d连击！
actors.buffs.combo.bad_target=你的目标必须是攻击距离以内的敌人。
actors.buffs.combo.prompt=选择一个攻击目标
actors.buffs.combo.desc=角斗士在连续打击对手的过程中渐入佳境，每次攻击命中都会增加1点连击数，但长时间不进行攻击会将连击数归零。\n\n连击数积累到1,3,5,7,9时将获得一次战技的使用次数。当连击数达到7时，角斗士可以将所有技能转化为强大的终结技。\n\n一次连击过程中，释放过的战技将无法再次释放，包括作为终结技释放。\n\n当前的连击数：%1$d。\n\n连击将在%2$s回合后丢失。

actors.buffs.combo$combomove.crush.name=震击
actors.buffs.combo$combomove.crush.desc=对目标及其周围单位造成60%%伤害，此次攻击无视护甲且必定命中。
actors.buffs.combo$combomove.crush.finish_desc=对目标及其7*7范围内的所有敌人造成_%d%%_(连击数*15%%)伤害，此次攻击无视护甲且必定命中。
actors.buffs.combo$combomove.parry.name=格挡
actors.buffs.combo$combomove.parry.desc=格挡下回合内受到的第一次攻击，并立即发起还击。
actors.buffs.combo$combomove.parry.finish_desc=格挡下回合内受到的所有攻击并发起反击。反击造成_%d%%_(连击数*20%%)伤害且必定命中。
actors.buffs.combo$combomove.cleave.name=顺劈
actors.buffs.combo$combomove.cleave.desc=对目标发起一次必中攻击，倘若击杀目标，额外提升2点连击。
actors.buffs.combo$combomove.cleave.finish_desc=对目标造成_%d%%_(连击数*25%%)的伤害。倘若击杀目标，立即返还一半连击数。
actors.buffs.combo$combomove.fury.name=连斩
actors.buffs.combo$combomove.fury.desc=以较低的精准对目标快速发起2次攻击，每次攻击造成75%%的伤害并可以触发附魔。
actors.buffs.combo$combomove.fury.finish_desc=以较低的精准对目标快速发起_%d_(连击数)次攻击，每次攻击造成75%%的伤害并可以触发附魔。
actors.buffs.combo$combomove.spurt.name=冲刺
actors.buffs.combo$combomove.spurt.desc=向一个4格远的地点发起冲刺。无法穿过敌人和障碍物，但可以跃过深渊。
actors.buffs.combo$combomove.spurt.finish_desc=冲向一个_%1$d_(连击数/2)格远的地点，并获得_%2$d_（连击数/2）回合激素涌动。
actors.buffs.combo$combomove.finish.name=终结
actors.buffs.combo$combomove.finish.desc=将所有的技能转化为终结技。终结技获得连击数加成，释放时重置连击。
actors.buffs.combo$combomove.calm.name=冷静
actors.buffs.combo$combomove.calm.finish_desc=清除大部分负面效果，并获得当前损失生命_%1$d%%_(连击数*2%%)的缓慢恢复。

actors.buffs.corruption.name=腐化
actors.buffs.corruption.desc=腐化魔法会侵入生物体的生命本质，扭转他们原有的天性。\n\n被腐化的生物会攻击他们的盟友，还会忽视其原先的敌人。腐化效果同时也是有伤害性的，会导致其目标缓慢走向死亡。\n\n腐化是永久性的，死后才能解脱。

actors.buffs.cripple.name=残废
actors.buffs.cripple.heromsg=你残废了！
actors.buffs.cripple.desc=你很确定自己的腿不该折成那样。 \n\n残废会减半移动速度，移动一格会消耗二回合而不是正常情况下的一回合。 \n\n残废效果剩余时长：%s回合

actors.buffs.degrade.name=降级
actors.buffs.degrade.heromsg=你的装备被暂时弱化了！
actors.buffs.degrade.desc=强大的黑暗魔法正在吞噬升级卷轴和国王之戒注入你装备的魔力！\n\n降级状态下的装备会被视作比起原有等级更低的状态。_超过3级的每次升级都会遭受愈加严重的反噬。_物品的描述也会根据降级的影响而改变。\n\n不过，降级不会影响装备的力量需求，法杖充能，投武耐久以及神器。\n\n降级效果剩余时长：%s回合。使用一张升级卷轴或驱邪卷轴可以立即驱散这种黑暗魔法。

actors.buffs.doom.name=定命
actors.buffs.doom.desc=当整个宇宙都看起来想置你于死地时，继续斗争还有什么意义呢？\n\n被定命的角色受到的任何伤害都会翻倍。\n\n定命是永久性的，死后才能解脱。

actors.buffs.dread.name=魂飞魄散
actors.buffs.dread.desc=目标已被吓至魂飞魄散，正在极度的恐慌下尝试逃出这座地牢！\n\n魂飞魄散的生物将快速逃离它们的敌人，并且会在脱离敌人视野后立即消失在整座地牢中。逃离的敌人不会掉落道具，只会给予玩家减半的经验值奖励。伤害所造成的痛楚将促使其镇定下来。\n\n逃命中，剩余时长：%d 回合。

actors.buffs.drowsy.name=催眠
actors.buffs.drowsy.desc=一股魔法力量使目标很难保持清醒。 \n\n英雄可以通过受到伤害或保持完整生命值来维持清醒。\n\n几个回合之后，目标将会陷入魔法睡眠。

actors.buffs.earthimbue.name=大地之力
actors.buffs.earthimbue.desc=你被灌注了大地的力量！\n\n直到该效果结束前，你所有的物理攻击都会使敌人被缠绕在原地无法动弹一段时间。\n\n大地之力剩余时长：%s回合。

actors.buffs.enhancedrings.name=戒指强化
actors.buffs.enhancedrings.desc=盗贼在使用神器时会强化装备中的戒指，在%d回合内使其获得+1升级。

actors.buffs.fireimbue.name=火焰之力
actors.buffs.fireimbue.desc=你被灌注了火焰的力量！\n\n所有物理攻击都有机会使敌人燃烧。与此同时你对火焰完全免疫。\n\n火焰之力剩余时长：%s回合

actors.buffs.foresight.name=危险预知
actors.buffs.foresight.desc=不知为何，你的脑海中映射出了周遭的地形。\n\n远见状态持续时，你周遭大范围的地格都会被揭示，包括隐藏门与陷阱。\n\n远见效果剩余时长：%s 回合。

actors.buffs.frost.name=冰冻
actors.buffs.frost.freezes=%s冻住了！
actors.buffs.frost.desc=不要认为被冻得很结实了，这种温和的冻结只是把目标包裹在冰里。 \n\n冻结效果类似于麻痹，使目标不能行动。与麻痹不同的是，冻结效果会在目标受到伤害时立即消失，因为冰会碎。\n\n剩余的冻结效果时长：%s回合

actors.buffs.frostimbue.name=晶触之力
actors.buffs.frostimbue.desc=你被灌注了寒霜的力量！\n\n所有形式的物理攻击都会在敌人身上累加冻伤效果。与此同时你对冻伤完全免疫。\n\n晶触之力剩余时长：%s回合

actors.buffs.cancelattackbuff.name=取消攻击
actors.buffs.cancelattackbuff.desc=你可以进行一次不消耗时间的攻击！\n\n攻击时此效果会被消耗。

actors.buffs.cancelattackcooldown.name=取消攻击冷却
actors.buffs.cancelattackcooldown.desc=你需要等待一段时间才能再次使用取消攻击。\n\n剩余冷却时间：%s回合。

actors.buffs.kicktracker.name=踹飞
actors.buffs.kicktracker.action_name=踹飞！
actors.buffs.kicktracker.desc=周围有%d个敌人。\n\n踹飞3格内所有敌人，造成少量伤害并将其击退3格。需要至少3个敌人才能使用。
actors.buffs.kicktracker.not_enough_enemies=周围敌人不足3个！
actors.buffs.kicktracker.kicked=踹飞了%d个敌人！

actors.buffs.fury.name=愤怒
actors.buffs.fury.heromsg=你陷入了暴怒之中！
actors.buffs.fury.desc=你非常暴怒，很明显敌人并不喜欢这样的你。\n\n一股猛烈的怒火在你体内燃烧，增加你50%%的物理攻击伤害。\n\n只要你的生命还低于上限的50%%，该效果就会存在。

actors.buffs.blobimmunity.name=净化屏障
actors.buffs.blobimmunity.desc=一种奇怪的能量环绕在你的周围，为你阻挡有害的环境效果。\n\n在净化屏障的持续时间内，你将免疫所有负面环境效果。\n\n免疫效果剩余时长：%s回合。

actors.buffs.haste.name=极速
actors.buffs.haste.desc=强大的能量灌入到你的双腿肌肉上，允许你以不可思议的速度移动！\n\n当你拥有极速状态时你将拥有3倍的移动速度，但是其他行动速度仍然和原来一样。\n\n极速效果剩余时长：%s 回合。

actors.buffs.wheelchairrush.name=轮椅狂飙
actors.buffs.wheelchairrush.desc=神秘的轮椅载着你以惊人的速度向前飞驰！\n\n当你拥有轮椅狂飙状态时你将拥有2倍的移动速度，但是其他行动速度仍然和原来一样。\n\n轮椅狂飙效果剩余时长：%s 回合。

actors.buffs.catapultstartbuff.name=弹射起步
actors.buffs.catapultstartbuff.desc=你已蓄势待发！下次使用轮椅不会消耗充能。

actors.buffs.catapultstartcooldown.name=弹射起步冷却
actors.buffs.catapultstartcooldown.desc=你需要等待一段时间才能再次触发弹射起步。\n\n剩余回合：%s。

actors.buffs.wheelchaircrashbuff.name=轮椅翻车
actors.buffs.wheelchaircrashbuff.desc=你的轮椅损坏了，正在修复中！你无法移动。\n\n剩余回合：%s。
actors.buffs.wheelchaircrashbuff.move_blocked=你的轮椅损坏了，正在修复中...

actors.buffs.healing.name=治疗
actors.buffs.healing$starhealing.name=新星治疗
actors.buffs.healing.desc=一股治愈魔力让你的伤口开始愈合。\n\n你的生命将逐回合稳定回复，直到治疗效果终止。治疗量将随着时间逐渐减少。\n\n下一回合治疗量：%d\n\n剩余治疗量：%d。

actors.buffs.sootheregen.name=抚慰再生
actors.buffs.sootheregen.desc=一股温暖的治愈魔力缓缓流淌。\n\n每回合回复生命：%d\n\n剩余持续时间：%d回合。

actors.buffs.hex.name=幻惑
actors.buffs.hex.heromsg=你的精神受到了魔法的干扰！
actors.buffs.hex.desc=干扰集中力的黑暗魔法，使目标无法准确地判断方位。\n\n幻惑状态会降低目标20%%的精准与闪避属性，使其在战斗中更容易处于下风。\n\n幻惑效果剩余时长：%s回合。

actors.buffs.holdfast.name=不动如山
actors.buffs.holdfast.desc=战士原地不动时会进入坚守状态，提升他的护甲%1$d~%2$d点，持续到他移动为止。

actors.buffs.hunger.hungry=饥饿
actors.buffs.hunger.starving=极度饥饿
actors.buffs.hunger.onhungry=你有点饿了。
actors.buffs.hunger.onstarving=你已经饥肠辘辘！
actors.buffs.hunger.ondeath=你活活饿死了……
actors.buffs.hunger.cursedhorn=就在你吃东西的时候被诅咒的号角偷走了一部分食物的能量。
actors.buffs.hunger.rankings_desc=饥饿致死
actors.buffs.hunger.desc_intro_hungry=你能感受到自己的肚子在不断寻求食物，不过还不算那么严重。
actors.buffs.hunger.desc_intro_starving=你的饥饿程度已经危及生命了。
actors.buffs.hunger.desc=\n\n饥饿会在你在地牢里花费时间的同时缓慢累计，直到你饿得难以忍受。在你极度饥饿时生命值会停止回复并且开始缓慢减少 。\n\n合理利用食物非常重要！如果你有足够的生命值来维持饥饿，你就该等到一会儿食物更多的时候再吃。正确的配给可以让食物更有效地发挥作用！

actors.buffs.invisibility.name=隐形
actors.buffs.invisibility.desc=你和周围的地形完全融为一体，使你不可能被看到。 \n\n当你在隐形时敌人无法追踪或攻击你。大部分物理攻击和魔法(比如卷轴和法杖)会立即解除隐形效果。 \n\n隐形效果剩余时长：%s回合

actors.buffs.levitation.name=漂浮
actors.buffs.levitation.desc=一股魔力把你从地面托起，让你觉得自己身轻如燕。 \n\n在漂浮时你会无视所有以地面为基础的效果。陷阱不会被触发、火焰不会被水扑灭、植物不会被踩踏、根系无法缠绕你、并且能够跨越深渊。当心，在效果结束的那一刻上述效果都会失效！\n\n漂浮效果剩余时长：%s回合

actors.buffs.killboatswordwaitbuff.name=斩舰刀格挡
actors.buffs.killboatswordwaitbuff.desc=沉重的斩舰刀虽然需要花费很长时间来使用，但是巨大的刀身也能够帮助你格挡一定量的伤害。这个格挡量会随着斩舰刀等级的提高而上升。\n\n当前格挡伤害：%s~%s。

actors.buffs.lifelink.name=生命联结
actors.buffs.lifelink.desc=这个角色的生命力与另一位紧密相连，它们将共同分担所有受到的伤害。\n\n当它受到伤害时，半数的伤害将由另一方承担。\n\n系命效果将在%s回合后或是另一方阵亡时消失。

actors.buffs.light.name=发光
actors.buffs.light.desc=即使是在最黑暗的地牢中，身边有一个稳定的光源也总是令人欣慰。 \n\n光照能驱散黑暗，使你能够无视周遭的黑暗环境并拥有一个合理的视野范围。 \n\n发光效果剩余时长：%s回合

actors.buffs.lockedfloor.name=背水一战
actors.buffs.lockedfloor.desc=当前楼层被彻底封锁，你无法离开这里！\n\n封锁持续期间，你不会更加饥饿，或因极度饥饿减少生命值。此外，如果你没有在与Boss战斗，所有的被动回复都会停止。\n\n另外，如果你在楼层封锁时被未祝福的重生十字架复活了，本层将被完全重置。\n\n击杀本层Boss以解除封锁。\n\n目前的被动回复还有：_%s回合。_\n\n（至多49.00回合）

actors.buffs.lostinventory.name=遗落行囊
actors.buffs.lostinventory.desc=你的行囊被遗落在了地城中的某处！\n在找回你的行囊之前，你将无法拾起或使用绝大多数道具。

actors.buffs.magicalsight.name=魔能透视
actors.buffs.magicalsight.desc=不知为何，即使闭上眼睛你也可以用心灵洞察到周围发生的一切。\n\n当处于魔能透视状态时，周遭事物不再会阻挡你的视线，影响视力的异常状态也会被破除。并且你的视野范围增加  50%%。\n\n魔能透视剩余时长：%s 回合。

actors.buffs.magicalsleep.name=魔法睡眠
actors.buffs.magicalsleep.toohealthy=你十分健康，因此抵抗住了强烈的嗜睡感。
actors.buffs.magicalsleep.fallasleep=你深深地陷入了魔法睡眠。
actors.buffs.magicalsleep.wakeup=你醒来后，感觉浑身清爽并且十分健康。
actors.buffs.magicalsleep.desc=目标已深深陷入了魔法睡眠，不会自然醒来。\n\n魔法睡眠与一般的睡眠基本一样，但只有受伤会致使目标醒来。\n\n对于英雄，魔法睡眠有一些恢复性的效果，使他们能够在睡眠中迅速愈合伤口。

actors.buffs.magicimmune.name=魔法免疫
actors.buffs.magicimmune.desc=任何魔法都奈何不了你，你对魔法完全免疫。\n\n在魔法免疫状态下，所有魔法效果无论益害都无法影响你，包括但不限于诅咒、附魔、刻印、法杖、卷轴、戒指、神器等。\n\n魔法免疫剩余时长：%s回合。

actors.buffs.mindvision.name=灵视
actors.buffs.mindvision.desc=你可以在脑海中以某种方式看到这一层的所有生物。这种感觉非常奇异。\n\n只要灵视效果依然存在，这层的所有生物都会在你的视野当中。通过灵视看到的生物同样算作视野中的目标，可以被很多魔法效果影响。\n\n灵视效果剩余时长：%s回合

actors.buffs.momentum.momentum=动量积蓄
actors.buffs.momentum.running=逸动
actors.buffs.momentum.resting=恢复
actors.buffs.momentum.action_name=逸动
actors.buffs.momentum.momentum_desc=移动的时候，疾行者会逐渐积蓄动量。疾行者可以消耗动量以开启逸动状态。\n\n每一点动量可以支持两个回合的逸动，最多可以储存10点动量。当疾行者停止移动时动量会快速消散。\n\n现存的动量：%d。
actors.buffs.momentum.running_desc=移动的时候，疾行者会逐渐积蓄动量。疾行者可以消耗动量以开启逸动状态。\n\n处于逸动状态时，疾行者能够以两倍速移动，并且基于自身等级获得额外的闪避属性。\n\n效果剩余时长：%d回合。
actors.buffs.momentum.resting_desc=移动的时候，疾行者会逐渐积蓄动量。疾行者可以消耗动量以开启逸动状态。\n\n疾行者现在需要休息一会恢复体力才能重新积蓄动量。\n\n还需要休息%d回合。

actors.buffs.ooze.name=腐蚀淤泥
actors.buffs.ooze.heromsg=污泥在腐蚀你的身体。洗掉它！
actors.buffs.ooze.ondeath=你被彻底融化掉了...
actors.buffs.ooze.rankings_desc=被溶解
actors.buffs.ooze.desc=这种粘稠的酸性淤泥正在紧贴你的骨肉，并缓慢地将它们腐蚀融化。\n\n腐蚀淤泥会对受害者持续造成伤害，不过能够立刻在水中洗掉。\n\n腐蚀淤泥剩余时长：%s回合

actors.buffs.paralysis.name=麻痹
actors.buffs.paralysis.heromsg=你被麻痹了！
actors.buffs.paralysis.out=解脱麻痹
actors.buffs.paralysis.desc=通常最坏的事就是什么事都做不出来。\n\n麻痹会停止目标的一切动作，使目标保持原状直到效果消失。受伤导致的疼痛也能帮助目标脱离麻痹。 \n\n麻痹效果剩余时长：%s回合

actors.buffs.pincushion.name=中矢
actors.buffs.pincushion.desc=你击中这个角色的投掷武器正卡在他们身上，打败他们后投掷武器将会掉在地上。\n\n正卡在其他角色身上的物品：

actors.buffs.poison.name=中毒
actors.buffs.poison.heromsg=你中毒了！
actors.buffs.poison.ondeath=你被毒死了……
actors.buffs.poison.rankings_desc=中毒致死
actors.buffs.poison.desc=毒素传遍全身，缓慢地损伤着各个脏器。 \n\n毒素每回合造成的伤害与其剩余的回合数成正比。 \n\n中毒效果剩余时长：%s回合

actors.buffs.preparation.name=准备阶段
actors.buffs.preparation.action_name=蓄意打击
actors.buffs.preparation.desc=刺客正耐心地等待着，准备从暗影中给出致命一击。
actors.buffs.preparation.desc_dmg=他的下一次攻击会造成_%1$d%%的额外伤害_，并瞬间斩杀生命低于_%2$d%%_的普通敌人，或生命低于_%3$d%%_的Boss。
actors.buffs.preparation.desc_dmg_likely=这一击也更有可能造成偏高的伤害。
actors.buffs.preparation.desc_blink=他可以瞬间冲刺到敌人身边再攻击，最大冲刺距离为%d格。
actors.buffs.preparation.desc_invis_time=刺客已经隐形了_%d_回合。
actors.buffs.preparation.desc_invis_next=这一击在_%d_回合后会变得更强。
actors.buffs.preparation.prompt=选择一个攻击的目标！\n最大冲刺距离：%d格
actors.buffs.preparation.no_target=这里没有可攻击的目标。
actors.buffs.preparation.out_of_reach=你无法冲刺到目标距离。
actors.buffs.preparation.assassinated=斩杀

actors.buffs.prismaticguard.name=虹色替身
actors.buffs.prismaticguard.desc=你正在被一个目前看不见的虹色替身所保护。当有敌人出现时这个虹色替身将出现并为你战斗！\n\n当虹色替身未激活时，它将逐渐恢复所有所受到的伤害。\n\n替身当前生命值：%d /%d。

actors.buffs.recharging.name=充能
actors.buffs.recharging.desc=魔力在你体内奔腾而过，提高你的魔杖和法杖的充能速率。 \n\n每回合这个效果都将给你的法杖/魔杖增加四分之一点充能，这个效果的充能不同于正常充能并且能与之叠加。\n\n充能效果剩余时长：%s回合

actors.buffs.revealedarea.name=区域揭示
actors.buffs.revealedarea.desc=揭示地牢中一片区域的视野，无论你身处这层中的何处都能对那里一览无遗。\n\n效果剩余时长：%s回合。

actors.buffs.revealedchar.name=已揭示
actors.buffs.revealedchar.desc=这个单位已被揭示，无论它在哪里都将是可见的。\n\n效果剩余时长：%s回合。

actors.buffs.roots.name=缠绕
actors.buffs.roots.heromsg=你不能动了！
actors.buffs.roots.desc=根系(不论是自然或魔法产生)缠到了脚上，将它们牢牢拴在地面。 \n\n根系会让目标被困在当前区域，使其不能移动，但不会干扰其他行为。 \n\n缠绕效果剩余时长：%s回合

actors.buffs.scrollempower.name=卷轴赋能
actors.buffs.scrollempower.desc=法师阅读卷轴时产生的能量会暂时强化他的法杖！\n\n法杖强化：+%1$d 级。\n剩余有效施法次数：%2$d 。

actors.buffs.shadows.name=暗影融合
actors.buffs.shadows.desc=你和周围的阴影融为一体，使你隐形并减缓你的新陈代谢。\n\n当你在隐形时敌人无法追踪或攻击你。大部分物理攻击和魔法(比如卷轴和法杖)会立即解除隐形效果。此外，当你处于暗影融合状态下时，饥饿值增加的速率会降低。\n\n暗影融合状态会一直持续直到你离开阴影或与敌人直接接触。

actors.buffs.slow.name=迟缓
actors.buffs.slow.desc=减速魔法影响了目标的时间流速，在目标眼中所有的事物都移动得飞快。 \n\n迟缓下的角色执行所有行动花费的时间是其执行相同行动的两倍。\n\n迟缓效果剩余时长：%s回合

actors.buffs.snipersmark.name=狙击标记
actors.buffs.snipersmark.action_name_snapshot=速射
actors.buffs.snipersmark.action_name_volley=齐射
actors.buffs.snipersmark.action_name_sniper=强射
actors.buffs.snipersmark.desc=狙击手会专注于最近射击的目标，能够用灵能弓进行一次特殊攻击，攻击方式取决于弓的改造方式。\n\n若持有未改造的弓，狙击手可发射_瞬时箭矢_，造成低于正常箭矢的伤害，但不消耗时间。\n\n若持有加强了速度的弓，狙击手可进行_三箭连发_。每支箭造成低于正常箭矢的伤害，但能触发附魔。消耗一回合。\n\n若持有加强了伤害的弓，狙击手可发射_狙击箭矢_。狙击箭矢必定命中，造成基于与目标距离的额外伤害，消耗两回合。

actors.buffs.soulmark.name=灵魂标记
actors.buffs.soulmark.desc=术士已经击穿了目标的灵魂。其在受到物理伤害时将会回复术士的生命。\n\n灵魂标记剩余时长：%s回合

actors.buffs.stamina.name=体力充沛
actors.buffs.stamina.desc=你感受到了体内无尽的精力，让你可以以更快的速度移动！\n\n当你处于体力充沛状态下你的移动速度将提升50%%，但是这不影响其他活动所消耗的时间。\n\n体力充沛剩余时长：%s回合。

actors.buffs.vulnerable.name=易伤
actors.buffs.vulnerable.heromsg=你感到外界的伤害愈加疼痛！
actors.buffs.vulnerable.desc=易伤魔法会使得目标受到所有被护甲减免过的物理伤害增加33%%。\n\n易伤效果剩余时长：%s回合。

actors.buffs.terror.name=恐惧
actors.buffs.terror.desc=恐惧是使敌人陷入不可控制的恐慌的操纵性魔法。 \n\n恐惧中的角色会远离自己的敌人，试图和敌人隔开尽可能多的门或墙。然而疼痛的冲击则会减少恐惧的持续时间。\n\n恐惧效果剩余时长：%s

actors.buffs.toxicimbue.name=毒性之力
actors.buffs.toxicimbue.desc=你体内被灌注了毒性能量！ \n\n在你移动时毒气会从你的身体中翻腾而出，伤害你的敌人。持续时间内免疫毒气和中毒效果。 \n\n毒性之力剩余时长：%s回合

actors.buffs.corrosion.name=酸蚀
actors.buffs.corrosion.heromsg=你正在被强酸溶解！
actors.buffs.corrosion.ondeath=你被彻底溶解掉了...
actors.buffs.corrosion.rankings_desc=被溶解
actors.buffs.corrosion.desc=强酸能以惊人的速度腐蚀掉血肉、金属和骨头。\n\n目标被腐蚀的时间越长，酸蚀伤害越高。\n\n酸蚀效果剩余时长：%1$s回合。\n当前酸蚀伤害：%2$d。

actors.buffs.vertigo.name=眩晕
actors.buffs.vertigo.desc=如果整个世界都在旋转的话,想走直线会变得十分困难。 \n\n眩晕效果持续时，目标的移动将会向一个随机区域进行，而不是目标原本想到达的地方。\n\n眩晕效果剩余时长：%s回合

actors.buffs.wandempower.name=盈能法杖
actors.buffs.wandempower.desc=你的伤害型法杖已被强化，接下来的几次施法将会造成额外伤害。\n\n额外伤害：%1$d。\n剩余施法次数：%2$d。

actors.buffs.weakness.name=虚弱
actors.buffs.weakness.heromsg=你感到力量正在被抽走！
actors.buffs.weakness.desc=你感觉自己的装备突然变得沉重起来。 \n\n虚弱魔法会减弱角色的物理力量，使其造成的伤害减少33%%。\n\n虚弱效果剩余时长：%s回合

actors.buffs.wellfed.name=饱腹
actors.buffs.wellfed.desc=你感觉自己吃的非常饱。\n\n当你处于饱腹状态时，你的饥饿值不会增加，并且会随着时间的推移恢复额外的生命值。\n\n状态剩余时长：%d回合



###hero

##abilities
actors.hero.abilities.armorability.self_target=你不能瞄准你自己！
actors.hero.abilities.armorability.no_target=这里没有任何目标！
actors.hero.abilities.armorability.prompt=选择释放能力的位置
actors.hero.abilities.armorability.cost=充能消耗：_%d_

## rector alibiities
## 牧师护甲技能
actors.hero.abilities.rector.lastprayer.name=终末圣祷
actors.hero.abilities.rector.lastprayer.short_desc=牧师可以使用_终末圣祷_，释放奇迹并脱离险境。
actors.hero.abilities.rector.lastprayer.desc=牧师将自己的生命值减少到1并且进行一次跳跃以脱离险境，并获得2回合的无敌。\n\n在此之后牧师会逐渐恢复生命值（1/1t），直至恢复到最大生命值的30%为止。
actors.hero.abilities.rector.lastprayer.prompt=选择要飞跃到的地方

actors.hero.abilities.rector.shadowhymn.name=暗影咒文
actors.hero.abilities.rector.shadowhymn.short_desc=牧师咏唱_暗影咒文_，咒文持续时间内，将回复的生命转化为视野对内敌人的伤害。
actors.hero.abilities.rector.shadowhymn.desc=牧师习得了另一派系的禁忌咒法。在30回合内，你所恢复的每点生命都会对视野内的所有敌人造成等量伤害，但当你使用祈祷效果时该效果将立刻结束。

actors.hero.abilities.rector.godspossesion.name=凡体受神
actors.hero.abilities.rector.godspossesion.short_desc=牧师使出_凡体受神_，短暂地以神圣的化身对敌，期间拥有多种增益效果。
actors.hero.abilities.rector.godspossesion.desc=牧师将引导神明降临于自己的身体中，哪怕只有一小会。\n\n获得30回合祝福效果，并获得30回合的所有精英词条效果。在技能时间结束后，牧师会虚弱10回合。


actors.hero.abilities.warrior.heroicleap.name=英勇之跃
actors.hero.abilities.warrior.heroicleap.prompt=选择要飞跃到的地方
actors.hero.abilities.warrior.heroicleap.short_desc=战士能向指定地点使用_英勇之跃_，越过所有的敌人与环境。
actors.hero.abilities.warrior.heroicleap.desc=战士向指定地点跳跃，越过路径上的所有敌人与环境。不过战士无法越过墙壁或是其它实体地形。
actors.hero.abilities.warrior.shockwave.name=震地冲击
actors.hero.abilities.warrior.shockwave.short_desc=战士大力锤击地面，向一个锥形区域施以_震地冲击_。被冲击波击中的敌人会受到一定伤害并陷入残废。
actors.hero.abilities.warrior.shockwave.desc=战士大力锤击地面产生冲击波，冲击波将震击前方 60 度扇形范围 5 格距离内的区域。\n\n被冲击波击中的敌人会陷入 5 回合残废并受到 5~10 点伤害。战士超过10的每点力量会使得该伤害增加 1~2 点。
actors.hero.abilities.warrior.endure.name=苦痛坚忍
actors.hero.abilities.warrior.endure$enduretracker.name=苦痛之怒
actors.hero.abilities.warrior.endure$enduretracker.desc=战士将忍受的原始伤害织成愤怒，将大量的额外伤害倾泻给敌人。\n\n额外伤害：%1$d\n剩余攻击次数：%2$d
actors.hero.abilities.warrior.endure.short_desc=战士_苦痛坚忍_，跳过若干回合并大幅抵抗伤害。接下来战士会根据忍受的原始伤害造成额外伤害。
actors.hero.abilities.warrior.endure.desc=战士首先忍耐3回合，将任何受到的伤害减少一半。此减伤效果优先于其它减伤计算。\n\n在此之后，战士在10回合内的下一次攻击将造成额外伤害。额外伤害等同于在忍耐期间所有受到的原始伤害的一半。\n\n如果战士处于连击状态，此能力将补偿3回合连击时间。

actors.hero.abilities.mage.elementalblast.name=元素风暴
actors.hero.abilities.mage.elementalblast.short_desc=法师从老魔杖中释放_元素风暴_，席卷以自身为中心的一大片圆形区域，造成伤害并基于灌注的法杖引发不同的效果。
actors.hero.abilities.mage.elementalblast.desc=法师释放出风暴般的魔力，席卷半径为4的圆形区域，对其中的目标造成15-25点伤害。元素风暴引发的特效随老魔杖灌注的法杖而变。
actors.hero.abilities.mage.elementalblast.generic_desc=元素风暴引发的效果与法杖向目标施法的效果类似。
actors.hero.abilities.mage.wildmagic.name=狂野魔法
actors.hero.abilities.mage.wildmagic.no_wands=你没有法杖可供施法！
actors.hero.abilities.mage.wildmagic.short_desc=法师引导出法杖中的_狂野魔法_，在单回合内对指定目标随机释放这些法杖多次。
actors.hero.abilities.mage.wildmagic.desc=法师引导出法杖的魔力，在一回合内随机释放法杖至多4次。该能力不会释放法师的老魔杖。\n\n这个能力释放法杖时，法杖视为上升2级，最高可至+3。该能力消耗法杖充能，每根法杖最多释放两次。
actors.hero.abilities.mage.warpbeacon.name=空间信标
actors.hero.abilities.mage.warpbeacon.depths=你无法传送到其它楼层！
actors.hero.abilities.mage.warpbeacon.locked_floor=楼层被封锁了，你无法离开！
actors.hero.abilities.mage.warpbeacon.too_far=这个位置太远了！
actors.hero.abilities.mage.warpbeacon.invalid_beacon=你不能将信标放在那里！
actors.hero.abilities.mage.warpbeacon.window_desc=你的信标目前设置在了第%d层。
actors.hero.abilities.mage.warpbeacon.window_tele=返回信标位置
actors.hero.abilities.mage.warpbeacon.window_clear=移除信标
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.short_desc=法师在当前位置设置了一个_空间信标_，他能瞬间传送回信标所在位置。
actors.hero.abilities.mage.warpbeacon.desc=法师设置了一个可以随时返回的信标。信标设置需要1回合，但传送回不消耗时间。\n\n法师在初始条件下无法传送至别的楼层，不能将其放入不可达的区域如上锁的房间。法师返回时若是目标地点有敌人，则会将其弹开。

actors.hero.abilities.rogue.smokebomb.name=烟幕爆炸
actors.hero.abilities.rogue.smokebomb.fov=你只能跳到视野范围内的空格子里
actors.hero.abilities.rogue.smokebomb.prompt=选择要跳到的位置
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木桩替身
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=不知为何敌人坚信这就是盗贼本身。
actors.hero.abilities.rogue.smokebomb.short_desc=盗贼在原地制造一场_烟幕爆炸_后闪现离去，并使原点周围的敌人失明。
actors.hero.abilities.rogue.smokebomb.desc=盗贼在原地制造一场烟幕爆炸，并闪现最多10格的距离。闪现无视敌人与环境，但仍会被固态地形如墙壁阻挡。\n\n盗贼原位置周围的敌人将失明5回合。
actors.hero.abilities.rogue.deathmark.name=夺命印记
actors.hero.abilities.rogue.deathmark.ally_target=你只能标记敌人。
actors.hero.abilities.rogue.deathmark.short_desc=盗贼向选中的敌人施加_夺命印记_。被标记的敌人将受到额外伤害，但不会在标记期间死亡。
actors.hero.abilities.rogue.deathmark.desc=盗贼标记选中的敌人，使其受到额外25%的伤害。标记不耗费时间且持续5回合。\n\n被标记的敌人受到额外伤害，但并不会在标记期间死亡。生命值耗尽的目标在标记结束时立即死亡。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=夺命印记
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=这名被标记的敌人受到25%%的额外伤害，但不会在标记期间死亡。\n\n标记剩余时长：%s回合。
actors.hero.abilities.rogue.shadowclone.name=暗影映像
actors.hero.abilities.rogue.shadowclone.short_desc=盗贼召唤一个_暗影映像_，并能使唤其帮助自己战斗。
actors.hero.abilities.rogue.shadowclone.desc=盗贼召唤一个暗影映像，并能使唤其帮助自己战斗。使唤映像不会消耗充能。\n\n映像拥有80点生命与10-20点近战伤害，在激活天赋后这些属性可受到其主人武器与护甲的增益。
actors.hero.abilities.rogue.shadowclone$shadowally.name=暗影映像
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=你的分身去了那个方向。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=你的映像正在跟随你。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=你的映像正在发动攻击！
actors.hero.abilities.rogue.shadowclone$shadowally.desc=一具无形暗影塑造出的盗贼复制体，它一动不动双目空空，烟雾般的黑暗在周围缓缓升腾。\n\n它虽说不上是个完美的复制体，但也是个合格的杀手，并且在特定天赋加持下能从其主人的装备中获益。

actors.hero.abilities.huntress.spectralblades.name=灵魂飞刃
actors.hero.abilities.huntress.spectralblades.short_desc=女猎手向一个目标掷出_灵魂飞刃_，根据装备的近战武器造成伤害。
actors.hero.abilities.huntress.spectralblades.desc=女猎手向一名敌人掷出灵能飞刃，就像用近战武器进行远程攻击。该攻击保留包括附魔的所有近战攻击效果。
actors.hero.abilities.huntress.naturespower.name=自然之力
actors.hero.abilities.huntress.naturespower.short_desc=女猎手呼唤_自然之力_的协助，在短时间内增加其移动速度与灵能短弓射击速度。
actors.hero.abilities.huntress.naturespower.desc=女猎手与她的弓注入了自然的力量！这种力量持续 8 回合。\n\n在自然之力的加持下，女猎手拥有双倍的移动速度与+33%的灵能短弓射击速度。这种力量不影响狙击手专精的追加攻击。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然之力
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=女猎手拥有了暂时的自然之力，增加其移动速度与灵能短弓射击速度。\n\n剩余回合数：%s。
actors.hero.abilities.huntress.spirithawk.name=灵能飞鹰
actors.hero.abilities.huntress.spirithawk.no_space=你附近没有可用于召唤的空地。
actors.hero.abilities.huntress.spirithawk.short_desc=女猎手召唤一只_灵能飞鹰_使魔，协助侦查地形并分散敌人。
actors.hero.abilities.huntress.spirithawk.desc=女猎手召唤一只灵能飞鹰，飞鹰存在时使用此能力可指引其行动。飞鹰将存在 100 回合，指引飞鹰不消耗任何充能。\n\n灵能飞鹰脆弱且缺乏攻击力，但其迅捷的移动、灵敏的躲避与精准的攻击对这些缺点有所弥补。飞鹰与女猎手共享视野，免疫所有环境效果，例如火焰、毒气等。飞鹰只在女猎手指引下发起攻击。
actors.hero.abilities.huntress.spirithawk$hawkally.name=灵能飞鹰
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=你的灵能飞鹰移动到了那个位置。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=你的飞鹰正在跟随你。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=你的飞鹰正在发动攻击！
actors.hero.abilities.huntress.spirithawk$hawkally.desc=一只女猎手召唤的灵能飞鹰，它全身散发着明亮而空灵的蓝光，它不断扭头探查着周围环境。\n\n飞鹰并不适合武力战斗，但其速度与视野使其能够胜任高效的侦查与危险的引敌任务。\n\n飞鹰将在%d回合后消散。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=飞鹰将必定闪避接下来的%d次攻击。

actors.hero.abilities.ratmogrify.name=鼠化术
actors.hero.abilities.ratmogrify.cant_transform=这个目标无法被鼠化！
actors.hero.abilities.ratmogrify.too_strong=这名敌人过于强大，鼠化术无效！
actors.hero.abilities.ratmogrify.short_desc=你可以施展_鼠化术_将目标敌人变形！敌人会暂时变为失去所有特殊能力的老鼠。
actors.hero.abilities.ratmogrify.desc=你能将敌人变为小鼠6回合！不过你无法变形 Boss，盟友或是小鼠本身。\n\n鼠化的敌人会继承原属性值，但失去所有特殊能力。
actors.hero.abilities.ratmogrify$transmograt.name=鼠化%s
actors.hero.abilities.ratmogrify$transmograt.desc=这名敌人被变成了一只老鼠。对我来说的话，都是好事！——鼠王
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=死于：鼠化敌人

##main hero
actors.hero.hero.name=你
actors.hero.hero.leave=现在还不能离去，埋藏在地牢之下的名利正呼唤着你！
actors.hero.hero.level_up=升级！
actors.hero.hero.new_level=升级！精准+，闪避+，最大生命值 +5！
actors.hero.hero.new_talent=天赋点 +1！
actors.hero.hero.unspent=你还有尚未使用的天赋点！
actors.hero.hero.level_cap=你不能变得更强了，不过你的经验给了你一股力量！
actors.hero.hero.you_now_have=你获得了：%s。
actors.hero.hero.you_cant_have=你无法携带：%s。
actors.hero.hero.locked_chest=箱子锁着而你没有对应的钥匙
actors.hero.hero.locked_door=你没有对应的钥匙。
actors.hero.hero.noticed_smth=你注意到了些什么。
actors.hero.hero.wait=…
actors.hero.hero.search=搜索
actors.hero.hero.search_distracted=你没办法集中精力，探索周边异常费力。
actors.hero.hero.pain_resist=疼痛使你得以抵抗睡意。
actors.hero.hero.revive=重生十字章迸裂出苏生的能量！
actors.hero.hero.wheelchair_needed=你是一个残疾猫，不能在没有轮椅的情况下走路。

##classes
actors.hero.heroclass.warrior=战士
actors.hero.heroclass.warrior_desc_short=战士从他的_破损纹章_中获得额外伤害减免。纹章可以在护甲之间转移，并且可以_携带一级升级_。
actors.hero.heroclass.warrior_desc=战士初始携带一枚可以贴附于护甲的_独特破损纹章_。他在装备附着纹章的护甲时会随时间产生生命值之上的护盾值。纹章可以在护甲之间转移，并且可以携带一级升级。\n\n同时，战士初始携带一柄_破旧的短剑_，_三块投石_，布甲，水袋与绒布包。\n\n战士开局鉴定的物品有：\n_-_鉴定卷轴\n_-_治疗药水\n_-_盛怒卷轴
actors.hero.heroclass.warrior_unlock=战士开局即解锁。

actors.hero.heroclass.mage=法师
actors.hero.heroclass.mage_desc_short=法师是一位奥术专家，开局持有一根强于法杖的_老魔杖_。法师可以将_任何法杖灌注进_老魔杖。
actors.hero.heroclass.mage_desc=法师初始携带一把_老魔杖_。老魔杖的自动充能速度显著快于一般法杖，并且有 1 点额外最大充能数。法师可以将地牢中找到的各式法杖灌注到老魔杖中。\n\n同时，法师初始携带一把已灌注了_魔弹法杖_的老魔杖、布甲、水袋与绒布包。\n\n法师开局鉴定的物品有：\n_- _鉴定卷轴\n_- _液火药剂\n_-_ 升级卷轴
actors.hero.heroclass.mage_unlock=_在游戏中用升级卷轴强化一个道具_以解锁法师。

actors.hero.heroclass.rogue=盗贼
actors.hero.heroclass.rogue_desc_short=盗贼能借助他的_暗影斗篷_来躲避和偷袭敌人。他还可以从更远的距离_探测秘密与陷阱_。
actors.hero.heroclass.rogue_desc=盗贼初始携带一件独特神器：_暗影斗篷_。 穿上后，盗贼可以随时隐形。\n\n盗贼能从更远的距离_探测秘密与陷阱_。\n\n同时，盗贼初始携带一柄_匕首_，_三把飞刀_，布甲，水袋与绒布包。\n\n盗贼开局鉴定的物品有：\n_-_鉴定卷轴\n_-_隐形药剂\n_-_探地卷轴
actors.hero.heroclass.rogue_unlock=_在一场游戏中进行十次伏击_以解锁盗贼。

actors.hero.heroclass.huntress=女猎手
actors.hero.heroclass.huntress_desc_short=女猎手精通投掷武器，并且具有一把能无限射击的_独特灵能弓_。女猎手可以穿过高草丛而_不将其践踏成草地_。
actors.hero.heroclass.huntress_desc=女猎手初始携带一把独特的_灵能短弓_，拥有无限的魔法弹药。\n\n女猎手可以穿过高草丛而_不将其践踏成草地_。\n\n同时，女猎手初始携带一副_镶钉手套_，布甲，水袋与绒布包。\n\n女猎手开局鉴定的道具有：\n_-_鉴定卷轴\n_-_灵视药剂\n_-_催眠卷轴
actors.hero.heroclass.huntress_unlock=_在一场游戏中使用投掷武器命中十次敌人_以解锁女猎手。

actors.hero.heroclass.moonlight=月华
actors.hero.heroclass.moonlight_desc_short=月华是游戏高手，拥有丰富的经验和技巧，还有自己改装的_轮椅_，让他在战场中机动自如。不过，月华的身体稍弱。
actors.hero.heroclass.moonlight_desc=作为久经沙场的老将，月华初始携带所有角色的初始武器，并且切换武器不消耗回合。\n\n月华还携带着一辆经由他手改装的_轮椅_，使用_轮椅_可以进行一次短距跳跃，并获得一段时间的爆发加速。\n\n同时，月华初始携带布甲，水袋与魔法筒袋。\n\n月华开局鉴定的道具有：\n_-_ 力量药剂\n_-_ 升级卷轴\n_-_ 鉴定卷轴\n_-_ 以及四种随机卷轴与药水
actors.hero.heroclass.moonlight_unlock=_通关一局Slice & Dice不公难度_以解锁月华。

actors.hero.heroclass.rector=牧师
actors.hero.heroclass.rector_desc_short=牧师初始携带_金属十字架_，_羽翼之戒_，口粮，水袋，与卷轴筒。
actors.hero.heroclass.rector_desc=牧师可以通过在地牢中获取经验来积攒_信仰值_与神建立联系，信仰技能可以造成伤害、给予_临时生命_、_加速_、_驱除诅咒_、还可以向神祈祷来得到可能的恩赐。\n\n同时，牧师初始携带_金属十字架_，_羽翼之戒_，口粮，水袋，与卷轴筒。\n\n牧师对_亡灵_和_恶魔_有120%的精准修正，牧师在使用_法杖_和_任意法力结晶_之后与神的联系将被扰乱，期间无法使用信仰技能。\n\n牧师开局鉴定的物品有：\n_-_鉴定卷轴\n_-_经验药剂\n_-_驱邪卷轴
actors.hero.heroclass.rector_unlock=牧师仍处在测试阶段，但已经开发完成，敬请体验！\n\n若你发现bug，可加入首页的萝卜总群反馈给开发者。

actors.hero.herosubclass.berserker=狂战士
actors.hero.herosubclass.berserker_short_desc=_狂战士_在造成伤害的时候会积累怒气，怒气能提高狂战士的攻击力，并可在其达到100%时激活以获得额外护盾值。
actors.hero.herosubclass.berserker_desc=_狂战士_在造成物理伤害时会积累怒气，怒气会随时间稳定消逝，但在狂战士生命值较低时流失得更慢。\n狂战士在积累100%怒气时达到最大的50%伤害加成。在这种情况下，狂战士还可以进入狂暴状态，根据自身已损失生命值获得2~6倍的纹章护盾值，且在有护盾剩余时怒气值始终保持在100%。但是，狂战士在狂暴结束之后也会需要时间恢复气力。
actors.hero.herosubclass.gladiator=角斗士
actors.hero.herosubclass.gladiator_short_desc=_角斗士_会在成功进行攻击时积累连击数。角斗士可以消耗连击数以使用特殊战技。
actors.hero.herosubclass.gladiator_desc=每当角斗士使用近战武器或投掷武器命中后，都会积累一点连击数。若角斗土没能在4回合内再次成功命中，连击将被重置。\n\n随着连击数的积累，角斗士能使用战技进行战斗。连击数积累到1,3,5,7,9时将获得一次战技的使用次数。当连击数达到7时，角斗士可以将所有技能转化为强大的终结技。\n\n一次连击过程中，释放过的战技将无法再次释放，包括作为终结技释放。
actors.hero.herosubclass.battlemage=战斗法师
actors.hero.herosubclass.battlemage_short_desc=_战斗法师_在使用老魔杖近战攻击时会附带额外的法术效果。这些效果取决于老魔杖内灌注的法杖类型。
actors.hero.herosubclass.battlemage_desc=战斗法师使用老魔杖近战时会附带类似附魔的额外效果，效果取决于老魔杖吸收的法杖类型，每种法杖各不相同。老魔杖在近战中还会恢复0.5点充能。
actors.hero.herosubclass.warlock=术士
actors.hero.herosubclass.warlock_short_desc=_术士_在对敌人使用法杖时有几率为其带上灵魂标记。只要术士对被标记的敌人造成物理伤害，自身就会回复生命值。
actors.hero.herosubclass.warlock_desc=术士在对敌人使用法杖时有几率为其带上灵魂标记。施加标记的几率与标记的持续时间随法杖等级增加而上升。\n\n在攻击被标记的敌人时，每造成5点伤害，术士将回复2点生命值。这种效果只会在造成物理伤害时出现，若使用法杖造成伤害则不会触发它。
actors.hero.herosubclass.assassin=刺客
actors.hero.herosubclass.assassin_short_desc=隐形时，_刺客_会准备一次致命的攻击。耐心等得越久，这一击的威力越强。
actors.hero.herosubclass.assassin_desc=刺客在隐形中准备着强力的一击。隐形时间越长，下次攻击就越致命，9回合时达到最强效果。\n\n刺客遁出阴影，对目标打出强力一击。刺客可以闪现到目标背后，也能立刻处决较弱的目标。
actors.hero.herosubclass.freerunner=疾行者
actors.hero.herosubclass.freerunner_short_desc=_疾行者_在奔跑时会累积动量。动量可以用于开启逸动效果，让他在短时间内拥有更高的移动速度和更强的闪避能力。
actors.hero.herosubclass.freerunner_desc=_疾行者_在奔跑时会累积动量。动量最多累积10点，在不动时会迅速衰减。动量可以开启逸动状态，每点动量可供疾行者飞奔两回合。\n\n逸动状态下的疾行者以双倍速度跑动，并获得正比于自身等级的闪避。逸动状态结束后，疾行者需小休一会以重新开始积累动量。
actors.hero.herosubclass.sniper=狙击手
actors.hero.herosubclass.sniper_short_desc=_狙击手_的远程攻击能穿透护甲。用投掷武器击中目标后，狙击手能以灵能短弓进行一次特殊追击。
actors.hero.herosubclass.sniper_desc=狙击手是远程战斗大师。她的远程攻击无视防御。使用投掷物击中敌人后，女猎手能对目标施以狙击标记，并可以使用灵能短弓对此敌人发射一次追击，追击的形式取决于弓的改造模式。\n\n未改造的弓会速射一只伤害稍低的箭矢，但不消耗任何时间。改造速度的弓会三箭连射，每只箭的伤害较低但能触发附魔，消耗 1 回合。改造伤害的弓会强射一只必定命中的狙击箭矢，根据距离造成额外伤害，但需要消耗 2 回合。
actors.hero.herosubclass.warden=守望者
actors.hero.herosubclass.warden_short_desc=_守望者_具有穿透高草的视野，而且在种植和踩踏植物时会获得额外效果。
actors.hero.herosubclass.warden_desc=守望者与自然之力有强大的联结，这赋予了她多项有关植物的能力。守望者具有穿透高草与枯草的视野。\n\n守望者种下的种子周围会生出草，在踩踏植物时会获得额外效果取代原本效果，使得所有植株对其完全无害。

actors.hero.herosubclass.battlepreist=战斗牧师
actors.hero.herosubclass.battlepreist_short_desc=_战斗牧师_的惩击更为强力，并拥有额外目标。光能灌注与祈祷的效果加强。
actors.hero.herosubclass.battlepreist_desc=_战斗牧师_的惩击伤害会增加50%并会额外指定一个视野内的随机目标，光能灌注的效果变更至获得区域数*12点临时生命与区域数*4回合激素涌动。\n\n祈祷技能变更为获得增伤，免伤与祝福的赐福技能。

actors.hero.herosubclass.redcardinal=红衣主教
actors.hero.herosubclass.redcardinal_short_desc=_红衣主教_能够从经验中获得更多的信仰值，使用信仰技能不消耗回合，并习得两个新技能。
actors.hero.herosubclass.redcardinal_desc=_红衣主教_对信仰的理解更加精深，他每获得10点经验值则会额外获得1点信仰值，使用信仰技能不消耗回合，并习得两个新技能。\n\n_-_ 圣火：使用于普通火焰不同的圣火点燃目标，并使其受到的伤害大幅增加。\n_-_ 圣地：使得踏入圣地的敌人移速减缓，对亡灵和恶魔更加有效且具有伤害性。

actors.hero.herosubclass.dead_knight=执行者
actors.hero.herosubclass.dead_knight_short_desc=_执行者_获得信仰的方式更改，信仰技能变更为更有攻击性的技能。
actors.hero.herosubclass.dead_knight_desc=_执行者_是教会的黑暗面，负责为信仰的传播扫清道路。获得信仰值的方式更改为使用物理或流血伤害击杀敌人。\n\n_信仰技能改变为对敌人施加流血或直接击杀大量敌人_。\n\n执行者可以不消耗回合的在_初始与执行模式_下切换，在_执行模式下执行者击杀敌人_不会获得经验，转而会对_视野范围内的所有敌人造成等同于应获得经验的_伤害。

actors.hero.herosubclass.dice_mage=骰子法师
actors.hero.herosubclass.dice_mage_short_desc=_骰子法师_在使用法杖时积攒魔力，且可以使用积攒的魔力释放威力强大的异世界法术。
# actors.hero.herosubclass.dice_mage_desc_=_骰子法师_在使用法杖后将会获得0.5+法杖等级*0.05点_魔力点_，可以使用_魔力点_释放多种功能各异的强大法术。\n\n也可以在炼金台中使用1点_炼金能量_兑换1点_魔力点_。\n\n初始自带切割和愈合法术。然而，超过3点部分的_魔力点_，每10回合便会被清空！\n\n_切割_ :\n消耗3点魔力点，使视野范围内的所有敌人均分50点魔法伤害。每个敌人至多因此受到10点伤害。\n\n_愈合_:\n消耗2点魔力点，将自身的生命值设置为50。每使用一次这个值就降低5。
actors.hero.herosubclass.dice_mage_desc_=_骰子法师_在使用法杖后将会获得_0.5+法杖等级*0.05点_魔力点，可以使用_魔力点_释放多种功能各异的强大法术。\n\n也可以在炼金台中使用1点炼金能量兑换1点魔力点。\n\n初始拥有_切割_和_愈合_。
actors.hero.herosubclass.jutte_champion=十手冠军
actors.hero.herosubclass.jutte_champion_short_desc=_十手冠军_能够把任何武器转化为同等阶数的性能优越的十手。不过这种威力强大的武器并不是非常耐用。
actors.hero.herosubclass.jutte_champion_desc=_十手冠军_能够把任何武器转化为同等阶数的性能优越的十手。十手的攻速较快，有一定格挡，并且可以投掷，缺点是攻击和投掷都需要消耗耐久。十手的力量需求固定为_10+，伤害按照阶数为_5/6/8/9/10~20/24/32/36/40_，攻击延迟为_0.75_，格挡为_2/2/3/3/4~4/5/6/7/8_，精准为1.25倍，拥有50点耐久度。近战与投掷命中均会消耗耐久度。_无法升级_。

actors.hero.herosubclass.little_knight=小骑士
actors.hero.herosubclass.little_knight_short_desc=_小骑士_切换武器时可以发动不消耗回合的取消攻击，如果周围的怪物较多还可以将它们踹飞。
actors.hero.herosubclass.little_knight_desc_=_小骑士_掌握了神秘的酷酷习题之力，在切换武器后可以对敌人立刻发动一次取消攻击，投掷武器会附带2+区域层中毒。小骑士在周围有3个或以上敌人时，还可以立刻将它们踹飞3格。


actors.hero.herosubclass.super_desc=以下是_%s_的恶魔之力天赋预览界面。

##talents
actors.hero.talent$lingeringmagictracker.name=波涌余威
actors.hero.talent$lingeringmagictracker.desc=法师刚刚使用了魔杖或法杖，他的下一次物理攻击将造成额外伤害。\n\n剩余回合数：%s
actors.hero.talent$improvisedprojectilecooldown.name=即兴投掷-冷却
actors.hero.talent$improvisedprojectilecooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合。
actors.hero.talent$rejuvenatingstepscooldown.name=复春步伐-冷却
actors.hero.talent$rejuvenatingstepscooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合。
actors.hero.talent$seershotcooldown.name=探地之矢-冷却
actors.hero.talent$seershotcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合。
actors.hero.talent$dueldancemissiletracker.name=决斗之舞-投掷加速
actors.hero.talent$dueldancemissiletracker.desc=保持战斗的节奏！\n\n使用投掷武器的速度加快。
actors.hero.talent$dueldancewandtracker.name=决斗之舞-施法加速
actors.hero.talent$dueldancewandtracker.desc=保持战斗的节奏！\n\n使用法杖的速度加快。
actors.hero.talent$holdbreathtracker.name=屏息凝神
actors.hero.talent$holdbreathtracker.desc=全神贯注，准备下一次射击。\n\n当前的暴击率增益：_%1$s%%_\n当前的暴击倍率增益：_%2$s_
actors.hero.talent$hideincrowdcooldown.name=隐没于人-冷却
actors.hero.talent$hideincrowdcooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余冷却：%s回合。

#warrior
actors.hero.talent.hearty_meal.title=丰盛一餐
actors.hero.talent.hearty_meal.desc=_+1：_战士在生命值低于50%的时候进食会恢复_2点生命_，生命值低于25%的时候会恢复_3点生命_。\n\n_+2：_战士在生命值低于50%的时候进食会恢复_3点生命_，生命值低于25%的时候会恢复_5点生命_。
actors.hero.talent.armsmasters_intuition.title=兵师直觉
actors.hero.talent.armsmasters_intuition.desc=_+1：_战士鉴定武器和护甲的速度提升为原来的_两倍_。\n\n_+2：_战士会瞬间鉴定_他装备的_武器与护甲。

actors.hero.talent.provoked_anger.title=受衅怒火
actors.hero.talent.provoked_anger.desc=_+1：_当战士的护盾被击碎时，他的下一次物理攻击将造成_1~2点额外伤害_。\n\n_+2：_当战士的护盾被击碎时，他的下一次物理攻击将造成_2点额外伤害_。

actors.hero.talent$provokedangertracker.name=受衅怒火
actors.hero.talent$provokedangertracker.desc=战士刚刚失去护盾，他的下一次物理攻击将造成额外伤害。\n\n剩余回合数：%s

actors.hero.talent.iron_will.title=钢铁意志
actors.hero.talent.iron_will.desc=_+1：_ 战士在斩杀敌人后获得_2点护盾_。\n\n_+2：_ 战士在斩杀敌人后获得_3点护盾_。
actors.hero.talent.iron_stomach.title=钢铁之胃
actors.hero.talent.iron_stomach.desc=_+1：_战士进食只花费一个回合，并在进食过程中获得_ 75% 的伤害抗性_。\n\n_+2：_战士进食只花费一个回合，并在进食过程中获得_ 100% 的伤害抗性_ 。

actors.hero.talent.emergency_protection.title=紧急防护
actors.hero.talent.emergency_protection.desc=_+1：_每当战士受到一次直接损失生命值的物理伤害后，战士获得_2_点仅存在于下回合的护盾。\n\n_+2：_每当战士受到一次直接损失生命值的物理伤害后，战士获得_4_点仅存在于下回合的护盾。

actors.hero.talent.runic_transference.title=精巧纹章
actors.hero.talent.runic_transference.desc=_+1：_战士的纹章可以被刻印或诅咒，这个刻印或诅咒会与盔甲的刻印_共存_。\n\n_+2：_战士的纹章可以被刻印或诅咒，这个刻印或诅咒会与盔甲的刻印_共存_，战士纹章上的正面刻印效果强度上升_25%_。\n\n若纹章上的刻印与盔甲上的相同，则盔甲上的刻印触发时视为有额外1级。
actors.hero.talent.lethal_momentum.title=手起刀落
actors.hero.talent.lethal_momentum.desc=_+1：_战士斩杀敌人的一击少消耗至多_1_回合。\n\n_+2：_战士斩杀敌人的一击少消耗至多_1.5_回合。
actors.hero.talent.improvised_projectiles.title=即兴投掷
actors.hero.talent.improvised_projectiles.desc=_+1：_战士向敌人扔出非投掷武器的物品时会对其造成 _2 回合_的致盲效果。这个天赋有 50 回合的冷却时间。\n\n_+2：_战士向敌人扔出非投掷武器的物品时会对其造成 _3 回合_的致盲效果。这个天赋有 50 回合的冷却时间。

actors.hero.talent.keep_vigilance.title=保持警惕
actors.hero.talent.keep_vigilance.desc=_+1：_角斗之王的连击丢失时间延长至_6回合_。\n\n_+2：_角斗之王的连击丢失时间延长至_15回合_。\n\n_+3：_角斗之王的_连击数将不会因时间推移而丢失_。

actors.hero.talent.vent_noplace.title=娴熟技艺
actors.hero.talent.vent_noplace.desc=_+1：_当角斗之王释放终结技时，将会立即获得_+1连击数_。\n\n_+2：_角斗之王在_连击数达到5_时即可释放连击技能。\n\n_+3：_角斗之王在释放终结技时将会立刻获得_2点连击数_。

actors.hero.talent.hold_fast.title=不动如山
actors.hero.talent.hold_fast.desc=_+1:_战士获得_0~2_点护甲, 当战士受到冻伤，冰冻，迟缓，缠绕，残疾，麻痹等_异常效果_影响时，该效果乘3倍。\n\n_+2:_战士获得_0~4_点护甲, 当战士受到冻伤，冰冻，迟缓，缠绕，残疾，麻痹等_异常效果_影响时，该效果乘3倍。\n\n_+3:_战士获得_0~6_点护甲, 当战士受到冻伤，冰冻，迟缓，缠绕，残疾，麻痹等_异常效果_影响时，该效果乘3倍。
actors.hero.talent.strongman.title=排山倒海
actors.hero.talent.strongman.desc=战士能够从较慢的攻击速度中获取增益。\n\n_+1：_战士的物理攻击耗时每超出1回合1%，便具有0.33%/0.5%的伤害/精准加成。\n\n_+2：_战士的物理攻击耗时每超出1回合1%，便具有0.66%/1%的伤害/精准加成。\n\n_+3：_战士的物理攻击耗时每超出1回合1%，便具有1%/1.5%的伤害/精准加成。\n\n_斩舰刀_攻击前 1 回合的等待时间也被计算到整体攻击间隔中。

actors.hero.talent.iron_muscle.title=钢筋铁骨
actors.hero.talent.iron_muscle.desc=_+1:_战士对_流血_有50%抗性。\n\n_+2:_战士对_流血_和_残疾_有50%抗性。\n\n_+3:_战士对_流血_、_残疾_和_失明_有50%抗性。\n\n_+4:_除+3的增益外，战士在血量低于_50%_时获得_25%_减伤。
actors.hero.talent.moving_defense.title=移动堡垒
actors.hero.talent.moving_defense.desc=_+1:_战士每次移动都有_34%_概率获得1点护盾。\n\n_+2:_战士每次移动都有_67%_概率获得1点护盾。\n\n_+3:_战士每次移动都会获得1点护盾。\n\n_+4:_除+3的增益外，战士在拥有护盾时，防御增加_2~8_。\n\n通过此天赋获得的护盾不会超过战士的等级。

actors.hero.talent.endless_rage.title=怒火滔天
actors.hero.talent.endless_rage.desc=_+1：_狂战士的怒气上限提升至_150%_，怒气所带来的伤害最大加成上升至75%。\n\n_+2：_狂战士的怒气上限提升至_175%_，怒气所带来的伤害最大加成上升至87.5%。\n\n_+3：_狂战士的怒气上限提升至_200%_，怒气所带来的伤害最大加成上升至100%。

actors.hero.talent.fanaticism_magic.title=狂热施法
actors.hero.talent.fanaticism_magic.desc=_+1：_狂战士所造成的任何_法术伤害_都将会以_50%的速率_积累怒气\n\n_+2：_除去1级天赋的加成外，狂战士目前每拥有75%的怒气，他的所有法杖便视为拥有_1级额外的虚拟等级_。\n\n_+3：_除去1级天赋的加成外，狂战士每拥有_50%的怒气_，他的所有法杖便视为拥有_1级额外的虚拟等级_。
actors.hero.talent.pain_scar.title=苦痛刻痕
actors.hero.talent.pain_scar.desc=_+1：_当狂战士受到致命伤害时，若此时其怒气值大于_20%_，将会通过扣除_20%_怒气值与_20_点最大生命值来免疫本次伤害。\n\n_+2：_当狂战士受到致命伤害时，若此时其怒气值大于_15%_，将会通过扣除_15%_怒气值与_15_点最大生命值来免疫本次伤害。\n\n_+3：_当狂战士受到致命伤害时，若此时其怒气值大于_10%_，将会通过扣除_10%_怒气值与_10_点最大生命值来免疫本次伤害。
actors.hero.talent.resistdeath=致死伤害被抵挡了！
actors.hero.talent.resistdeath.title=致死伤害免疫
actors.hero.talent.resistdeath.desc=你当前可通过苦痛刻痕天赋或者是重生十字章来抵御致死伤害，请选择
actors.hero.talent.resistdeath.prompt=选择一项
actors.hero.talent.resistdeath.cancel=默认选择（十字章）
actors.hero.talent.revenge_roar.title=复仇怒号
actors.hero.talent.revenge_roar.desc=狂战士习得技能_复仇怒号_，可以消耗1回合使用，对视野中的所有敌人造成减益。\n\n_+1：_造成5回合_残疾_，消耗_75%_怒气。\n\n_+2：_造成5回合_残疾和失明_，消耗_65%_怒气，不再消耗时间。\n\n_+3：_造成5回合_残疾和失明_，消耗_50%_怒气，不再消耗时间。\n\n_+4：_造成5回合_残疾和失明_，并附加一次武器攻击的伤害，消耗_50%_怒气，不再消耗时间。
actors.hero.talent.thirsty_blade.title=嗜血之刃
actors.hero.talent.thirsty_blade.desc=_+1：_狂战士攻击时恢复相当于伤害_2%_的生命。\n\n_+2：_狂战士攻击时恢复相当于伤害_4%_的生命。\n\n_+3：_狂战士攻击时恢复相当于伤害_6%_的生命。\n\n_+4：_狂战士攻击时恢复相当于伤害_8%_的生命。\n\n 这个天赋具有20回合冷却时间。

actors.hero.talent.cleave.title=时刻警惕
actors.hero.talent.cleave.desc=+1：角斗士的连击丢失时间延长至6回合。\n\n+2：角斗士的连击丢失时间延长至15回合。\n\n+3：角斗士的连击将不再丢失。
actors.hero.talent.lethal_defense.title=以战养战
actors.hero.talent.lethal_defense.desc=+1：当角斗士在2回合内连续使用了普通技能和终结技，他在终结技后获得1点连击数，2回合的激素涌动。\n\n+2：当角斗士在3回合内连续使用了普通技能和终结技，他在终结技后获得2点连击数，2回合的激素涌动。\n\n+3：当角斗士在4回合内连续使用了普通技能和终结技，他在终结技后获得2点连击数，3回合的激素涌动。
actors.hero.talent.enhanced_combo.title=娴熟技艺
actors.hero.talent.enhanced_combo.desc=+1：角斗士释放终结技时，将会立即获得1点连击数。\n\n+2：角斗士的连击数达到5时即可释放终结技。\n\n+3：角斗士释放终结技时，将会立即获得2点连击数。\n

actors.hero.talent.defensive_strike.title=抵御之击
actors.hero.talent.defensive_strike.desc=_+1：_受到物理攻击时，有_25%_概率获得一点连击。\n\n_+2：_受到物理攻击时，有_50%_概率获得一点连击。\n\n_+3：_受到物理攻击时，有_75%_概率获得一点连击。\n\n_+4：_受到物理攻击时，有_100%_概率获得一点连击。
actors.hero.talent.devastate.title=摧枯拉朽
actors.hero.talent.devastate.desc=_+1：_角斗士每有1点连击数，他的武器伤害提升_0~1_。\n\n_+2：_角斗士每有1点连击数，他的武器伤害提升_0~2_。\n\n_+3：_角斗士每有1点连击数，他的武器伤害提升_0~3_。\n\n_+4：_角斗士每有1点连击数，他的武器伤害提升_0~4_。\n\n此天赋最多计算_10_连击。

actors.hero.talent.body_slam.title=肉弹冲击
actors.hero.talent.body_slam.desc=_+1：_战士英勇之跃落地时，对所有相邻敌人造成_25% 护甲值 + 1-4_的伤害。\n\n_+2：_战士英勇之跃落地时，对所有相邻敌人造成_50% 护甲值 + 2-8_的伤害。\n\n_+3：_战士英勇之跃落地时，对所有相邻敌人造成_75% 护甲值 + 3-12_的伤害。\n\n_+4：_战士英勇之跃落地时，对所有相邻敌人造成_100% 护甲值 + 4-16_的伤害。
actors.hero.talent.impact_wave.title=堕天一击
actors.hero.talent.impact_wave.desc=_+1：_战士英勇之跃落地时，击退所有相邻敌人_2_格，有_25%_几率使其获得 5 回合易伤。\n\n_+2：_战士英勇之跃落地时，击退所有相邻敌人_3_格，有_50%几率_使其获得 5 回合易伤。\n\n_+3：_战士英勇之跃落地时，击退所有相邻敌人_4_格，有_75%几率_使其获得 5 回合易伤。\n\n_+4：_战士英勇之跃落地时，击退所有相邻敌人_5_格，有_100%几率_使其获得 5 回合易伤。
actors.hero.talent.double_jump.title=二段跳跃
actors.hero.talent.double_jump.desc=_+1：_战士使用英勇跳跃后，3 回合内下一次使用充能消耗减少_20%_。\n\n_+2：_战士使用英勇跳跃后，3 回合内下一次使用充能消耗减少_36%_。\n\n_+3：_战士使用英勇跳跃后，3 回合内下一次使用充能消耗减少_50%_。\n\n_+4：_战士使用英勇跳跃后，3 回合内下一次使用充能消耗减少_60%_。

actors.hero.talent.expanding_wave.title=广域冲击
actors.hero.talent.expanding_wave.desc=_+1：_震地冲击的射程由5格扩大到_6格_，角度从60度展宽为_75度_。\n\n_+2：_震地冲击的射程由5格扩大到_7格_，角度从60度展宽为_90度_。\n\n_+3：_震地冲击的射程由5格扩大到_8格_，角度从60度展宽为_105度_。\n\n_+4：_震地冲击的射程由5格扩大到_9格_，角度从60度展宽为_120度_。
actors.hero.talent.striking_wave.title=复合震波
actors.hero.talent.striking_wave.desc=_+1：_使用震地冲击时，有_30%_概率触发攻击特效如附魔与连击。\n\n_+2：_使用震地冲击时，有_60%_概率触发攻击特效如附魔与连击。\n\n_+3：_使用震地冲击时，有_90%_概率触发攻击特效如附魔与连击。\n\n_+4：_使用震地冲击时，有_100%_概率触发攻击特效如附魔与连击。同时对附魔效果的触发还有_额外20%的概率提升_。
actors.hero.talent.shock_force.title=强力冲击
actors.hero.talent.shock_force.desc=_+1：_震地冲击伤害增加_20%_，有_25%_概率将目标击晕而非残废。\n\n_+2：_震地冲击伤害增加_40%_，有_50%_概率将目标击晕而非残废。\n\n_+3：_震地冲击伤害增加_60%_，有_75%_概率将目标击晕而非残废。\n\n_+4：_震地冲击伤害增加_80%_，有_100%_概率将目标击晕而非残废。

actors.hero.talent.sustained_retribution.title=持续反击
actors.hero.talent.sustained_retribution.desc=_+1：_反击的额外伤害增加到_115%_，分配给接下来_2_次攻击。\n\n_+2：_反击的额外伤害增加到_130%_，分配给接下来_3_次攻击。\n\n_+3：_反击的额外伤害增加到_145%_，分配给接下来_4_次攻击。\n\n_+4：_反击的额外伤害增加到_160%_，分配给接下来_5_次攻击。\n\n注：原本为100%额外伤害的一次攻击。
actors.hero.talent.shrug_it_off.title=痛觉阈值
actors.hero.talent.shrug_it_off.desc=_+1：_战士在苦痛坚忍中最多受到_67%最大生命值_的伤害。\n\n_+2：_战士在苦痛坚忍中最多受到_45%最大生命值_的伤害。\n\n_+3：_战士在苦痛坚忍中最多受到_30%最大生命值_的伤害。\n\n_+4：_战士在苦痛坚忍中最多受到_20%最大生命值_的伤害。
actors.hero.talent.even_the_odds.title=情势反转
actors.hero.talent.even_the_odds.desc=_+1：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_5%额外伤害_。\n\n_+2：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_10%额外伤害_。\n\n_+3：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_15%额外伤害_。\n\n_+4：_战士在苦痛坚忍结束时，周围两格每有一名敌人，增加_20%额外伤害_。

#mage
actors.hero.talent.empowering_meal.title=盈能一餐
actors.hero.talent.empowering_meal.desc=_+1：_进食会为法师接下来3次法杖效果增加 _2 点额外伤害_。\n\n_+2：_进食会为法师接下来3次法杖效果增加 _3 点额外伤害_。
actors.hero.talent.scholars_intuition.title=学者直觉
actors.hero.talent.scholars_intuition.desc=_+1：_法师鉴定法杖的速度提升为原来的_ 3 倍_。\n\n_+2：_法师 _使用法杖时_会将其_瞬间鉴定_。

actors.hero.talent.lingering_magic.title=波涌余威
actors.hero.talent.lingering_magic.desc=_+1：_当法师用魔杖或法杖施法后，他的下一次物理攻击将造成_1~2点额外伤害_。\n\n_+2：_当法师用魔杖或法杖施法后，他的下一次物理攻击将造成_2点额外伤害_。

actors.hero.talent.backup_barrier.title=备用屏障
actors.hero.talent.backup_barrier.desc=_+1：_每当法师释放老魔杖最后一点充能，他获得 _3 点护盾_。\n\n_+2：_每当法师释放老魔杖最后一点充能，他获得 _5 点护盾_。
actors.hero.talent.backup_barrier.meta_desc=_如果这个天赋被其它英雄获得_，那么它会由持有的等级最高的法杖触发。

actors.hero.talent.energizing_meal.title=充能一餐
actors.hero.talent.energizing_meal.desc=_+1：_法师进食只花费一个回合并获得 _5 回合的法杖充能_。\n\n_+2：_法师进食只花费一个回合并获得 _8 回合的法杖充能_。
actors.hero.talent.energizing_upgrade.title=充能强化
actors.hero.talent.energizing_upgrade.desc=_+1：_阅读卷轴将立刻为法师的所有法杖恢复_0.67_点充能，阅读秘卷效果翻倍。\n\n_+2：_阅读卷轴将立刻为法师的所有法杖恢复_1_点充能，阅读秘卷效果翻倍。
actors.hero.talent.wand_preservation.title=法杖回收
actors.hero.talent.wand_preservation.desc=_+1：_当法师将新的法杖注入老魔杖时，先前灌注的法杖有_67%_的概率以0级状态回收，在回收失败的时候会以 1 个奥术聚酯取而代之。\n\n_+2：_当法师将新的法杖注入老魔杖时，先前灌注的法杖有_100%_的概率_以0级状态回收。\n\n此天赋最多能成功回收法杖五次，在那之后将只能将法杖转化为奥术聚酯。
actors.hero.talent.arcane_vision.title=奥术感知
actors.hero.talent.arcane_vision.desc=_+1：_当法师使用法杖命中敌人时，获取目标视野，持续 _10 回合_。\n\n_+2：_当法师使用法杖命中敌人时，获取目标视野，持续 _15 回合_。
actors.hero.talent.shield_battery.title=储能护盾
actors.hero.talent.shield_battery.desc=_+1：_法师能以自身为目标施法，将法杖的每点充能转化为_ 4% 最大生命值_的护盾。\n\n_+2：_法师能以自身为目标施法，将法杖的每点充能转化为_ 6% 最大生命值_的护盾。

actors.hero.talent.spell_queue.title=法术序列
actors.hero.talent.spell_queue.desc=_+1：_获得一个二槽的法术序列，可以消耗一回合的时间，同时释放槽内的所有法术。法术序列内的法术充能消耗为2点，但在释放后会返还0.5充能。\n\n_+2：_法术序列变为三槽。\n\n_+3：_使用法术序列施法后，额外返还充能_0.25_。\n\n重载已完备的法术序列，需要消耗_无序结晶_。
actors.hero.talent.ally_warp.title=移形换位
actors.hero.talent.ally_warp.desc=_+1: _法师可以通过点击与一名_2格范围内_的友方单位瞬间交换位置。\n\n_+2: _法师可以通过点击与一名_4格范围内_的友方单位瞬间交换位置。\n\n_+3: _法师可以通过点击与一名_6格范围内_的友方单位瞬间交换位置。\n\n法师不能与无法移动的友方单位交换位置。

actors.hero.talent.empowered_strike.title=蓄能打击
actors.hero.talent.empowered_strike.desc=_+1：_战斗法师使用老魔杖施法后，下一次用其造成的近战攻击将产生_16%额外伤害_，且老魔杖的额外效果获得_50%_额外威力。\n\n_+2：_战斗法师使用老魔杖施法后，下一次用其造成的近战攻击将产生_33%额外伤害_，且老魔杖的额外效果获得_100%_额外威力。\n\n_+3：_战斗法师使用老魔杖施法后，下一次用其造成的近战攻击将产生_50%额外伤害_，且老魔杖的额外效果获得_150%_额外威力。
actors.hero.talent.mystical_charge.title=充能秘术
actors.hero.talent.mystical_charge.desc=_+1：_当战斗法师用老魔杖近战击中敌人时，会获得相当于_0.5回合_的神器充能效果。\n\n_+2：_当战斗法师用老魔杖近战击中敌人时，会获得相当于_1回合_的神器充能效果。\n\n_+3：_当战斗法师用老魔杖近战击中敌人时，会获得相当于_1.5回合_的神器充能效果。

actors.hero.talent.war_throw.title=战术投掷
actors.hero.talent.war_throw.desc=_+1：_战斗法师的投掷武器能以_50%的效率_享受老魔杖的近战效果以及法杖的灌注效果。\n\n_+2：_战斗法师的投掷武器能以_100%的效率_享受老魔杖的近战效果以及法杖的灌注效果。\n\n_+3：_战斗法师的投掷武器能以_150%的效率_享受老魔杖的近战效果以及法杖的灌注效果。

actors.hero.tacticalthrowtalen4battlemage$rockarmor.name=灵壤护甲(战术)
actors.hero.tacticalthrowtalen4battlemage$rockarmor.desc=也是灵壤护甲,可惜它并不能用于召唤守护者,剩余护甲量：%1$d。

actors.mobs.phantompiranha.name=幻影食人鱼
actors.mobs.phantompiranha.teleport_away=幻影食人鱼传送走了...
actors.mobs.phantompiranha.desc=幻影食人鱼是巨型食人鱼的一个罕见变种，具有诡异的半透明身体和魔法能力。他们能够在受到攻击时传送，从而逃跑或者迅速靠近敌人！\n\n虽然难以处理，但它们的肉也因具有魔力而备受珍视。

actors.mobs.tormentedspirit.name=咒缚灵
actors.mobs.tormentedspirit.desc=咒缚灵是本性善良的灵体，但却被诅咒所折磨。只要它们还被诅咒，它们就会像怨灵一样攻击你，而且更加强大！\n\n或许可以在与它们相邻时使用正确的物品来驱散诅咒。它们定会对此非常感激...
actors.mobs.tormentedspirit.thank_you=谢谢你...

actors.hero.talent.desperate_power.title=绝望动能
actors.hero.talent.desperate_power.desc=_+1：_敌人每损失了0.88%的生命值，你对它的吸血效果就提升1%\n\n_+2：_敌人每损失了0.75%的生命值，你对它的吸血效果就提升1%\n\n_+3：_敌人每损失了0.63%的生命值，你对它的吸血效果就提升1%。\n\n_+4：_敌人每损失了0.50%的生命值，你对它的吸血效果就提升1%。\n\n此天赋的效果上限不能超过100%。

actors.hero.talent.ghost_root.title=缠怨恶灵
actors.hero.talent.ghost_root.desc=_+1：_友方怨灵必定闪避其受到的前3次伤害。\n\n_+2：_友方怨灵在创造或被腐化出现时，获得隐身和极速，直到攻击到其第一个敌人。\n\n_+3：_友方怨灵有25%概率生成为一个能释放远程法术的特殊个体（法术造成的伤害与物理伤害等同）\n\n_+4：_以上天赋的加成对镜像同样生效。\n\n_此天赋由于设计缺陷已暂时禁用，日后有新天赋替代时，将会替换此天赋_

actors.hero.talent.soul_siphon.title=灵魂分食
actors.hero.talent.soul_siphon.desc=_+1：_其他单位的近战攻击同样会触发术士的灵魂标记，但只有_13%效果_。\n\n_+2：_其他单位的近战攻击同样会触发术士的灵魂标记，但只有_27%效果_。\n\n_+3：_其他单位的近战攻击同样会触发术士的灵魂标记，但只有_40%效果_。
actors.hero.talent.soul_eater.title=噬魂秘法
actors.hero.talent.soul_eater.desc=_+1：_灵魂标记单位受到的每点物理伤害都会提供相当于_0.33回合_的饥饿值；当持有灵魂标记的单位死亡时，术士有_10%几率_触发一次进食效果。\n\n_+2：_灵魂标记单位受到的每点物理伤害都会提供相当于_0.67回合_的饥饿值；当持有灵魂标记的单位死亡时，术士有_20%几率_触发一次进食效果。\n\n_+3：_灵魂标记单位受到的每点物理伤害都会提供相当于_1回合_的饥饿值；当持有灵魂标记的单位死亡时，术士有_30%几率_触发一次进食效果。
actors.hero.talent.necromancers_minions.title=怨灵爪牙
actors.hero.talent.necromancers_minions.desc=_+1：_拥有灵魂标记的敌人死亡时，有_13%几率_成为一只被术士腐化的怨灵。\n\n_+2：_拥有灵魂标记的敌人死亡时，有_27%几率_成为一只被术士腐化的怨灵。\n\n_+3：_拥有灵魂标记的敌人死亡时，有_40%几率_成为一只被术士腐化的怨灵。

actors.hero.talent.blast_radius.title=广域打击
actors.hero.talent.blast_radius.desc=_+1：_元素风暴的打击半径从4格扩大到 _5格_。\n\n_+2：_元素风暴的打击半径从4格扩大到 _6格_。\n\n_+3：_元素风暴的打击半径从4格扩大到 _7格_。\n\n_+4：_元素风暴的打击半径从4格扩大到 _8格_。
actors.hero.talent.elemental_power.title=元素之力
actors.hero.talent.elemental_power.desc=_+1：_元素风暴的威力提升_25%_。\n\n_+2：_元素风暴的威力提升_50%_。\n\n_+3：_元素风暴的威力提升_75%_。\n\n_+4：_元素风暴的威力提升_100%_。
actors.hero.talent.reactive_barrier.title=反应屏障
actors.hero.talent.reactive_barrier.desc=_+1：_元素风暴每击中一个目标，法师获得_2.5_点护盾，最多计算 5 个目标。\n\n_+2：_元素风暴每击中一个目标，法师获得_5_点护盾，最多计算 6 个目标。\n\n_+3：_元素风暴每击中一个目标，法师获得_7.5_点护盾，最多计算 7 个目标。\n\n_+4：_元素风暴每击中一个目标，法师获得_10_点护盾，最多计算 8 个目标。

actors.hero.talent.wild_power.title=狂野魔力
actors.hero.talent.wild_power.desc=_+1：_释放狂野魔法时，法杖会被视为原等级_+2_或_+3_，不可由此效果超过 +4。\n\n_+2：_释放狂野魔法时，法杖会被视为原等级_+3_，不可由此效果超过 +5。\n\n_+3：_释放狂野魔法时，法杖会被视为原等级_+3_或_+4_，不可由此效果超过 +6。\n\n_+4：_释放狂野魔法时，法杖会被视为原等级_+4_，不可由此效果超过 +7。
actors.hero.talent.fire_everything.title=法力倾泻
actors.hero.talent.fire_everything.desc=_+1：_狂野魔法将释放法杖由 4 次提升到_5_次，并且每一根法杖有_25%_的几率可被释放 3 次。\n\n_+2：_狂野魔法将释放法杖由 4 次提升到_6_次，并且每一根法杖有_50%_的几率可被释放 3 次。\n\n_+3：_狂野魔法将释放法杖由 4 次提升到_7_次，并且每一根法杖有_75%_的几率可被释放 3 次。\n\n_+4：_狂野魔法将释放法杖由 4 次提升到_8_次，并且每一根法杖有_100%_的几率可被释放 3 次。
actors.hero.talent.conserved_magic.title=节能施法
actors.hero.talent.conserved_magic.desc=_+1：_狂野魔法每次释放法杖消耗充能从 1 点下降至_0.67_点。\n并且狂野魔法有_25%_概率不花费时间。\n\n_+2：_狂野魔法每次释放法杖消耗充能从 1 点下降至_0.45_点。\n并且狂野魔法有_50%_概率不花费时间。\n\n_+3：_狂野魔法每次释放法杖消耗充能从 1 点下降至_0.3_点。\n并且狂野魔法有_75%_概率不花费时间。\n\n_+4：_狂野魔法每次释放法杖消耗充能从 1 点下降至_0.2_点。\n并且狂野魔法有_100%_概率不花费时间。

actors.hero.talent.telefrag.title=传送挤压
actors.hero.talent.telefrag.desc=_+1：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_10-15点_伤害，但自己会受到_5点伤害_。\n\n_+2：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_20-30点_伤害，但自己会受到_10点伤害_。\n\n_+3：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_30-45点_伤害，但自己会受到_15点伤害_。\n\n_+4：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_40-60点_伤害，但自己会受到_20点伤害_。\n\n玩家不会死于自伤，且该伤害可由魔法抵抗效果减免。
actors.hero.talent.remote_beacon.title=彼方信标
actors.hero.talent.remote_beacon.desc=_+1:_法师可以在_4格_内的任意一处放置一个信标。\n\n_+2:_法师可以在_8格_内的任意一处放置一个信标。\n\n_+3:_法师可以在_12格_内的任意一处放置一个信标。\n\n_+4:_法师可以在_16格_内的任意一处放置一个信标。\n\n法师无法在其不可抵达的位置放置信标。
actors.hero.talent.longrange_warp.title=长途传送
actors.hero.talent.longrange_warp.desc=_+1：_法师能够跨层传送，但消耗_150%的充能_。\n\n_+2：_法师能够跨层传送，但消耗_117%的充能_。\n\n_+3：_法师能够跨层传送，且仅消耗_83%的充能_。\n\n_+4：_法师能够跨层传送，且仅消耗_50%的充能_。\n\n法师不能借助此能力离开封锁的楼层。

//TODO Mage T4 Not Complete
actors.hero.talent.magic_refining.title=奥法精研
actors.hero.talent.magic_refining.desc=+1：法师使用卷轴时有_50%_概率回收其对应的_符石_。\n\n+2：法师使用秘卷时有_25%_概率回收其对应的_卷轴_。\n\n+3：法师使用_无序结晶_时可以从其给出的_3个卷轴_中选择_1个_来使用,但无法触发_升级卷轴_的效果。\n\n+4：法师额外获得一个_炼金配方_：\n奥术聚酯：_3个无序结晶_以及_6能量_来炼制。

actors.hero.talent.magic_tactics.title=战术出杖
actors.hero.talent.magic_tactics.desc=+1：法师释放老魔杖以外的法杖时有_7%_概率不消耗回合。\n\n+2：法师释放老魔杖以外的法杖时有_15%_概率不消耗回合。\n\n+3：法师释放老魔杖以外的法杖时有_22%_概率不消耗回合。\n\n+4：法师释放老魔杖以外的法杖时有_30%_概率不消耗回合。

actors.hero.talent.magic_stick.title=短棍格斗
actors.hero.talent.magic_stick.desc=+1：老魔杖近战伏击敌人时_战法效果必定触发_。\n\n+2：老魔杖近战攻击后有15%的概率获得一次_闪避机动_。\n\n+3：老魔杖的近战攻击有_30%概率_对敌人造成_8回合的脆弱/幻惑/眩晕/虚弱_其一。\n\n+4：使用老魔杖以外的法杖施法后的2回合内老魔杖的下一次近战攻击或施法不消耗回合。

actors.hero.talent.magic_workman.title=魔杖匠人
actors.hero.talent.magic_workman.desc=+1：你可以消耗_奥术聚酯_为老魔杖附魔。\n\n+2：你可以消耗_奥术聚酯_为老魔杖附魔，并可以在三项中选择一项。\n\n+3：即使带有诅咒，老魔杖也不会释放_诅咒法术_。\n\n+4：老魔杖的最大充能上升2。


#rogue
actors.hero.talent.cached_rations.title=备用口粮
actors.hero.talent.cached_rations.desc=_+1：_盗贼在探索地下城的前期可以从宝箱中找到 _4块小型口粮_。\n\n_+2：_盗贼在探索地下城的前期可以从宝箱中找到 _6块小型口粮_。
actors.hero.talent.thiefs_intuition.title=窃贼直觉
actors.hero.talent.thiefs_intuition.desc=_+1：__装备戒指时_盗贼将以两倍于平时的速度鉴定该戒指，并且在_装备戒指时_鉴定其种类。\n\n_+2：__装备戒指时_盗贼将立刻鉴定该戒指，并且在_拾取戒指时_鉴定其种类。
actors.hero.talent.sucker_punch.title=阴险打击
actors.hero.talent.sucker_punch.desc=_+1：_初次伏击一名敌人时盗贼将造成_ 1~2 点额外伤害_。\n\n_+2：_初次伏击一名敌人时盗贼将造成_ 2 点额外伤害_。
actors.hero.talent.protective_shadows.title=暗影庇护
actors.hero.talent.protective_shadows.desc=_+1：_盗贼在隐形时，每_2_回合获得一点护盾，最多积累_3_点。\n\n_+2：_盗贼在隐形时，每_1_回合获得一点护盾，最多积累_5_点。

actors.hero.talent.mystical_meal.title=秘术祭食
actors.hero.talent.mystical_meal.desc=_+1：_盗贼进食仅消耗1回合，并提供_3回合的神器充能_。\n\n_+1：_盗贼进食仅消耗1回合，并提供_5回合的神器充能_。\n\n这项天赋不能使丰饶之角对自身充能。
actors.hero.talent.duel_dance.title=决斗之舞
actors.hero.talent.duel_dance.desc=_+1：_交替使用投掷武器与法杖时，时间消耗减少_33%_。\n\n_+2：_交替使用投掷武器与法杖时，时间消耗减少_50%_。
actors.hero.talent.wide_search.title=广域搜索
actors.hero.talent.wide_search.desc=_+1：_盗贼的搜索范围由方形 5x5 增幅至 _圆形 7x7_。\n\n_+2：_盗贼的搜索范围由方形 5x5 增幅至 _方形 7x7_。
actors.hero.talent.wide_search.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在 +1 等级时扩张搜索范围至 5x5 的圆形，或在 +2 等级时扩张搜索范围至 5x5 的方形。
actors.hero.talent.silent_steps.title=无声步伐
actors.hero.talent.silent_steps.desc=_+1：_盗贼不会惊醒_距其3格或更远的敌人_。\n\n_+2：_盗贼不会惊醒_未与其相邻的敌人_。
actors.hero.talent.rogues_instinct.title=本能反应
actors.hero.talent.rogues_instinct.desc=_+1：_盗贼在商店购物时，有_25%_概率不花费金币。\n\n_+2：_盗贼在商店购物时，有_40%_概率不花费金币。

actors.hero.talent.light_cloak.title=轻便斗篷
actors.hero.talent.light_cloak.desc=_+1：_盗贼不装备暗影斗篷也能使用其功能，但未装备时斗篷的充能速率会降至_25%_。\n\n_+2：_盗贼不装备暗影斗篷也能使用其功能，但未装备时斗篷的充能速率会降至_50%_。\n\n_+3：_盗贼不装备暗影斗篷也能使用其功能，但未装备时斗篷的充能速率会降至_75%_。
actors.hero.talent.light_cloak.meta_desc=_如果这个天赋被其它英雄获得_，那么它会在 +1/+2/+3 等级时提高 7/13/20%的所有神器充能速度。
actors.hero.talent.deathblow.title=一刀毙命
actors.hero.talent.deathblow.desc=_+1：_在伏击时，拥有_15%_额外暴击率。\n\n_+2：_除获得+1的增益外，伏击时暴击伤害_+25%_(可超限)。\n\n_+3：_除获得+1、+2的增益外，伏击伤害增加_15%_。

actors.hero.talent.hide_in_crowd.title=隐没于人
actors.hero.talent.hide_in_crowd.desc=_+1：_当盗贼视野里的怪物数量大于_5_时，他获得8回合隐身。\n\n_+2：_当盗贼视野里的怪物数量大于_4_时，他获得8回合隐身。\n\n_+3：_当盗贼视野里的怪物数量大于_3_时，他获得8回合隐身。\n\n_+4：_当盗贼视野里的怪物数量大于_2_时，他获得8回合隐身。\n\n这个天赋有 50 回合的冷却时间。
actors.hero.talent.dark_armor.title=暗幕盔甲
actors.hero.talent.dark_armor.desc=_+1：_盗贼的暗影斗篷每有1点空充能，他的护甲防御提升_0~1_。\n\n_+2：_盗贼的暗影斗篷每有1点空充能，他的护甲防御提升_0.5~1_。\n\n_+3：_盗贼的暗影斗篷每有1点空充能，他的护甲防御提升_0.5~1.5_。\n\n_+4：_盗贼的暗影斗篷每有1点空充能，他的护甲防御提升_1~2_。\n\n_未装备暗影斗篷时此天赋无效。_

actors.hero.talent.enhanced_lethality.title=直击要害
actors.hero.talent.enhanced_lethality.desc=_+1：_刺客可以根据潜伏阶段直接斩杀生命值低于_ 4/13/27/67% _的目标。\n\n_+2：_刺客可以根据潜伏阶段直接斩杀生命值低于_ 5/17/33/83% _的目标。\n\n_+3：_刺客可以根据潜伏阶段直接斩杀生命值低于_ 6/20/40/100% _的目标。\n\n注：原先为 3/10/20/50%。
actors.hero.talent.assassins_reach.title=超距索命
actors.hero.talent.assassins_reach.desc=_+1：_刺客每个阶段的潜伏攻击闪现范围延长至_ 1/3/4/6 格_。\n\n_+2：_刺客每个阶段的潜伏攻击闪现范围延长至_ 2/4/6/8 格_。\n\n_+3：_刺客每个阶段的潜伏攻击闪现范围延长至_ 2/5/7/10 格_。\n\n注：原先为 1/2/3/4 格。
actors.hero.talent.bounty_hunter.title=赏金猎手
actors.hero.talent.bounty_hunter.desc=_+1：_被刺客用技能刺杀的敌人，依据刺杀技能的等级，其战利品掉落概率提升2/4/8/16%。\n\n_+2：_被刺客用技能刺杀的敌人，依据刺杀技能的等级，其战利品掉落概率提升4/8/16/32%。\n\n_+3：_被刺客用技能刺杀的敌人，依据刺杀技能的等级，其战利品掉落概率提升6/12/24/48%。

actors.hero.talent.brace_yourself.title=严阵以待
actors.hero.talent.brace_yourself.desc=_+1：_若刺客在隐身时保持不移动，则下一次攻击的额外伤害提高至25/50/80/110%。\n\n_+2：_若刺客在隐身时保持不移动，则下一次攻击的额外伤害提高至30/60/95/130%。\n\n_+3：_若刺客在隐身时保持不移动，则下一次攻击的额外伤害提高至35/70/110/150%。\n\n_+4：_若刺客在隐身时保持不移动，则下一次攻击的额外伤害提高至40/80/125/170%。\n\n注：原先为10/20/35/50%。

actors.buffs.magicstick.name=短棍格斗
actors.buffs.magicstick.desc=%d回合内，你使用老魔杖进行施法或近战攻击将不消耗回合

actors.buffs.calm.name=冷静
actors.buffs.calm.desc= 你每损失1%的最大生命值，暴击伤害便增加2%。（可突破限制）
actors.buffs.criticalattack.name=暴击
actors.buffs.criticalattack.desc= 若你的暴击伤害不小于300%，则你的攻击必定暴击。

actors.buffs.braceyourself.name=藏锋
actors.buffs.braceyourself.desc=此时刺客正严阵以待，伺机而动，下一次刺杀的额外伤害将得到提升。

actors.hero.talent.power_recycle.title=能量回收
actors.hero.talent.power_recycle.desc=_+1：_刺客用技能刺杀敌人后，获得_4回合充能_效果。\n\n_+2：_除获得+1的增益外，刺客用技能刺杀敌人后，获得_2回合神器充能_效果。\n\n_+3：_除获得+1，+2的增益外，被刺客用技能刺杀的敌人，为刺客提供复_25_饥饿值。\n\n_+4：_+1，+2，+3的增益有_50%_的概率对非技能击杀也生效。

actors.hero.talent.evasive_armor.title=灵猴之护
actors.hero.talent.evasive_armor.desc=_+1：_处于逸动状态时，疾行者的护甲每拥有1点额外力量便获得_1点闪避_。\n\n_+2：_处于逸动状态时，疾行者的护甲每拥有1点额外力量便获得_2点闪避_。\n\n_+3：_处于逸动状态时，疾行者的护甲每拥有1点额外力量便获得_3点闪避_。
actors.hero.talent.projectile_momentum.title=飞速投掷
actors.hero.talent.projectile_momentum.desc=_+1：_处于逸动状态时，疾行者使用投掷武器时获得额外的_ 20% 命中与 15% 伤害_。\n\n_+2：_处于逸动状态时，疾行者使用投掷武器时获得额外的_ 40% 命中与 30% 伤害_。\n\n_+3：_处于逸动状态时，疾行者使用投掷武器时获得额外的_ 60% 命中与 45% 伤害_。
actors.hero.talent.speedy_stealth.title=无人之境
actors.hero.talent.speedy_stealth.desc=_+1：_疾行者在隐身时，每回合获得2层动量。\n\n_+2：_除获得+1的增益外，当疾行者隐身时，逸动效果持续的回合数不会下降。\n\n_+3：_除获得+1，+2的增益外，当疾行者隐身时，不论其是否处于逸动状态，他的移动速度都会翻倍。

actors.hero.talent.kinetic_energy.title=动能转换
actors.hero.talent.kinetic_energy.desc=_+1：_疾行者的神器和法杖随时间自然充能的效率，变为原来的_本回合移动步数*0.25_倍(不会低于原数值)。\n\n_+2：_疾行者的神器和法杖随时间自然充能的效率，变为原来的_本回合移动步数*0.5_倍(不会低于原数值)。\n\n_+3：_疾行者的神器和法杖随时间自然充能的效率，变为原来的_本回合移动步数*0.75_倍(不会低于原数值)。\n\n_+4：_疾行者的神器和法杖随时间自然充能的效率，变为原来的_本回合移动步数_倍(不会低于原数值)。
actors.hero.talent.storm_rush.title=风暴奔袭
actors.hero.talent.storm_rush.desc=_+1：_杀死敌人后，疾行者获得_3回合极速_效果。\n\n_+2：_除获得+1的增益外，当疾行者处于极速/激素涌动/体力充沛状态时，逸动效果持续的回合数不会下降。\n\n_+3：_除获得+1，+2的增益外，疾行者免疫_残疾、冻伤和迟缓_。\n\n_+4：_除获得+1，+2，+3的增益外，当疾行者移动时，如果移速超过4，获得_1回合漂浮_。

actors.hero.talent.hasty_retreat.title=猜我在哪
actors.hero.talent.hasty_retreat.desc=_+1：_盗贼在闪现后获得_1回合_的极速与隐身。\n\n_+2：_盗贼在闪现后获得_2回合_的极速与隐身。\n\n_+3：_盗贼在闪现后获得_3回合_的极速与隐身。\n\n_+4：_盗贼在闪现后获得_4回合_的极速与隐身。
actors.hero.talent.body_replacement.title=替身掩护
actors.hero.talent.body_replacement.desc=_+1：_闪现时，盗贼会留下一个有_ 20 点生命与 1-3 点护甲_的替身木桩。\n\n_+2：_闪现时，盗贼会留下一个有_ 40 点生命与 2-6 点护甲_的替身木桩。\n\n_+3：_闪现时，盗贼会留下一个有_ 60 点生命与 3-9 点护甲_的替身木桩。\n\n_+4：_闪现时，盗贼会留下一个有_ 80 点生命与 4~12 点护甲_的替身木桩。\n\n同一时间只可存在一个替身木桩。
actors.hero.talent.shadow_step.title=烟幕潜行
actors.hero.talent.shadow_step.desc=_+1：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费会_降低 20%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+2：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费会_降低 36%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+3：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费会_降低 50%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+4：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费会_降低 60%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。

actors.hero.talent.fear_the_reaper.title=恐惧蔓延
actors.hero.talent.fear_the_reaper.desc=_+1：_拥有夺命印记的敌人在生命值降为 0 时会获得_残废_效果。\n\n_+2：_拥有夺命印记的敌人在生命值降为 0 时会获得_残废与恐惧_效果。\n\n_+3：_拥有夺命印记的敌人在生命值降为 0 时会获得_残废与恐惧_效果，并且 3 方格内的其他敌人也会获得_残废_效果。\n\n_+4：_拥有夺命印记的敌人在生命值降为 0 时会获得_残废与恐惧_效果，并且 3 方格内的其他敌人也会获得_残废与恐惧_效果。
actors.hero.talent.deathly_durability.title=死神外衣
actors.hero.talent.deathly_durability.desc=_+1：_死于夺命印记的敌人会赋予盗贼其被印记时生命值 _13%_ 的护盾值。\n\n_+2：_死于夺命印记的敌人会赋予盗贼其被印记时生命值 _25%_ 的护盾值。\n\n_+3：_死于夺命印记的敌人会赋予盗贼其被印记时生命值 _38%_ 的护盾值。\n\n_+4：_死于夺命印记的敌人会赋予盗贼其被印记时生命值 _50%_ 的护盾值。
actors.hero.talent.double_mark.title=双重印记
actors.hero.talent.double_mark.desc=_+1：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_30%_。\n\n_+2：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_50%_。\n\n_+3：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_65%_。\n\n_+4：_标记一个目标后立即标记另一目标时，标记的充能消耗降低_75%_。

actors.hero.talent.shadow_blade.title=影铸之刃
actors.hero.talent.shadow_blade.desc=_+1：_暗影映像获得其主人每回合伤害的_8%_，有_25%_概率使用主人武器的附魔。\n\n_+2：_暗影映像获得其主人每回合伤害的_16%_，有_50%_概率使用主人武器的附魔。\n\n_+3：_暗影映像获得其主人每回合伤害的_24%_，有_75%_概率使用主人武器的附魔。\n\n_+4：_暗影映像获得其主人每回合伤害的_32%_，有_100%_概率使用主人武器的附魔。
actors.hero.talent.cloned_armor.title=影塑之甲
actors.hero.talent.cloned_armor.desc=_+1：_暗影映像获得其主人护甲值的_12%_，有_25%_概率使用主人护甲的刻印。\n\n_+2：_暗影映像获得其主人护甲值的_24%_，有_50%_概率使用主人护甲的刻印。\n\n_+3：_暗影映像获得其主人护甲值的_36%_，有_75%_概率使用主人护甲的刻印。\n\n_+4：_暗影映像获得其主人护甲值的_48%_，有_100%_概率使用主人护甲的刻印。
actors.hero.talent.perfect_copy.title=完美克隆
actors.hero.talent.perfect_copy.desc=_+1：_暗影映像额外获得其主人_10%_的最大生命值。并且盗贼可以瞬间与_1格_距离以内的映像交换位置。\n\n_+2：_暗影映像额外获得其主人_20%_的最大生命值，并且盗贼可以瞬间与_2格_距离以内的映像交换位置。\n\n_+3：_暗影映像额外获得其主人_30%_的最大生命值，并且盗贼可以瞬间与_3格_距离以内的映像交换位置。\n\n_+4：_暗影映像额外获得其主人_40%_的最大生命值，并且盗贼可以瞬间与_4格_距离以内的映像交换位置。

#huntress
actors.hero.talent.natures_bounty.title=自然馈赠
actors.hero.talent.natures_bounty.desc=_+1：_女猎手在探索地下城的前期可以从高草中找到 _4 个浆果_。\n\n_+2：_女猎手在探索地下城的前期可以从高草中找到 _6 个浆果_。
actors.hero.talent.survivalists_intuition.title=生存直觉
actors.hero.talent.survivalists_intuition.desc=_+1：_女猎手鉴定任何装备的速度提升为原来的_ 1.75 倍_。\n\n_+2：_女猎手鉴定任何装备的速度提升为原来的_ 2.5 倍_。
actors.hero.talent.followup_strike.title=追加打击
actors.hero.talent.followup_strike.desc=_+1：_当女猎手用她的弓或其它投掷武器击中敌人时，她对该敌人的下一次近战攻击将造成_ 2 点额外伤害_。\n\n_+2：_当女猎手用她的弓或其他投掷武器击中敌人时。她对该敌人的下一次近战攻击将造成_ 3 点额外伤害_。
actors.hero.talent.underestimated.title=竹头木屑
actors.hero.talent.underestimated.desc=_+1：_在踩踏高草时，有概率获得一团魔法根系，最多_6_个。\n\n_+2：_在踩踏高草时，有概率获得一团魔法根系，最多_10_个。

actors.hero.talent.invigorating_meal.title=活力一餐
actors.hero.talent.invigorating_meal.desc=_+1：_女猎手进食只耗费1回合（食用浆果不耗费回合）并获得_ 1 回合的极速_。\n\n_+2：_女猎手进食只耗费1回合（食用浆果不耗费回合）并获得_ 2 回合的极速_。
actors.hero.talent.herb_mixture.title=药物配置
actors.hero.talent.herb_mixture.desc=激活此天赋会获得一个_草药制作包_。拥有此天赋时，可以将种子制作成草药。\n\n_+1：_需要_4枚_任意种子来制作。\n\n_+2：_需要_3枚_任意种子来制作。\n\n草药可以立即恢复_15点生命_并提供一定时间的缓慢回复。
actors.hero.talent.rejuvenating_steps.title=复春步伐
actors.hero.talent.rejuvenating_steps.desc=_+1：_当女猎手踏上矮草或灰烬时，它们会复生为高草，并立即被女猎手踩踏。这个天赋_有 10 回合的冷却时间_。\n\n_+2：_当女猎手踏上矮草或灰烬时，它们会复生为高草，并立即被女猎手踩踏。这个天赋_有 5 回合的冷却时间_。\n\n若被动恢复效果被禁用或着英雄长时间内没有获得经验，此天赋只会生出枯草。
actors.hero.talent.heightened_senses.title=敏锐感知
actors.hero.talent.heightened_senses.desc=_+1：_女猎手能感知到_周围 2 格以内_的敌人。\n\n_+2：_女猎手能感知到_周围 3 格以内_的敌人。
actors.hero.talent.durable_projectiles.title=矢石保养
actors.hero.talent.durable_projectiles.desc=_+1：_女猎手手中的投掷武器获得_ 50% 额外耐久度_。\n\n_+2：_女猎手手中的投掷武器获得_ 75% 额外耐久度_。

actors.hero.talent.hold_breath.title=屏息凝神
actors.hero.talent.hold_breath.desc=_+1：_女猎手每回合会为投掷武器和灵能弓增加_2%_暴击率与_1%_的暴击伤害，使用它们命中敌人时会重置计数。\n\n_+2：_女猎手每回合会为投掷武器和灵能弓增加_3%_暴击率与_1.5%_的暴击伤害，使用它们命中敌人时会重置计数。\n\n_+3：_女猎手每回合会为投掷武器和灵能弓增加_4%_暴击率与_2%_的暴击伤害，使用它们命中敌人时会重置计数。
actors.hero.talent.seer_shot.title=探地之矢
actors.hero.talent.seer_shot.desc=_+1：_当女猎手射箭击中地面时，会提供落点周围3x3的视野，_持续5回合_。这个天赋有20回合的冷却时间。\n\n_+1：_当女猎手射箭击中地面时，会提供落点周围3x3的视野，_持续10回合_。这个天赋有20回合的冷却时间。\n\n_+1：_当女猎手射箭击中地面时，会提供落点周围3x3的视野，_持续15回合_。这个天赋有20回合的冷却时间。
actors.hero.talent.seer_shot.meta_desc=_如果这个天赋被其它英雄获得_，那么它可被任何投掷物触发。

actors.hero.talent.brisk_pace.title=荒野疾步
actors.hero.talent.brisk_pace.desc=_+1：_视野中每有1个怪物，女猎手的移速增加_2.5%_。\n\n_+2：_视野中每有1个怪物，女猎手的移速增加_5%_。\n\n_+3：_视野中每有1个怪物，女猎手的移速增加_7.5%_。\n\n_+4：_视野中每有1个怪物，女猎手的移速增加_10%_。
actors.hero.talent.phase_filling.title=相位填充
actors.hero.talent.phase_filling.desc=_+1：_敌人死亡后，女猎手有_50%_概率直接取回其身上卡住的投掷物。\n\n_+2：_敌人死亡后，女猎手有_100%_概率直接取回其身上卡住的投掷物。\n\n_+3：_除获得+2的增益外，用法杖命中敌人可以立即取回其身上卡住的1件投掷物。\n\n_+4：_除获得+2,+3的增益外，使用法杖有_50%_概率为一个投掷武器恢复1点耐久。

actors.hero.talent.bow_dules.title=射技决斗
actors.hero.talent.bow_dules.desc=_+1：_狙击标记存在时全局攻速提升50%。\n\n_+2：_非追击情况下，用灵能弓成功伏击敌人时也可造成狙击标记\n\n_+3：_非追击情况下，灵能弓命中具有远程攻击的敌方单位无需伏击也可造成狙击标记\n\n_+4：_追击的伤害_上升35%_


actors.hero.talent.storm_attack.title=疾风骤雨
actors.hero.talent.storm_attack.desc=_+1：_狙击手在射击时，会额外对目标射出1只伤害固定为1的箭矢。\n\n_+2：_狙击手在射击时，会额外对目标射出1只伤害固定为25%的箭矢。\n\n_+3：_狙击手在射击时，会额外对目标射出2只伤害为1的箭矢。\n\n_+4：_狙击手在射击时，会额外对目标射出2只伤害为25%的箭矢。

actors.hero.talent.medart_specialist.title=药镖专家
actors.hero.talent.medart_specialist.desc=_+1：_守望者现在可以使用_1_药水为_4_只飞镖涂药。\n\n_+2：_投掷涂药飞镖时无视任何条件必定命中。\n\n_+3：_涂药飞镖命中时，有_33%概率_不消耗耐久。\n\n_+4：_涂药飞镖的伤害上升至_2倍_。

actors.hero.talent.land_heart.title=大地之心
actors.hero.talent.land_heart.desc=_+1：_守望者在高草丛中获得_50%_额外移速。\n\n_+2：_踩踏高草时有_10%_概率直接向你的水袋中添加_1_露珠。\n\n_+3：_自己或目标周围_9格_有高草或枯草时，伏击敌人将无视其护甲。\n\n_+4：_灵能弓或药镖射击草地或灰烬地上的敌人有_15%_概率触发负面植物效果。

actors.hero.talent$highgrss_speed.name=大地前行
actors.hero.talent$highgrss_speed.desc=守望者在在高草丛中获得_50%%_额外移速。


actors.hero.talent.farsight.title=鹰眼远视
actors.hero.talent.farsight.desc=_+1：_狙击手的视野范围_扩大25%_。\n\n_+2：_狙击手的视野范围_扩大50%_。\n\n_+3：_狙击手的视野范围_扩大75%_。
actors.hero.talent.shared_enchantment.title=联动附魔
actors.hero.talent.shared_enchantment.desc=_+1：_ 投掷武器 _有33%几率_ 共享狙击手的灵能弓上的附魔。\n\n_+2：_ 投掷武器 _有67%几率_ 共享狙击手的灵能弓上的附魔。\n\n_+3：_ 投掷武器 _必定能够_ 共享狙击手的灵能弓上的附魔。\n\n若装备了已附魔的十字弩，使用飞镖时这项天赋不会生效，因为飞镖已经触发了十字弩本身的附魔。
actors.hero.talent.shared_upgrades.title=联动升级
actors.hero.talent.shared_upgrades.desc=_+1：_当狙击手使用一件升级过的投掷武器攻击时，其上的每级升级都会提升1回合狙击标记的持续时间，并使狙击手的特殊攻击伤害_提升10%_。\n\n_+2：_当狙击手使用一件升级过的投掷武器攻击时，其上的每级升级都会提升1回合狙击标记的持续时间，并使狙击手的特殊攻击伤害_提升20%_。\n\n_+3：_当狙击手使用一件升级过的投掷武器攻击时，其上的每级升级都会提升1回合狙击标记的持续时间，并使狙击手的特殊攻击伤害_提升30%_。

actors.hero.talent.durable_tips.title=持久药液
actors.hero.talent.durable_tips.desc=_+1：_守望者的涂药飞镖拥有_2倍耐久值_。\n\n_+2：_守望者的涂药飞镖拥有_3倍耐久值_。\n\n_+3：_守望者的涂药飞镖拥有_4倍耐久值_。
actors.hero.talent.barkskin.title=树肤韧甲
actors.hero.talent.barkskin.desc=_+1：_在草丛中时，守望者获得等同于她的等级_0-50%_的树肤效果，该效果每回合衰减。\n\n_+2：_在草丛中时，守望者获得等同于她的等级_0-100%_的树肤效果，该效果每回合衰减。\n\n_+3：_在草丛中时，守望者获得等同于她的等级_0-150%_的树肤效果，该效果每回合衰减。
actors.hero.talent.vine_trap.title=藤蔓陷阱
actors.hero.talent.vine_trap.desc=守望者踩踏过的高草会被设下藤蔓陷阱，敌人踩踏藤蔓陷阱后会获得减益效果。\n\n_+1：_5回合_虚弱_。\n\n_+2：_5回合_虚弱和幻惑_。\n\n_+3：_5回合_虚弱、幻惑和易伤_。

actors.hero.talent.fan_of_blades.title=千叶刀扇
actors.hero.talent.fan_of_blades.desc=_+1：_灵魂飞刃最多能命中_1个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_30度_扇形内。\n\n_+2：_灵魂飞刃最多能命中_2个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_60度_扇形内。\n\n_+3：_灵魂飞刃最多能命中_3个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_90度_扇形内。\n\n_+4：_灵魂飞刃最多能命中_4个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_120度_扇形内。
actors.hero.talent.projecting_blades.title=索敌飞刃
actors.hero.talent.projecting_blades.desc=_+1：_灵魂飞刃精准度提升_25%_，最多能穿透_2格固体地形_。\n\n_+2：_灵魂飞刃精准度提升_50%_，最多能穿透_4格固体地形_。\n\n_+3：_灵魂飞刃精准度提升_75%_，最多能穿透_6格固体地形_。\n\n_+4：_灵魂飞刃精准度提升_100%_，最多能穿透_8格固体地形_。
actors.hero.talent.spirit_blades.title=灵能飞刃
actors.hero.talent.spirit_blades.desc=_+1：_灵魂飞刃有_30%_的概率额外使用灵能短弓的附魔。\n\n_+2：_灵魂飞刃有_60%_的概率额外使用灵能短弓的附魔。\n\n_+3：_灵魂飞刃有_90%_的概率额外使用灵能短弓的附魔。\n\n_+4：_灵魂飞刃有_100%_的概率额外使用灵能短弓的附魔，附魔触发概率_提升10%_。

actors.hero.talent.growing_power.title=茁壮之力
actors.hero.talent.growing_power.desc=_+1：_较之原先的33%与100%，自然之力对射击速度与移动速度的加成提升为_38%_与_125%_。\n\n_+2：_较之原先的33%与100%，自然之力对射击速度与移动速度的加成提升为_42%_与_150%_。\n\n_+3：_较之原先的33%与100%，自然之力对射击速度与移动速度的加成提升为_46%_与_175%_。\n\n_+4：_较之原先的33%与100%，自然之力对射击速度与移动速度的加成提升为_50%_与_200%_。
actors.hero.talent.natures_wrath.title=自然之怒
actors.hero.talent.natures_wrath.desc=_+1：_在自然之力的加持下，使用灵能弓的攻击有 _8% 的机率_触发一个随机的负面植物效果。\n\n_+2：_在自然之力的加持下，使用灵能弓的攻击有 _17% 的机率_触发一个随机的负面植物效果。\n\n_+3：_在自然之力的加持下，使用灵能弓的攻击有 _25% 的机率_触发一个随机的负面植物效果。\n\n_+4：_在自然之力的加持下，使用灵能弓的攻击有 _33% 的机率_触发一个随机的负面植物效果。\n\n可能触发的植物为：致盲草、烈焰花、冰冠花、断肠苔、风暴藤。
actors.hero.talent.wild_momentum.title=自然飞矢
actors.hero.talent.wild_momentum.desc=_+1：_使用灵能短弓射杀一名敌人时，延长_1回合_自然之力，最多延长_2_回合。\n\n_+2：_使用灵能短弓射杀一名敌人时，延长_2回合_自然之力，最多延长_4_回合。\n\n_+3：_使用灵能短弓射杀一名敌人时，延长_3回合_自然之力，最多延长_6_回合。\n\n_+4：_使用灵能短弓射杀一名敌人时，延长_4回合_自然之力，最多延长_8_回合。

actors.hero.talent.eagle_eye.title=鹰之瞭望
actors.hero.talent.eagle_eye.desc=_+1:_ 飞鹰的视野范围从 6 格增加到_7_格。\n\n_+2:_ 飞鹰的视野范围从 6 格增加到_8_格。\n\n_+3:_ 飞鹰的视野范围从 6 格增加到_9_格，并获得_2_格的灵视。\n\n_+4:_ 飞鹰的视野范围从 6 格增加到_10_格，并获得_3_格的灵视。
actors.hero.talent.go_for_the_eyes.title=夺目利爪
actors.hero.talent.go_for_the_eyes.desc=_+1：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_2_回合。\n\n_+2：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5_回合。\n\n_+3：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5_回合，并附加_2_回合的残废。\n\n_+4：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5_回合，并附加_5_回合的残废。
actors.hero.talent.swift_spirit.title=疾风之魄
actors.hero.talent.swift_spirit.desc=_+1：_飞鹰的移动速度由每回合 2 格提升至_2.5_格，必定闪避其遭到的前_2次攻击_次攻击。\n\n_+2：_飞鹰的移动速度由每回合 2 格提升至_3_格，必定闪避其遭到的前_4_次攻击。\n\n_+3：_飞鹰的移动速度由每回合 2 格提升至_3.5_格，必定闪避其遭到的前_6_次攻击。\n\n_+4：_飞鹰的移动速度由每回合 2 格提升至_4_格，必定闪避其遭到的前_8_次攻击。

actors.hero.talent$swiftequipcooldown.name=迅捷换装冷却
actors.hero.talent$swiftequipcooldown.desc=你最近使用了这个能力，在故技重施之前需要等待一定时间。\n\n剩余的冷却时间: %s.
#universal
actors.hero.talent.heroic_energy.title=英勇能量
actors.hero.talent.heroic_energy.rat_title=阴勇能量
actors.hero.talent.heroic_energy.desc=_+1：_发动英雄护甲能力的充能消耗_减少13%_。\n\n_+2：_发动英雄护甲能力的充能消耗_减少24%_。\n\n_+3：_发动英雄护甲能力的充能消耗_减少34%_。\n\n_+4：_发动英雄护甲能力的充能消耗_减少43%_。

actors.hero.talent.ratsistance.title=鼠手鼠脚
actors.hero.talent.ratsistance.desc=_+1：_被鼠化的敌人造成的伤害会降低_10%_。\n\n_+2：_被鼠化的敌人造成的伤害会降低_19%_。\n\n_+3：_被鼠化的敌人造成的伤害会降低_27%_。\n\n_+4：_被鼠化的敌人造成的伤害会降低_35%_。
actors.hero.talent.ratlomacy.title=外交鼠段
actors.hero.talent.ratlomacy.desc=_+1：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军。\n\n_+2：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_ 2 回合_的激素涌动。\n\n_+3：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_ 4 回合_的激素涌动。\n\n_+4：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_ 6 回合_的激素涌动。
actors.hero.talent.ratforcements.title=吱援部队
actors.hero.talent.ratforcements.desc=_+1：_以自身为目标使用鼠化术会在身边_召唤 1 只_友军啮齿小鼠。\n\n_+2：_以自身为目标使用鼠化术会在身边_召唤 2 只_友军啮齿小鼠。\n\n_+3：_以自身为目标使用鼠化术会在身边_召唤 3 只_友军啮齿小鼠。\n\n_+4：_以自身为目标使用鼠化术会在身边_召唤 4 只_友军啮齿小鼠。

###Rector 牧师

actors.buffs.rector.belief.name=虔诚信仰
actors.buffs.rector.belief.no_target=未发现目标，本次惩戒取消。
actors.buffs.rector.belief.desc=牧师与神紧密相连，依靠_信仰_来与神进行联系。\n\n牧师可以通过在地牢中获取经验来积攒_信仰值_与神建立联系，信仰技能可以造成_伤害、给予临时生命、加速、驱除诅咒_、还可以向神祈祷来得到可能的_恩赐_。\n\n当前信仰点数为：_%s_。

actors.buffs.rector.belief.desc2=牧师与神紧密相连，依靠_信仰_来与神进行联系。\n\n牧师可以通过在地牢中获取经验来积攒_信仰值_与神建立联系，信仰技能可以造成_伤害、给予临时生命、加速、驱除诅咒_、还可以向神祈祷来得到可能的_恩赐_。\n\n当前信仰点数为：_%1$s_\n\n钢铁烈阳伤害加成：_%2$s_。

actors.buffs.rector.belief.not_link_error=你与神的联系暂时被打断了，无法通过信仰来使用技能。

actors.buffs.rector.belief.prayers_success=祈祷成功！你获得了%s。
actors.buffs.rector.belief.experience_success=祈祷成功！你获得了%s经验。
actors.buffs.rector.belief.curse_remove_success=祈祷成功！你所有的诅咒都被驱除。
actors.buffs.rector.belief.heal_success=祈祷成功！你感觉自己得到了治疗。

actors.buffs.rector.faithobstruction.name=信仰阻断
actors.buffs.rector.faithobstruction.desc=你与神的联系暂时被打断了，无法通过信仰来使用技能。\n\n剩余阻断时长：%s回合。

actors.buffs.rector.soulstaker.name=噬魂咒
actors.buffs.rector.soulstaker.desc=你充盈的生命力如今化为敌人的噩梦。


actors.hero.talent.prayer_before_meals.title=餐前祈祷
actors.hero.talent.prayer_before_meals.desc=_+1：_牧师在进食后，获得_1点信仰值_。\n\n_+2：_牧师在进食后，获得_2点信仰值_。
actors.hero.talent.mental_telepathy.title=心灵感应
actors.hero.talent.mental_telepathy.desc=_+1：_牧师会_立刻鉴定_已装备且未被诅咒的_武器/护甲_。\n\n_+2：_牧师会_立刻鉴定_已装备且未被诅咒的_戒指_。
actors.hero.talent.rain_grace.title=恩惠之雨
actors.hero.talent.rain_grace.desc=_+1：_牧师每击杀一名敌人，则为视野内的_所有单位回复1点生命_。这个天赋有5回合的冷却时间。\n\n_+2：_牧师每击杀一名敌人，则为视野内的_所有单位回复2点生命_。这个天赋有5回合的冷却时间。
actors.hero.talent$rain_grace_cooldown.name=恩惠之雨-冷却
actors.hero.talent$rain_grace_cooldown.desc=你先前已经触发这个效果，需要等待一下才能再次使用。\n\n剩余冷却：%s回合。


###TODO
actors.hero.talent.devotional.title=虔诚祷告
actors.hero.talent.devotional.desc=_+1：_牧师在使用技能后，获得_4点护盾_。\n\n_+2：_牧师在使用技能后，获得_8点护盾_。

actors.hero.talent.bless_food.title=祝福一餐
actors.hero.talent.bless_food.desc=_+1：_牧师进食只消耗一回合，并获得_12回合祝福_。\n\n_+1：_牧师进食只消耗一回合，并获得_20回合祝福_。

actors.hero.talent.soul_nowifi.title=灵魂干涉
actors.hero.talent.soul_nowifi.desc=_+1：_牧师获得所有_当前生命值_不高于_最大生命25%_的敌人的视野。\n\n_+2：_牧师获得所有_当前生命值_不高于_最大生命40%_的敌人的视野。

actors.hero.talent.light_step.title=虔诚信徒
actors.hero.talent.light_step.desc=_+1：_立刻获得一瓶经验药水，但是失去一个本层天赋点。\n\n_+2：_立刻获得一瓶经验药水，但是失去一个本层天赋点。

actors.hero.talent.god_body.title=神圣护体
actors.hero.talent.god_body.desc=_+1：_当牧师自身拥有的debuff剩余回合数小于2，则立刻清除它。（此天赋对酸蚀的效用为1回合）\n\n_+2：_当牧师自身拥有的debuff剩余回合数小于3，则立刻清除它。（此天赋对酸蚀的效用为1回合）

actors.hero.talent.nohope_lang.title=绝望祷言
actors.hero.talent.nohope_lang.desc=_+1：_当牧师的当前生命小于等于最大生命的25%时，惩击和光能灌注的效用翻1.5倍。\n\n_+2：_当牧师的当前生命小于等于最大生命的25%时，净化的效果变为完全去除诅咒且给予的发光与祝福时长翻倍、祈祷会触发两次。

actors.hero.talent.act_godprogress.title=代行神权
actors.hero.talent.act_godprogress.desc=_+1：_在信仰值不足时，牧师可以_不消耗信仰值_的来使用_惩戒之力技能_，这个天赋有_500回合_的冷却时间。\n\n_+2：_在信仰值不足时，牧师可以_不消耗信仰值_的来使用_牧师的全部技能_，这个天赋有_425回合_的冷却时间。\n\n_+3：_在信仰值不足时，牧师可以_不消耗信仰值_的来使用_牧师的全部技能_，这个天赋有_350回合_的冷却时间。

actors.hero.talent.smart_blessing.title=灵活信仰
actors.hero.talent.smart_blessing.desc=_+1：_使用法杖与法力结晶将_不再增加_信仰技能的冷却了。\n\n_+2：_使用法杖的伤害_直接击杀敌人_将获取_0.33的信仰值_。\n\n_+3：_使用除_注魔/诅咒结晶_后有_33%的概率_再回收一个

### 战斗牧师
actors.hero.talent.iron_sun.title=钢铁烈阳
actors.hero.talent.iron_sun.desc=_+1：_战斗牧师每拥有_一种Buff_，他的_近战伤害_就增加_3点_。\n\n_+2：_战斗牧师在使用_任意祈祷技能_后，获得相当于_人物等级的护盾_-(物理祈祷不会触发)。\n\n_+3：_战斗牧师在_获得经验_之后，获得等同于_经验值的护盾_。

actors.hero.talent.pharcis_bless.title=物理祈祷
actors.hero.talent.pharcis_bless.desc=_+1：_战斗牧师在进行一次成功的近战攻击后，有_13%概率_对该目标进行一次_不消耗回合不消耗信仰值_的_惩击之力技能_。\n\n_+2：_战斗牧师在进行一次成功的近战攻击后，有_26%概率_对该目标进行一次_不消耗回合不消耗信仰值_的_惩击之力技能_\n\n_。+3：_战斗牧师在进行一次成功的近战攻击后，有_40%概率_对该目标进行一次_不消耗回合不消耗信仰值_的_惩击之力技能_。

actors.hero.talent.ben_work.title=极效疗愈
actors.hero.talent.ben_work.desc=_+1：_战斗牧师_在单次损失了10点以上_的血量后，会获得此次_损失血量的40%缓慢回复_，这个天赋有_50回合_的冷却时间。\n\n_+2：_战斗牧师_在单次损失了10点以上_的血量后，会获得此次_损失血量的60%缓慢回复_，这个天赋有_40回合_的冷却时间。\n\n_+3：_战斗牧师_在单次损失了10点以上_的血量后，会获得此次_损失血量的80%缓慢回复_，这个天赋有_30回合_的冷却时间。

actors.hero.talent$slowhealingdeadcooldown.name=极效疗愈-冷却
actors.hero.talent$slowhealingdeadcooldown.desc=此效果你已经使用过，还需要%s回合才能再次使用。

### 红衣主教
actors.hero.talent.fire_glass.title=圣火燎原
actors.hero.talent.fire_glass.desc=_+1：_惩击也会给_目标添加圣火_。\n\n_+2：_圣火现在可以蔓延到_可燃地形_，其伤害与_普通火焰一样_。\n\n_+3：_圣火现在可以蔓延到可燃地形上，并且对_敌人造成的伤害更高_。

actors.hero.talent.light_wash.title=圣光洗礼
actors.hero.talent.light_wash.desc=_+1：_红衣主教在使用祈祷技能后，为_自身回复3点生命_。\n\n_+2：_红衣主教在使用祈祷技能后，为_自身回复6点生命_。\n\n_+3：_红衣主教在使用祈祷技能后，为_自身回复9点生命_。

actors.hero.talent.sky_tower.title=通天圣塔
actors.hero.talent.sky_tower.desc=_+1：_生成的圣地区域会扩大至_5*5的方形_。\n\n_+2：_生成的圣地区域会扩大至_7*7的圆形_。红衣主教在圣地区域内_拥有25%的移速加成_。\n\n_+3：_生成的圣地区域会扩大至_7*7的方形_。圣地现在会对_所有类型的怪物造成伤害_。

### 执行者
actors.hero.talent.black_love.title=黑暗奉献
actors.hero.talent.black_love.desc=_+1：_执行模式下的群体伤害会给敌人附加额外的初始值为_2的流血_。\n\n_+2：_执行模式下的群体伤害会给敌人附加额外的初始值为_4的流血_。\n\n_+3：_执行模式下的群体伤害会给敌人附加额外的初始值为_6的流血_。

actors.hero.talent.dead_power.title=殉道之力
actors.hero.talent.dead_power.desc=_+1：_执行者每穿戴一件诅咒装备，他获得的_信仰值就增加16%_。\n\n_+2：_执行者每穿戴一件诅咒装备，他获得的_信仰值就增加32%_。\n\n_+3：_执行者每穿戴一件诅咒装备，他获得的_信仰值就增加50%_。

actors.hero.talent.exp_impotion.title=经验灌注
actors.hero.talent.exp_impotion.desc=_+1：_若执行者的等级小于等于当前楼层数_，则执行者在击杀敌人后_强制获得6点经验_与_2点额外生命_。\n\n_+2：_若执行者的等级小于等于当前楼层数_，则执行者在击杀敌人后_强制获得9点经验_与_2点额外生命_。\n\n_+3：_若执行者的等级小于等于当前楼层数_，则执行者在击杀敌人后_强制获得12点经验_与_2点额外生命_

actors.hero.talent.superstition.title=星界沟通
actors.hero.talent.superstition.desc=_+1：_牧师的法杖与神器充能速率降低_15%_,但牧师每获取_20_点经验值就会额外获取1点信仰值。\n\n_+2：_牧师的法杖与神器充能速率降低_30%_,但牧师每获取_16_点经验值就会额外获取1点信仰值。\n\n_+3：_牧师的法杖与神器充能速率降低_45%_,但牧师每获取_12_点经验值就会额外获取1点信仰值。\n\n_+4：_牧师的法杖与神器充能速率降低_60%_,但牧师每获取_8_点经验值就会额外获取1点信仰值。

actors.hero.talent.vitae_boost.title=生命坚壁
actors.hero.talent.vitae_boost.desc=_+1：_牧师获得临时生命时，多获得_1_点。\n\n_+2：_牧师获得临时生命时，多获得_2_点。\n\n_+3：_牧师在拥有临时生命时，免疫虚弱、易伤、幻惑、降级。\n\n_+4：_牧师在拥有临时生命时，获得2点所有伤害减免。（除饥饿）

actors.hero.talent.adrenal_combat.title=战斗兴奋
actors.hero.talent.adrenal_combat.desc=_+1：_战斗牧师在击杀任意敌人后，获得_3_回合激素涌动；但在以任意形式回复生命后，清空所有的激素涌动层数。\n\n_+2：_战斗牧师在击杀任意敌人后，获得_4_回合激素涌动；但在以任意形式回复生命后，清空所有的激素涌动层数。\n\n_+3：_战斗牧师在击杀任意敌人后，获得_5_回合激素涌动；但在以任意形式回复生命后，清空所有的激素涌动层数。\n\n_+4：_战斗牧师在击杀任意敌人后，获得_6_回合激素涌动；但在以任意形式回复生命后，清空所有的激素涌动层数。

actors.hero.talent.gift.title=神赐之礼
actors.hero.talent.gift.desc=_+1：_战斗牧师的武器和护甲至少拥有_2_的真实等级，在祝福状态下，它们还会+2。\n\n_+2：_战斗牧师的武器和护甲至少拥有_3_的真实等级，在祝福状态下，它们还会+2。\n\n_+3：_战斗牧师的武器和护甲至少拥有_4_的真实等级，在祝福状态下，它们还会+2。\n\n_+4：_战斗牧师的武器和护甲至少拥有_5_的真实等级，在祝福状态下，它们还会+2。

actors.hero.talent.soul_possession.title=圣化转变
actors.hero.talent.soul_possession.desc=_+1_：沾染圣火和踏入圣地的敌人每回合有_1.5%_的概率被沉沦并且回满血量。\n\n_+2_：沾染圣火和踏入圣地的敌人每回合有_2%_的概率被沉沦并且回满血量。\n\n_+3_：沾染圣火和踏入圣地的敌人每回合有_2.5%_的概率被沉沦并且回满血量。\n\n_+4_：沾染圣火和踏入胜地的敌人每回合有_3%_的概率被沉沦并且回满血量。

actors.hero.talent.bloody_vitae.title=圣光障壁
actors.hero.talent.bloody_vitae.desc=_+1：_在红衣主教的生命值因外来的物理/法术攻击减少时，他立刻获得_3_点临时生命。\n\n_+2：_在红衣主教的生命值因外来的物理/法术攻击减少时，他立刻获得_4_点临时生命。\n\n_+3：_在红衣主教的生命值因外来的物理/法术攻击减少时，他立刻获得_5_点临时生命。\n\n_+4：_在红衣主教的生命值因外来的物理/法术攻击减少时，他立刻获得_6_点临时生命。

actors.hero.talent.error.title=天赋开发中
actors.hero.talent.error.desc=这个天赋正在开发中，敬请期待。

# rector armor skill
actors.hero.talent.bless_return.title=圣灵赐福
actors.hero.talent.bless_return.desc=_+1：_在跳跃后，牧师获得因此效果损失生命值_0.75_倍回合数的祝福。\n\n_+2：_在跳跃后，牧师获得因此效果损失生命值_1_倍回合数的祝福。\n\n_+3：_在跳跃后，牧师获得因此效果损失生命值_1.25_倍回合数的祝福。\n\n_+4：_在跳跃后，牧师获得因此效果损失生命值_1.5_倍回合数的祝福。

actors.hero.talent.inertial_charge.title=借力疾驰
actors.hero.talent.inertial_charge.desc=_+1：_牧师跳跃落地后，获得3回合极速。\n\n_+2：_牧师跳跃落地后，获得4回合极速。\n\n_+3：_牧师跳跃落地后，获得5回合极速。\n\n_+4：_牧师跳跃落地后，获得6回合极速。

actors.hero.talent.efficient_healing.title=高效回复
actors.hero.talent.efficient_healing.desc=_+1：_跳跃后将会恢复生命值直到最大生命值的_40%_，生命值的回复速率上升至_1.5_每回合。\n\n_+2：_跳跃后将会恢复生命值直到最大生命值的_45%_，生命值的回复速率上升至_1.75_每回合。\n\n_+3：_跳跃后将会恢复生命值直到最大生命值的_50%_，生命值的回复速率上升至_2_每回合。\n\n_+4：_跳跃后将会恢复生命值直到最大生命值的_55%_，生命值的回复速率上升至_2.5_每回合。

actors.hero.talent.sacrifice.title=暗色契约
actors.hero.talent.sacrifice.desc=_+1：_使用护甲技能时立刻失去等同当前等级 * 2的血量，技能结束时恢复一半的血量。\n\n_+2：_使用护甲技能时立刻失去等同当前等级 * 2的血量，技能结束时恢复等量血量。\n\n_+3：_使用护甲技能时立刻失去等同当前等级 * 2 的血量并获得一半数值的护盾，技能结束时恢复等量血量。\n\n_+4：_使用护甲技能时立刻失去等同当前等级 * 2 的血量并获得等量护盾，技能结束时恢复等量血量。

actors.hero.talent.blocking_reading.title=潜心苦读
actors.hero.talent.blocking_reading.desc=_+1：_在护甲技能持续时间内每阅读一张卷轴，就获得_5_点临时生命。对秘卷效果翻倍。\n\n_+2：_在护甲技能持续时间内每阅读一张卷轴，就获得_6_点临时生命。对秘卷效果翻倍。\n\n_+3：_在护甲技能持续时间内每阅读一张卷轴，就获得_7_点临时生命。对秘卷效果翻倍。\n\n_+4：_在护甲技能持续时间内每阅读一张卷轴，就获得_8_点临时生命。对秘卷效果翻倍。

actors.hero.talent.tai_chi_poise.title=双修牧师
actors.hero.talent.tai_chi_poise.desc=_+1：_现在耗费_5_信仰及以下的信仰技能不会解除暗影咒文。\n\n_+2：_现在耗费_10_信仰及以下的信仰技能不会解除暗影咒文。\n\n_+3：_现在耗费_15_信仰及以下的信仰技能不会解除暗影咒文。\n\n_+4：_现在耗费_20_信仰及以下的信仰技能不会解除暗影咒文。

actors.hero.talent.avatar.title=神灵之触
actors.hero.talent.avatar.desc=_+1：_在开启护甲技能时，获得30回合的魔能透视\n\n_+2：_在护甲技能持续时间内，牧师的攻击速度上升_33%_。\n\n_+3：_在护甲技能持续时间内，牧师的攻击速度上升_67%_。\n\n_+4：_在护甲技能持续时间内，牧师的攻击速度上升_100%_。

actors.hero.talent.godhood.title=无可侵犯
actors.hero.talent.godhood.desc=_+1：_在护甲技能持续时间内每使用一次信仰技能，便获得_2_回合的无敌。\n\n_+2：_在护甲技能持续时间内每使用一次信仰技能，便获得_3_回合的无敌。\n\n_+3：_在护甲技能持续时间内每使用一次信仰技能，便获得_4_回合的无敌。\n\n_+4：_在护甲技能持续时间内每使用一次信仰技能，便获得_5_回合的无敌。

actors.hero.talent.holy_shockwave.title=治愈圣启
actors.hero.talent.holy_shockwave.desc=_+1：_使用凡体受神将会恢复_10_点生命，并击退视野内所有敌人_2_格。\n\n_+2：_使用凡体受神将会恢复_15_点生命，并击退视野内所有敌人_3_格。\n\n_+3：_使用凡体受神将会恢复_20_点生命，并击退视野内所有敌人_4_格。\n\n_+4：_使用凡体受神将会恢复_20_点生命，并击退视野内所有敌人_5_格。

### 月华T1天赋
actors.hero.talent.hunting_intuition.title=猎杀直觉
actors.hero.talent.hunting_intuition.desc=_+1：_月华每获得20次经验，就获得一块神秘的肉。\n\n_+2：_月华每获得15次经验，就获得一块神秘的肉。

actors.hero.talent.sharpening_edge.title=砥砺锋芒
actors.hero.talent.sharpening_edge.desc=_+1：_月华可以以一件已鉴定的武器或护甲为代价鉴定一项同类型物品。\n\n_+2：_月华可以以一件任意武器或护甲为代价鉴定一项同类型物品。

actors.hero.talent.weapon_mastery.title=武器掌握
actors.hero.talent.weapon_mastery.desc=_+1：_月华每连续装备了同一武器_125_回合，就获得_0-1_的伤害加成。\n\n_+2：_月华每连续装备了同一武器_100_回合，就获得_0-1_的伤害加成。\n\n此天赋伤害加成最多叠加5次。

actors.hero.talent.war_trample.title=战争践踏
actors.hero.talent.war_trample.desc=_+1：_月华在踩踏高草时，有75%概率不会损失增益效果的回合数。\n\n_+2：_月华在踩踏高草时，有100%概率不会损失增益效果的回合数。

### 月华T2天赋
actors.hero.talent.meal_utilization.title=利用一餐
actors.hero.talent.meal_utilization.desc=_+1：_月华吃东西很节制，一次只吃一半且只消耗1回合。\n\n_+2：_食物的另一半还能全额触发食物的特殊效果。
actors.hero.talent.strong_body.title=强壮肉体
actors.hero.talent.strong_body.desc=_+1：_月华恢复自身的最大生命值与最大生命值成长。\n\n_+2：_月华额外获得1点最大生命值成长。\n\n_取得该天赋后，需要再升一级才能生效。_

actors.hero.talent.holy_spring.title=神圣泉水
actors.hero.talent.holy_spring.desc=_+1：_月华可以选择将知识之泉或生命之泉转化为1张升级卷轴。\n\n_+2：_月华可以选择将知识之泉或生命之泉转化为1张升级卷轴与2张驱邪卷轴。\n\n此天赋对每种泉水只能生效一次。

actors.hero.talent.triple_insurance.title=三重保险
actors.hero.talent.triple_insurance.desc=_+1：_月华在进食、使用药水或卷轴后获得6点护盾。\n\n_+2：_月华在进食、使用药水或卷轴后获得9点护盾。

actors.hero.talent.catapult_start.title=弹射起步
actors.hero.talent.catapult_start.desc=_+1：_当月华受到残废或冻伤状态后，立刻不消耗充能的使用一次轮椅。\n\n_+2：_轮椅的跳跃距离+1。\n\n未装备轮椅时无法使用。此天赋有50回合的冷却时间。

### 三层公用天赋
actors.hero.talent.sword_shield_knight.title=剑盾骑士
actors.hero.talent.sword_shield_knight.desc=_+1：_月华的护甲最小值至少为其武器伤害最小值的100%。\n\n_+2：_月华的护甲最小值至少为其武器伤害最小值的125%。\n\n_+3：_月华的护甲最小值至少为其武器伤害最小值的150%。\n\n此天赋不能使护甲最小值大于护甲最大值。
items.kindofweapon.sword_shield_knight=由于_剑盾骑士_天赋，你的护甲最小值已经被设定为%d。

actors.hero.talent.wheelchair_crash.title=轮椅翻车
actors.hero.talent.wheelchair_crash.desc=_+1：_月华身处任何加速状态时可以令自己的轮椅急停并坠毁，因此对以自身中心_5*5圆形_范围内的敌人造成_15+加速状态回合数_的物理伤害。\n\n_+2：_对以自身中心_5*5圆形范围_内的敌人造成_23+加速状态回合数_的物理伤害。\n\n_+3：_对以自身中心_5*5圆形范围内_的敌人造成_30+加速状态回合数_的物理伤害。\n\n若有多种加速状态，则取回合数最大值计算。

### 小骑士
actors.hero.talent.little_knight_core.title=小骑士
actors.hero.talent.little_knight_core.desc=小骑士掌握了神秘的酷酷习题之力，在切换武器后可以对敌人立刻发动一次取消攻击，投掷武器会附带2+区域层中毒。小骑士在周围有3个或以上敌人时，还可以立刻将它们踹飞3格。\n\n取消攻击拥有50回合的冷却时间。
actors.hero.herosubclass.little_knight_desc=小骑士切换武器时可以对敌人发动冷却时间为50回合的取消攻击，且投掷武器能让敌人中毒。周围有3个或以上敌人时，还可以立刻将它们踹飞3格。

actors.hero.talent.wont_lose.title=我不会输
actors.hero.talent.wont_lose.desc=_+1：_取消攻击的冷却时间下降为_40_回合。\n\n_+2：_取消攻击的冷却时间下降为_33_回合。\n\n_+3：_取消攻击的冷却时间下降为_25_回合。

actors.hero.talent.wet_enchant.title=濡湿附魔
actors.hero.talent.wet_enchant.desc=_+1：_如果小骑士的武器没有附魔，则视为拥有濡湿附魔。（武器附带0-等级的魔法伤害，有25%概率使敌人虚弱3回合）\n\n_+2：_小骑士的武器始终视为拥有濡湿附魔。\n\n_+3：_小骑士的武器升级不会去除附魔。

actors.hero.talent.left_bow_rapid.title=左弓连射
actors.hero.talent.left_bow_rapid.desc=_+1：_如果目标已有中矢*3状态，则小骑士对其发射的投掷武器不消耗回合。\n\n_+2：_如果目标已有中矢*2状态，则小骑士对其发射的投掷武器不消耗回合。\n\n_+3：_如果目标已有中矢*1状态，则小骑士对其发射的投掷武器不消耗回合。

### 骰子法师
actors.hero.talent.dice_mage_core.title=骰子法师
actors.hero.talent.dice_mage.desc=骰子法师在使用法杖后将会获得0.5+法杖等级*0.05点魔力点，可以使用魔力点释放多种功能各异的强大法术。\n\n也可以在炼金台中使用1点能量兑换1点魔力点。\n\n初始自带切割和愈合法术。\n\n切割：消耗3点魔力点，使视野范围内的所有敌人均分100点魔法伤害。每个敌人至多因此受到25点伤害。\n\n愈合：消耗2点魔力点，将自身的生命值设置为50。每使用一次这个值就降低5。
actors.hero.herosubclass.dice_mage_desc=骰子法师在使用法杖后将会获得0.5+法杖等级*0.05点魔力点，可以使用魔力点释放多种功能各异的强大法术。\n\n也可以在炼金台中使用1点能量兑换1点魔力点。\n\n初始自带切割和愈合法术。\n\n切割：消耗3点魔力点，使视野范围内的所有敌人均分100点魔法伤害。每个敌人至多因此受到25点伤害。\n\n愈合：消耗2点魔力点，将自身的生命值设置为50。每使用一次这个值就降低5。
actors.hero.talent.learn_soothe.title=learn.抚慰
actors.hero.talent.learn_soothe.desc=_+1：_消耗4魔力点，为视野内的所有盟友治疗10点并给予持续15回合的1点再生。\n\n_+2：_消耗4魔力点，为视野内的所有盟友治疗15点并给予持续15回合的2点再生。\n\n_+3：_消耗4魔力点，为视野内的所有盟友治疗20点并给予持续20回合的2点再生。

actors.hero.talent.learn_liquor.title=learn.烈酒
actors.hero.talent.learn_liquor.desc=_+1：_消耗3魔力点，清除一名友方单位除饥饿外的所有负面状态并给予25点护盾。\n\n_+2：_消耗3魔力点，清除一名友方单位除饥饿外的所有负面状态并给予35点护盾。\n\n_+3：_消耗3魔力点，清除一名友方单位除饥饿外的所有负面状态并给予45点护盾。

actors.hero.talent.learn_operate.title=learn.手术
actors.hero.talent.learn_operate.desc=_+1：_消耗3魔力点，复活一个你最近杀死的敌人作为盟友。你每使用一次手术，这个技能的魔力点消耗就增加3。\n\n_+2：_消耗3魔力点，复活一个你最近杀死的敌人作为盟友。你每使用一次手术，这个技能的魔力点消耗就增加2。\n\n_+3：_消耗3魔力点，复活一个你最近杀死的敌人作为盟友。你每使用一次手术，这个技能的魔力点消耗就增加1。

actors.hero.talent.learn_miasma.title=learn.瘴气
actors.hero.talent.learn_miasma.desc=_+1：_消耗3魔力点，对目标地格3*3范围内的单位造成3点伤害并给予这个伤害值*4回合数的中毒。\n\n_+2：_消耗3魔力点，对目标地格5*5范围内的单位造成3点伤害并给予这个伤害值*4回合数的中毒。\n\n_+3：_消耗3魔力点，对目标地格7*7范围内的单位造成3点伤害并给予这个伤害值*4回合数的中毒。

actors.hero.talent.learn_crush.title=learn.碾压
actors.hero.talent.learn_crush.desc=_+1：_消耗3魔力点，对你视野范围内最上方和最下方的敌人造成25点伤害。（不能是同一敌人。）\n\n_+2：_消耗3魔力点，对你视野范围内最上方和最下方的敌人造成38点伤害。（不能是同一敌人。）\n\n_+3：_消耗3魔力点，对你视野范围内最上方和最下方的敌人造成40点伤害。（不能是同一敌人。）

actors.hero.talent.learn_blaze.title=learn.爆燃
actors.hero.talent.learn_blaze.desc=_+1：_消耗6魔力点，对目标造成80点伤害。\n\n_+2：_消耗6魔力点，对目标造成105点伤害。\n\n_+3：_消耗6魔力点，对目标造成130点伤害。
actors.buffs.magicpoint.name=魔力点
actors.buffs.magicpoint.desc=你拥有_%d_点魔力点，可以用来释放骰子法师法术。\n\n愈合当前会将你的生命值设置为_%d_。
actors.buffs.magicpoint.action_name=法术
actors.hero.dicemage.dicemagespell.no_mp=魔力点不足。
actors.hero.dicemage.spells.cutspell.name=切割
actors.hero.dicemage.spells.cutspell.desc=消耗3点魔力点，使视野范围内的所有敌人均分100点魔法伤害。每个敌人至多因此受到25点伤害。
actors.hero.dicemage.spells.cutspell.no_enemy=视野内没有敌人。
actors.hero.dicemage.spells.cutspell.cast=切割！每个敌人受到了%d点伤害。
actors.hero.dicemage.spells.healspell.name=愈合
actors.hero.dicemage.spells.healspell.desc=消耗2点魔力点，将自身的生命值设置为50。每使用一次这个值就降低5。
actors.hero.dicemage.spells.healspell.exhausted=愈合效果已经耗尽。
actors.hero.dicemage.spells.healspell.cast=愈合！恢复了%d点生命。（下次治疗值：%d）
actors.hero.dicemage.spells.healspell.no_heal=愈合！但你的生命值已经很高了。（下次治疗值：%d）
actors.hero.dicemage.spells.soothespell.name=抚慰
actors.hero.dicemage.spells.soothespell.desc=消耗4魔力点，为视野内的所有盟友治疗10/15/20点并给予持续15/15/20回合的1/2/2点再生。
actors.hero.dicemage.spells.soothespell.no_ally=视野内没有可抚慰的盟友。
actors.hero.dicemage.spells.soothespell.cast=抚慰！治疗了%d个盟友%d点生命，并给予每回合+%d生命、持续%d回合的再生。
actors.hero.dicemage.spells.liquorspell.name=烈酒
actors.hero.dicemage.spells.liquorspell.desc=消耗3魔力点，清除一名友方单位除饥饿外的所有负面状态并给予25/35/45点护盾。
actors.hero.dicemage.spells.liquorspell.prompt=选择一个友方单位
actors.hero.dicemage.spells.liquorspell.invalid_target=必须选择一个友方单位。
actors.hero.dicemage.spells.liquorspell.cast=烈酒！清除了负面状态并给予%d点护盾。
actors.hero.dicemage.spells.operatespell.name=手术
actors.hero.dicemage.spells.operatespell.desc=消耗3魔力点，复活一个你最近杀死的敌人作为盟友。你每使用一次手术，这个技能的魔力点消耗就增加3/2/1。
actors.hero.dicemage.spells.operatespell.no_corpse=没有可复活的最近击杀敌人。
actors.hero.dicemage.spells.operatespell.no_space=周围没有足够空间进行手术。
actors.hero.dicemage.spells.operatespell.cast=手术！%s作为盟友复活了。（下次消耗：%d）
actors.hero.dicemage.spells.miasmaspell.name=瘴气
actors.hero.dicemage.spells.miasmaspell.desc=消耗3魔力点，对目标地格3*3/5*5/7*7范围内的单位造成3点伤害并给予这个伤害值*4回合数的中毒。
actors.hero.dicemage.spells.miasmaspell.prompt=选择瘴气中心
actors.hero.dicemage.spells.miasmaspell.cast=瘴气！影响了%d个单位。
actors.hero.dicemage.spells.crushspell.name=碾压
actors.hero.dicemage.spells.crushspell.desc=消耗3魔力点，对你视野范围内最上方和最下方的敌人造成25/38/40点伤害。（不能是同一敌人。）
actors.hero.dicemage.spells.crushspell.not_enough_enemies=视野内没有足够的敌人。
actors.hero.dicemage.spells.crushspell.cast=碾压！最上方和最下方的敌人各受到了%d点伤害。
actors.hero.dicemage.spells.blazespell.name=爆燃
actors.hero.dicemage.spells.blazespell.desc=消耗6魔力点，对目标造成80/105/130点伤害。
actors.hero.dicemage.spells.blazespell.prompt=选择一个敌人
actors.hero.dicemage.spells.blazespell.invalid_target=必须选择一个敌人。
actors.hero.dicemage.spells.blazespell.cast=爆燃！对目标造成了%d点伤害。
