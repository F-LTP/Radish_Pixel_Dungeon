actors.hero.heroclass.duelist=决斗家
actors.hero.heroclass.duelist_desc_short=决斗家是一名武器大师，她能够用武器使出_独特的武技_。使出的武技_依不同武器而异_。
actors.hero.heroclass.duelist_desc=决斗家初始携带一柄_独特的刺剑_，拥有随时间自然充能的特殊武技。\n\n决斗家持有地牢中的任何武器时都将拥有_不同的武技_。\n\n决斗家初始还还携带有_两根飞刺_、布甲、水袋以及绒布袋。\n\n决斗家开局鉴定的物品有：\n_-_鉴定卷轴\n_-_力量药剂\n_-_镜像卷轴
actors.hero.heroclass.duelist_unlock=_在力量达到需求的情况下装备一把2阶或更高阶的武器_以解锁决斗家。

actors.hero.herosubclass.champion=冠军勇士
actors.hero.herosubclass.champion_short_desc=_冠军勇士_可以双持武器，并拥有更多武技充能。她用主武器进行普通攻击，但她也可以自如地切换主、副武器，并施展两武器各自的武技。
actors.hero.herosubclass.champion_desc=冠军勇士善使近战武器，除了主武器，她还能再装备一件副武器。冠军勇士用主武器进行普通攻击，但她可以不耗时地切换主、副武器，也能施放两武器各自的武技。\n\n她还额外有2点武技充能上限，且武技充能回复速率提升50%。
actors.hero.herosubclass.monk=武僧
actors.hero.herosubclass.monk_short_desc=_武僧_在战斗时能够积蓄内力，这些内力可用于施展诸多武功。
actors.hero.herosubclass.monk_desc=武僧的武术造诣十分深厚。她在击败敌人时能够积蓄内力，并用于施放诸多防御性和功能性的能力。内力不会随时间流失，但具有基于武僧等级的存储上限。\n\n1点内力：快速出拳打击\n2点内力：凝神以躲避下次攻击\n3点内力：瞬间闪身至周边\n4点内力：将敌人踢开\n5点内力：冥思以回复充能

