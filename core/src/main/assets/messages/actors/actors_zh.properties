### 十手冠军 核心特性
actors.hero.talent.jutte_champion_core.title=十手冠军
actors.hero.talent.jutte_champion_core.desc=十手冠军能够把任何武器按照阶数转化为性能优越的十手。十手的攻速较快，有一定格挡，并且可以投掷，缺点是攻击和投掷都需要消耗耐久。\n\n十手的力量需求固定为10，伤害为5/6/8/9/10~20/24/32/36/40（阶数），攻击延迟为0.75，格挡为2/2/3/3/4~4/5/6/7/8，精准为1.25，拥有50点耐久度。近战与投掷命中均会消耗耐久度。无法升级。
actors.hero.herosubclass.jitte_champion_core_desc=十手冠军是一把十手，可以把任何武器都转化为性能强大的十手，但会受到耐久度限制。
### 十手冠军 天赋
actors.hero.talent.one_jutte.title=一把十手
actors.hero.talent.one_jutte.desc=_+1：_十手的耐久度上升10点。投掷速度上升20%。\n\n_+2：_十手的耐久度上升17点。投掷速度上升35%。\n\n_+3：_十手的耐久度上升25点。投掷速度上升50%。

actors.hero.talent.iron_quench.title=精铁淬炼
actors.hero.talent.iron_quench.desc=_+1：_若将已升级的武器转化为十手，则那把十手的攻击力额外上升升级数*10%。具有等级的十手损坏时会返还一张升级卷轴。\n\n_+2：_若将已升级的武器转化为十手，则那把十手的攻击力额外上升升级数*20%。具有等级的十手损坏时会返还一张升级卷轴。\n\n_+3：_若将已升级的武器转化为十手，则那把十手的攻击力额外上升升级数*30%。具有等级的十手损坏时会返还一张升级卷轴。

actors.hero.talent.surprise_jutte.title=出其不意
actors.hero.talent.surprise_jutte.desc=_+1：_十手冠军使用十手的伏击不消耗耐久度。\n\n_+2：_十手冠军使用十手的伏击只消耗0.66回合。\n\n_+3：_十手冠军使用十手的伏击只消耗0.33回合。
### 护甲技能
actors.hero.talent.fated_draw.title=注定一抽
actors.hero.talent.fated_draw.desc=月华在绝境之下请神，获得了操纵随机数的力量。月华接下来的_4_次关于伤害、防御、闪避、命中的随机数判定始终取最大值。\n\n充能消耗：30
actors.hero.talent.fated_twice.title=注定二抽
actors.hero.talent.fated_twice.desc=_+1：_随机数判定次数增加为_5_次。\n\n_+2：_随机数判定次数增加为_6_次。\n\n_+3：_随机数判定次数增加为_7_次。\n\n_+4：_随机数判定次数增加为_8_次。

actors.hero.talent.loot_ground.title=搜刮地皮
actors.hero.talent.loot_ground.desc=_+1：_若月华击杀敌人后仍有随机数判定次数，则消耗一次次数获得相当于+2等级财富之戒的掉落奖励。\n\n_+2：_若月华击杀敌人后仍有随机数判定次数，则消耗一次次数获得相当于+4等级财富之戒的掉落奖励。\n\n_+3：_若月华击杀敌人后仍有随机数判定次数，则消耗一次次数获得相当于+6等级财富之戒的掉落奖励。\n\n_+4：_若月华击杀敌人后仍有随机数判定次数，则消耗一次次数获得相当于+8等级财富之戒的掉落奖励。

actors.hero.talents.moonlight.huntingintuitiontalent$experiencecounter.name=猎杀直觉
actors.hero.talents.moonlight.huntingintuitiontalent$experiencecounter.desc=当前进度：%d/%d。
actors.hero.talents.moonlight.huntingintuitiontalent.loot=你注意到这个怪物能吃！

actors.hero.abilities.moonlight.fateddraw.name=注定一抽
actors.hero.abilities.moonlight.fateddraw.short_desc=月华在绝境之下请神，获得了操纵随机数的力量，接下来的几次判定始终取最大值。
actors.hero.abilities.moonlight.fateddraw.desc=月华向命运之神祈祷，获得了暂时操纵随机数的能力。\n\n激活后，月华获得4次随机数判定次数，进行伤害、防御、闪避、命中骰之一的时候，会消耗1次次数让这个随机数取最大值。\n\n充能消耗：30
actors.hero.abilities.moonlight.fateddraw.activated=你感受到命运的力量流入体内，接下来的随机数判定将由你掌控！

actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.name=注定一抽
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.desc=月华正在认真游戏，接下来的随机数判定将消耗判定次数并取可能的最大值。
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.fated_active=剩余注定%d抽
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.time_pause=时间暂留：本回合剩余注定%d抽
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.expired=你感觉命运女神看你就像是一只普通的小猫。
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.fated_expired=取最大值的效果已经结束。
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.loot_drop=好运让你发现了一个物品！

actors.hero.abilities.moonlight.ashking.name=薪王化身
actors.hero.abilities.moonlight.ashking.short_desc=月华将神器/法杖/投武转化为三种战斗形态。
actors.hero.abilities.moonlight.ashking.desc=那是最终成为柴薪的不死人月华，历代薪王的精神与力量凝聚于此。激活后，下一次使用神器、法杖或投武将触发对应的薪王形态。\n\n能量消耗：50
actors.hero.abilities.moonlight.ashking.ready=薪王们的灵魂，要使用吗...
actors.hero.abilities.moonlight.ashking.already_active=王啊，请您忍耐，等待这个灵魂散去。
actors.hero.abilities.moonlight.ashking$incarnationready.name=薪王们的灵魂在燃烧
actors.hero.abilities.moonlight.ashking$incarnationready.desc=下一次使用神器/法杖/投武将触发对应的薪王形态。
actors.hero.abilities.moonlight.ashking$holylanceform.name=神佑长枪
actors.hero.abilities.moonlight.ashking$holylanceform.desc=照明效果和攻击距离+1。剩余回合：%s
actors.hero.abilities.moonlight.ashking$holylanceform.activated=太阳就在这里，葛温王的灵魂！持续%d回合。
actors.hero.abilities.moonlight.ashking$soulstreamform.name=灵魂激流
actors.hero.abilities.moonlight.ashking$soulstreamform.desc=月华处于灵魂激流形态，法杖攻击穿透敌人。剩余回合：%s，免费施法次数：%d
actors.hero.abilities.moonlight.ashking$soulstreamform.activated=古老的月光，敬请见证！持续%d回合，获得%d次免费施法。
actors.hero.abilities.moonlight.ashking$fatalbladeform.name=索命弯刀
actors.hero.abilities.moonlight.ashking$fatalbladeform.desc=月华处于索命弯刀形态，投武攻击产生毒雾，附近有敌人时移速翻倍。剩余回合：%s
actors.hero.abilities.moonlight.ashking$fatalbladeform.activated=黑暗之环高悬，游魂之王，带领我们！持续%d回合。

actors.hero.talent.time_pause.title=时间暂留
actors.hero.talent.time_pause.desc=_+1：_在同一回合内的至多_2_次判定将只消耗一次随机数判定次数。\n\n_+2：_在同一回合内的至多_3_次判定将只消耗一次随机数判定次数。\n\n_+3：_在同一回合内的至多_4_次判定将只消耗一次随机数判定次数。\n\n_+4：_在同一回合内的至多_5_次判定将只消耗一次随机数判定次数。
actors.hero.talent.toy_backpack.title=玩具背包
actors.hero.talent.toy_backpack.desc=月华为护甲加装了Slice & Dice玩具栏，可以消耗充能获得随机Slice & Dice玩具。这类玩具在背包中存在和挂载的最大数量都是1个，且脱离背包就会烟消云散。\n\n由于仓促，你无法从玩具里二选一，默认获得随机1-2阶物品。 充能消耗：35
actors.hero.talent.better_item.title=更好物品
actors.hero.talent.better_item.desc=_+0：_生成_1-2_阶物品。\n\n_+1：_生成_2-3_阶物品。\n\n_+2：_生成_3-4_阶物品。\n\n_+3：_生成_4-5_阶物品。\n\n_+4：_生成_5-6_阶物品。
actors.hero.talent.extra_pocket.title=额外口袋
actors.hero.talent.extra_pocket.desc=_+0：_背包最多总共拥有_1_个玩具，同时只能挂载_1_个玩具。\n\n_+1：_背包最多总共拥有_3_个玩具，可以同时挂载_1_个玩具。\n\n_+2：_背包最多总共拥有_5_个玩具，可以同时挂载_1_个玩具。\n\n_+3：_背包最多总共拥有_7_个玩具，可以同时挂载_2_个玩具。\n\n_+4：_背包最多总共拥有_10_个玩具，可以同时挂载_2_个玩具。
actors.hero.talent.accept_challenge.title=每场战斗挑战：标准挑战
actors.hero.talent.accept_challenge.desc=_+1/+2/+3/+4：_挑战会生成1-3个本区域随机怪物，或生成1个下一区域随机怪物和0-1个本区域随机怪物；后者的出现概率为15%/30%/45%/60%，支线中不会生成下一区域怪物。挑战内容和1-2个随机玩具效果会提前确定并显示，挑战难度越高，出现2个效果的概率越高。接受后，效果持续25/50/75/100回合，不占用背包容量或护甲挂载槽，并可在护甲的玩具背包信息中查看。每次挑战获得的效果独立计时，即使抽到同一种玩具效果也不会合并持续时间。
actors.hero.talent.lord_of_cinder.title=薪王化身
actors.hero.talent.lord_of_cinder.desc=那是最终成为柴薪的不死人月华，历代薪王的精神与力量凝聚于此，月华可以在开启衣服该技能后，使用神器 / 法杖 / 投武来激发对应的薪王形态。\n\n 能量消耗：50
actors.hero.talent.blessed_spear.title=神佑长枪
actors.hero.talent.blessed_spear.desc=使用神器进入_10_回合该形态，击退_7*7_圆形范围内的敌人5格，持续时间内获得照明和攻击距离+1。\n\n_+1_:持续时间为15回合。\n\n_+2_:持续时间为20回合。\n\n_+3_:持续时间为25回合。\n\n_+4_:持续时间为30回合。
actors.hero.talent.soul_stream.title=灵魂激流
actors.hero.talent.soul_stream.desc=使用法杖进入_10_回合该形态，获得5次法杖免费使用次数，该形态下所有法杖都会穿透敌人。\n\n_+1：_持续时间为_15_回合。\n\n_+2：_持续时间为_20_回合。\n\n_+3：_持续时间为_25_回合。\n\n_+4：_持续时间为_30_回合。
actors.hero.talent.death_scimitar.title=索命弯刀
actors.hero.talent.death_scimitar.desc=使用投武进入_10_回合该形态，该形态下，投武会在目标处释放250气体量的毒雾，3*3范围内有敌人时移速翻倍。\n\n_+1：_持续时间为_15_回合。\n\n_+2：_持续时间为_20_回合\n\n_+3：_持续时间为_25_回合。

actors.hero.hero.detour_title=路径有战争迷雾
actors.hero.hero.detor_desc=你和目的地之间有战争迷雾，但有一条很远的通路可以前往目的地。要绕远路前往吗？
actors.hero.hero.detour_yes=是，绕远路前往
actors.hero.hero.detour_no=否，取消移动
