actors.hero.dicemage.spells.miasmaspell.name=Miasma
actors.hero.dicemage.spells.miasmaspell.desc=Nature L3. Costs 3 MP: unleash a dense miasma at the target cell (volume 80, like a +3 corrosive wand). Each turn it deals poison damage to enemies inside that scales with depth, and stacks 2 poison levels.
actors.hero.dicemage.spells.miasmaspell.prompt=Select miasma center
actors.hero.dicemage.spells.miasmaspell.invalid_target=Miasma needs an open cell to spread from.
