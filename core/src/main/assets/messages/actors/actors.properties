items.cards.cardtype.trap.name=trap card
items.cards.cardtype.trap.desc=Records a trap. Playing it releases that trap at the target and reverts to a blank card.
items.cards.cardtype.teleport.name=teleport card
items.cards.cardtype.teleport.desc=Teleports you a short distance, crossing enemies but not walls or obstacles.
items.cards.cardeffects.gaze=Your sight pierces the walls.
