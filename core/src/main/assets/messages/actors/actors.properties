 actors.hero.dicemage.spells.vinespell.desc=Nature L2. Costs 1 MP: grant an ally 3-11 shield, or deal 3-7 plus 2 x (strength - 10) damage to an enemy with a 33% chance to entangle for 2 turns (entangle duration stacks). Takes 0.33 turns to cast.
