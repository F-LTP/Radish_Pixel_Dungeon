actors.hero.hero.one_way_gate=This is a one-way gate. It can only be passed from the other side.

actors.hero.talent.gaze_card.title=piercing gaze
actors.hero.talent.gaze_card.desc=_+1:_ Gain _1_ gaze card, revealing enemies within _8_ tiles for _20_ turns.\n\n_+2:_ The gaze card lasts _20_ turns and cancels draw cooldown when played.\n\n_+3:_ The gaze card lasts _20_ turns, cancels draw cooldown and costs no turn when played.\n\n_+4:_ The gaze card lasts _20_ turns, cancels draw cooldown, costs no turn, and grants _5_ turns of danger sense.
actors.hero.talent.data_cleanse.title=data cleanse
actors.hero.talent.data_cleanse.desc=_+1:_ Gain _1_ cleanse, which turns _1_ non-blank card into a blank card.\n\n_+2:_ Gain _2_ cleanses in total.\n\n_+3:_ Gain _3_ cleanses in total.\n\n_+4:_ Gain _4_ cleanses in total.
actors.hero.talent.ct_vendetta.title=vendetta
actors.hero.talent.ct_vendetta.desc=_+1:_ While using defense cards, _15%_ of damage taken is stored as damage.\n\n_+2:_ While using defense cards, _30%_ of damage taken is stored as damage.\n\n_+3:_ While using defense cards, _45%_ of damage taken is stored as damage.\n\n_+4:_ While using defense cards, _60%_ of damage taken is stored as damage.
actors.hero.talent.ct_last_stand.title=last stand
actors.hero.talent.ct_last_stand.desc=_+1:_ If the current card is an attack card and the next card is also an attack card, it also strikes _1_ random target for _50%_ damage.\n\n_+2:_ If the current card is an attack card and the next card is also an attack card, it also strikes _2_ random targets for _50%_ damage.\n\n_+3:_ If the current card is an attack card and the next card is also an attack card, it also strikes _2_ random targets for _75%_ damage.\n\n_+4:_ If the current card is an attack card and the next card is also an attack card, it also strikes _2_ random targets for _100%_ damage.
actors.hero.talent.minimalism.title=minimalism
actors.hero.talent.minimalism.desc=_+1:_ Gain _1_ card deletion.\n\n_+2:_ Gain _2_ card deletions in total.\n\n_+3:_ Gain _3_ card deletions in total.\n\n_+4:_ Gain _4_ card deletions in total.
actors.hero.talent.fancy_shuffle.title=fancy shuffle
actors.hero.talent.fancy_shuffle.desc=_+1:_ If any blank cards were spun, play one of them at a random visible target.\n\n_+2:_ The Spin Master passive spins _2_ every _50_ turns.\n\n_+3:_ Spin cards, grand finale and well prepared are inserted at a random position in the deck after being played.\n\n_+4:_ Spin cards and well prepared cancel draw cooldown when played.
actors.hero.talent.trap_craft.title=trap craft
actors.hero.talent.trap_craft.desc=_+1:_ Each distinct trap card reduces trap cooldown by _1_ turn, to a minimum of _20_.\n\n_+2:_ Each distinct trap card reduces trap cooldown by _2_ turns, to a minimum of _15_.\n\n_+3:_ Each distinct trap card reduces trap cooldown by _3_ turns, to a minimum of _10_.
actors.hero.talent.spirit_coordination.title=spirit coordination
actors.hero.talent.spirit_coordination.desc=_+1:_ After using a wand, reduce trap cooldown and draw cooldown by _1_ turn.\n\n_+2:_ After using a wand, reduce trap cooldown and draw cooldown by _2_ turns.\n\n_+3:_ After using a wand, reduce trap cooldown and draw cooldown by _3_ turns.
actors.hero.talent.deck_combo.title=deck combo
actors.hero.talent.deck_combo.desc=_+1:_ If the current card is a trap card and the next card is not, gain _2_ turns of wand recharge and _2_ turns of artifact recharge after playing it.\n\n_+2:_ Playing a trap card also plays the topmost blank card in the deck at the target, costing _1_ turn in total.\n\n_+3:_ Blank cards automatically become a random trap card after use.
actors.hero.talent.trap_mastery.title=trap mastery
actors.hero.talent.trap_mastery.desc=_+1:_ Targeted trap cards never target yourself.\n\n_+2:_ Non-targeted trap cards cost no turn.\n\n_+3:_ Summoning trap cards blind visible enemies for _5_ turns.\n\n_+4:_ Teleportation trap cards grant _5_ turns of mind vision.
actors.hero.talent.careful_selection.title=careful selection
actors.hero.talent.careful_selection.desc=_+1:_ Playing a trap card reduces draw cooldown by _5_.\n\n_+2:_ You may cancel releasing a trap card and put it at the bottom of the deck.\n\n_+3:_ Cancelling a trap card also cancels draw cooldown.\n\n_+4:_ Cancelling a trap card costs no turn.
actors.hero.talent.swift_step.title=swift step
actors.hero.talent.swift_step.desc=_+1:_ After playing a teleport card, gain _1_ turn of Haste and reduce draw cooldown by _1_.\n\n_+2:_ After playing a teleport card, gain _2_ turns of Haste and reduce draw cooldown by _2_.\n\n_+3:_ After playing a teleport card, gain _3_ turns of Haste and reduce draw cooldown by _3_.\n\n_+4:_ After playing a teleport card, gain _4_ turns of Haste and reduce draw cooldown by _4_.
actors.hero.talent.emergency_repeat.title=emergency repeat
actors.hero.talent.emergency_repeat.desc=_+1:_ After playing a teleport card, you may immediately use the armor ability again for _80%_ of its charge cost.\n\n_+2:_ After playing a teleport card, you may immediately use the armor ability again for _70%_ of its charge cost.\n\n_+3:_ After playing a teleport card, you may immediately use the armor ability again for _60%_ of its charge cost.\n\n_+4:_ After playing a teleport card, you may immediately use the armor ability again for _50%_ of its charge cost.
actors.hero.talent.momentum_tp.title=momentum
actors.hero.talent.momentum_tp.desc=_+1:_ Teleport range becomes _3_ tiles.\n\n_+2:_ Teleport range becomes _4_ tiles.\n\n_+3:_ Teleport range becomes _5_ tiles.\n\n_+4:_ Teleport range becomes _6_ tiles.
actors.hero.talent.long_storage.title=long-term storage
actors.hero.talent.long_storage.desc=_+1:_ Storage slot lasts _25_ turns.\n\n_+2:_ Storage slot lasts _30_ turns.\n\n_+3:_ Storage slot lasts _35_ turns.\n\n_+4:_ Storage slot lasts _40_ turns.
actors.hero.talent.bag_expansion.title=bag expansion
actors.hero.talent.bag_expansion.desc=_+1:_ Store up to _2_ cards.\n\n_+2:_ Store up to _3_ cards.\n\n_+3:_ Store up to _4_ cards.\n\n_+4:_ Store up to _5_ cards.
actors.hero.talent.effective_use.title=effective use
actors.hero.talent.effective_use.desc=_+1:_ Playing a stored card has a _10%_ chance to keep it in storage.\n\n_+2:_ Playing a stored card has a _20%_ chance to keep it in storage.\n\n_+3:_ Playing a stored card has a _30%_ chance to keep it in storage.\n\n_+4:_ Playing a stored card has a _40%_ chance to keep it in storage.
actors.hero.talent.heavy_reward.title=heavy reward
actors.hero.talent.heavy_reward.desc=_+1:_ Bone to gold drops as if at _+3_ wealth.\n\n_+2:_ Bone to gold drops as if at _+4_ wealth.\n\n_+3:_ Bone to gold drops as if at _+5_ wealth.\n\n_+4:_ Bone to gold drops as if at _+6_ wealth.
actors.hero.talent.lingering.title=lingering
actors.hero.talent.lingering.desc=_+1:_ Bone to gold lasts _6_ turns.\n\n_+2:_ Bone to gold lasts _7_ turns.\n\n_+3:_ Bone to gold lasts _8_ turns.\n\n_+4:_ Bone to gold lasts _9_ turns.
actors.hero.talent.extra_blessing.title=extra blessing
actors.hero.talent.extra_blessing.desc=_+1:_ Bone to gold restores _3%_ of max HP when triggered.\n\n_+2:_ Bone to gold restores _4%_ of max HP when triggered.\n\n_+3:_ Bone to gold restores _5%_ of max HP when triggered.\n\n_+4:_ Bone to gold restores _6%_ of max HP when triggered.
