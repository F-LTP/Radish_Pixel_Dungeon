items.cards.cardeffects$nextattackfree.name=ready to strike
items.cards.cardeffects$nextattackfree.desc=Your next attack card costs no turn.

actors.mobs.druidwolf.name=druid wolf
actors.mobs.druidwolf.desc=A wolf called forth by the druid's life force. Quicker than a wild beast, its bite leaves a bleeding wound.

actors.mobs.druidbear.name=druid bear
actors.mobs.druidbear.desc=A bear called forth by the druid's life force. Thick-skinned and heavy-handed, it is the one that stands in front.

actors.mobs.druidboar.name=druid boar
actors.mobs.druidboar.desc=A boar called forth by the druid's life force. It charges fast and hits hard.

actors.mobs.druidoaksage.name=oak sage
actors.mobs.druidoaksage.desc=The mind of an ancient oak. It cannot be harmed, and quietly shields its companions.

actors.mobs.druidvines.name=thorn vines
actors.mobs.druidvines.desc=Rooted thorn vines that cannot move. They strike back at anything that comes close, and shrug off most magic.

actors.mobs.druidsunflower.name=sunflower
actors.mobs.druidsunflower.desc=A rooted sunflower that fires glowing pollen at distant foes and drains their life. When it is at full health, the stolen life is shared with nearby allies.

actors.mobs.npcs.peddler.name_0=Ochre
actors.mobs.npcs.peddler.desc_0=Ochre -- a rations peddler. Food and drink only, at the city merchant's price.
actors.mobs.npcs.peddler.talk_0=Fear not, I sell no lives. The goods are here, money for goods, then we part.
actors.mobs.npcs.peddler.talk_more_0=The road is long. Carry enough potions; don't remember them on depth three.
actors.mobs.npcs.peddler.name_1=Aster
actors.mobs.npcs.peddler.desc_1=Aster -- an apothecary. She sells what you will need at midnight.
actors.mobs.npcs.peddler.talk_1=I pulled these bottles from very deep places. I'd rather not look closely at what's inside.
actors.mobs.npcs.peddler.talk_more_1=Don't drink them all at once. The body keeps count.
actors.mobs.npcs.peddler.name_2=Hush
actors.mobs.npcs.peddler.desc_2=Hush -- a blind man who can read. Sells scrolls, says little.
actors.mobs.npcs.peddler.talk_2=...Prices are on the goods. Look yourself.
actors.mobs.npcs.peddler.talk_more_2=Take it and go. Don't look back.
actors.mobs.npcs.peddler.name_3=Pale
actors.mobs.npcs.peddler.desc_3=Pale -- a mapmaker. He sells the fact that you are already somewhere.
actors.mobs.npcs.peddler.talk_3=Mist loses people, and shows them the way home. Buying a map?
actors.mobs.npcs.peddler.talk_more_3=The mist will clear. Come back when you are out.
actors.mobs.npcs.peddler.name_4=Ember
actors.mobs.npcs.peddler.desc_4=Ember -- she keeps curses. She sells the way to wipe one clean.
actors.mobs.npcs.peddler.talk_4=The forge is still hot. Speak quickly, before the fire dies.
actors.mobs.npcs.peddler.talk_more_4=If what you carry is unclean, don't carry it deeper.
actors.mobs.npcs.peddler.name_5=Ashfeather
actors.mobs.npcs.peddler.desc_5=Ashfeather -- sells nothing. She does one thing: sends you back.
actors.mobs.npcs.peddler.talk_5=Sit still. It will hurt, but less than dying here.
actors.mobs.npcs.peddler.talk_more_5=Coming back alive matters more than buying right.
actors.mobs.npcs.peddler.name_6=Ledger
actors.mobs.npcs.peddler.desc_6=Ledger -- sells words, not goods. Now and then he slips you a page.
actors.mobs.npcs.peddler.talk_6=Knowledge is not cheap. Things cheaper than knowledge are usually dearer.
actors.mobs.npcs.peddler.talk_more_6=You won't know its worth until the last page.
actors.mobs.npcs.peddler.opt_buy=Browse goods
actors.mobs.npcs.peddler.opt_talk=Talk
actors.mobs.npcs.peddler.opt_service=Heal (%1$d gold)
actors.mobs.npcs.peddler.opt_leave=Leave
actors.mobs.npcs.peddler.flee=The figure is gone, leaving only a wisp of smoke.
actors.mobs.npcs.peddler.service_done=She takes %1$d gold and sets you right, wounds and bad humours alike.
actors.mobs.npcs.peddler.service_poor=You only have %1$d gold on you. She shakes her head.
actors.mobs.npcs.peddler.service_idle=She looks you up and down. "Nothing here to mend."

actors.mobs.warden.name=Warden
actors.mobs.warden.desc=The highest administrator of this prison, his mind has inevitably deteriorated over time.\n\nHe commands a vast army of machines. The good news is that they all start inactive, and you may even be able to turn some of them to your side!
actors.mobs.warden.boss_appear=The Warden has noticed you, and the whole prison starts to hum...
actors.mobs.warden.activating=The Warden is waking a prototype...
actors.mobs.warden.activated=A prototype has been awakened by the Warden!
actors.mobs.warden.enraged=The Warden's eyes glow red, his forces grow restless!
actors.mobs.warden.faster=The Warden has learned to control the machines faster!

actors.mobs.wardenprototype.name=Prototype
actors.mobs.wardenprototype.name_100=DM-100 Prototype
actors.mobs.wardenprototype.name_175=DM-175 Prototype
actors.mobs.wardenprototype.desc=A dormant prison defense machine. Whoever takes control of it first will have it fight for them.
actors.mobs.wardenprototype.activated_warden=Joined the Warden
actors.mobs.wardenprototype.activated_hero=Joined you
actors.mobs.wardenprototype.hacking_start=You start slicing into the prototype...

# ==== Legendary Felon: boss lock and roar ====
actors.mobs.legendaryfelon.seal=Heavy iron gates slam shut. The Legendary Felon has no intention of letting you leave.
actors.mobs.legendaryfelon.roar=The Legendary Felon lets out a deafening roar!
actors.mobs.legendaryfelon.roar_status=Fear
actors.hero.fear_no_melee=You are gripped by fear! Your hands tremble too much to use a melee weapon.
actors.mobs.npcs.peddler.opt_swap=Swap places
actors.mobs.npcs.peddler.swap_done=You and the peddler swap places.
windows.wndcarddrawer.counts_no_discard=Draw pile: %d
windows.wndcarddrawer.trap_content=Absorbed: %s
actors.mobs.npcs.peddler.swap_blocked=Can't swap there: that tile has a trap or is occupied.
actors.buffs.catapultstartbuff.desc=You are primed to launch! Your next wheelchair ride costs no charge.\n\nCatapult start remaining: %s turns.
actors.hero.talent.catapult_start.desc=_+1:_ When the Moonlight is crippled or frostbitten, gain one free wheelchair ride lasting 10 turns.\n\n_+2:_ Wheelchair jump distance +1.\n\nRequires a wheelchair; 50 turn cooldown.
actors.mobs.radishenemy.goblinrider.name=Goblin Rider
actors.mobs.radishenemy.goblinrider.desc=A pioneering goblin of its tribe, riding a frog and skilled with throwing spears.\n\nIts melee attacks strike together with the frog.
actors.mobs.radishenemy.goblinrider.kill=The Goblin Rider's spear finished you.

### 投掷物同步

### 工程师与相关新增文本（同步自 feat/breakball）
actors.buffs.brokenarmor.name=Broken Armor
actors.buffs.brokenarmor.desc=Your armor is cracked and offers reduced protection.
actors.buffs.pulse.name=Electromagnetic Pulse
actors.buffs.pulse.desc=The circuitry in your multi-tool is charging, preparing to fire an electromagnetic pulse.\n\nAt your current level these pulses deal %1$d~%2$d damage and paralyse organic enemies, stun inorganic enemies, or frenzy mechanical enemies for %3$d turns. Pulses deal extra damage to mechanical enemies.\n\nTurns until charged: %4$d
actors.buffs.pulse.cd=Your multi-tool is not charged yet.
actors.buffs.pulse.no_tool=You need a multi-tool to fire a pulse!
actors.buffs.pulse$1.prompt=Select pulse target
actors.hero.heroclass.engineer=Engineer
actors.hero.heroclass.engineer_desc_short=Engineers disarm traps for _metal parts_ to upgrade their gear, and fire _electromagnetic pulses_ to damage and disrupt their enemies.
actors.hero.heroclass.engineer_desc=The engineer carries a _unique multi-tool_. It can dismantle spent traps for metal parts, or fire an _electromagnetic pulse_ that deals light damage and briefly debuffs enemies.\n\nKilling mechanical enemies yields _metal parts_. They are kept in a velvet pouch and used to craft modifications for weapons, armor and wands.\n\nThe engineer also starts with cloth armor, a waterskin and a velvet pouch.\n\nItems identified at the start of the run:\n_-_Scroll of Identify\n_-_Potion of Paralysis\n_-_Scroll of Recharging
actors.hero.heroclass.engineer_unlock=_Trigger five traps in a single game_ to unlock the Engineer.
actors.hero.herosubclass.craftsman=Craftsman
actors.hero.herosubclass.craftsman_short_desc=The _Craftsman_ builds stronger modifications and salvages more metal parts from traps and machines.
actors.hero.herosubclass.craftsman_desc=The craftsman has a deep understanding of every mechanism she meets, and can assemble far more precise and powerful modifications.\n\nHer eye for salvage is sharper too, and she recovers more metal parts when dismantling traps.
actors.hero.herosubclass.hacker=Hacker
actors.hero.herosubclass.hacker_short_desc=The _Hacker's_ pulses reach further, hit harder, and can fully subvert inorganic enemies.
actors.hero.herosubclass.hacker_desc=The hacker's pulses are far more potent. They spread to every enemy in a 3x3 area around the target, confuse all of them, and have a 15% chance to corrupt inorganic enemies outright.
actors.hero.herosubclass.grenadier=Grenadier
actors.hero.herosubclass.grenadier_short_desc=The _Grenadier_ crafts bombs from metal parts, and her bombs pierce enemy armor.
actors.hero.herosubclass.grenadier_desc=The grenadier loves a good explosion. She can spend 3 metal parts to craft a bomb instead of a modification, and the bombs she throws detonate instantly and ignore enemy armor.
actors.hero.abilities.engineer.forcefield.name=Deflection Field
actors.hero.abilities.engineer.forcefield.short_desc=The engineer raises a _deflection field_ that saps the strength of incoming attacks and shocks nearby enemies when it collapses.
actors.hero.abilities.engineer.forcefield.desc=The engineer opens a deflection field from her mech, twisting and weakening enemy attacks. For 15 turns she gains 5~15 points of damage reduction. When it would end, the field holds for one more hit before collapsing, releasing the absorbed energy to blind and vertigo enemies within 2 tiles.\n\nAny damage absorbed by the field still counts as a hit taken.
actors.hero.abilities.engineer.forcefield$field.name=Deflection Field
actors.hero.abilities.engineer.forcefield$field.desc=A deflection field bends enemy attacks around the engineer.\n\nWhile it holds she has %1$d~%2$d points of extra armor.\n\nTurns remaining: %3$s
actors.hero.abilities.engineer.forcefield$field.desc_detach=A deflection field bends enemy attacks around the engineer.\n\nWhile it holds she has %1$d~%2$d points of extra armor. It can absorb one more hit, then its stored energy will shock nearby enemies.
actors.hero.abilities.engineer.summoningbeacon.name=Summoning Beacon
actors.hero.abilities.engineer.summoningbeacon.short_desc=The engineer uses the mech's _summoning beacon_ to call machines up from the surface.
actors.hero.abilities.engineer.summoningbeacon.desc=The engineer contacts the surface through the mech's _summoning beacon_ and calls for support, summoning 2 machines around herself. DM-100s, DM-200s and golems are equally likely, and a summoned DM-200 has the usual chance to be replaced by a DM-201.
actors.hero.abilities.engineer.detonator.name=Remote Detonator
actors.hero.abilities.engineer.detonator.short_desc=The engineer plants a _remote detonator_ that can be triggered later, or that blows on its own when threatened.
actors.hero.abilities.engineer.detonator.desc=The engineer plants a _remote detonator_ nearby. It can be disarmed, triggered manually, or set off when an enemy attacks it. Once triggered it produces several explosions over 2 rounds.\n\nIf a detonator is already placed, targeting yourself triggers it, targeting a nearby tile disarms it and places a new one, and targeting a distant tile only disarms it. Disarming a detonator that has not yet exploded refunds half of the armor charge.
actors.hero.abilities.engineer.detonator.prompt=Select where to place the detonator
actors.hero.abilities.engineer.detonator.invalid_pos=That position cannot be used.
actors.hero.abilities.engineer.detonator.demolish=You disarmed the previous detonator.
actors.hero.abilities.engineer.detonator.too_far=That position is too far away.
actors.hero.abilities.engineer.detonator$detonationmob.name=Detonator
actors.hero.abilities.engineer.detonator$detonationmob.desc=A small charge of unstable chemicals in a metal canister. It was meant to set off other explosives, but packed with a potent charge of its own it is dangerous enough on its own.
actors.hero.abilities.engineer.detonator$detonationmob.stats_desc_stable=The detonator is still stable.
actors.hero.abilities.engineer.detonator$detonationmob.stats_desc_explode=The detonator has been lit, run! Explosions so far: %s
actors.hero.abilities.engineer.detonator$detonationmob.explode=You hear your detonator go off.
actors.mobs.engineer.name=Dwarven Engineer
actors.mobs.engineer.desc=While the warlocks rose to power, some dwarves held on to their old craft: engineering. After an elite warlock seized the throne, the engineers fell even lower than before, scraping a living from plastering walls and laying tiles. Perhaps their love of the craft made them stubborn beyond reason: they would rather die than surrender their free will.\n\nThe picks in these engineers' hands are sharp enough to punch straight through your armor. Afterwards, though, they need a moment to catch their breath.
actors.hero.talent.keen_meal.title=Keen Meal
actors.hero.talent.keen_meal.desc=_+1:_ Eating instantly disarms up to _3_ traps within 5 tiles.\n\n_+2:_ Up to _5_ traps within 8 tiles.\n\nThis talent also disarms hidden traps.
actors.hero.talent.fine_intuition.title=Fine Intuition
actors.hero.talent.fine_intuition.desc=_+1:_ Guessing a runestone correctly does not use it up.\n\n_+2:_ Divination scrolls identify _2_ extra items.
actors.hero.talent.tested_maintenance.title=Tested Maintenance
actors.hero.talent.tested_maintenance.desc=_+1:_ Identifying an item restores _2_ durability to the modifications on your weapon and armor.\n\n_+2:_ _4_ durability.
actors.hero.talent.general_disarm.title=General Disarm
actors.hero.talent.general_disarm.desc=_+1:_ After disarming a trap, your next 3 melee attacks deal _2_ extra damage.\n\n_+2:_ _4_ extra damage.
actors.hero.talent.pulse_energy.title=Pulse Energy
actors.hero.talent.pulse_energy.desc=_+1:_ Firing a pulse grants _3_ shielding.\n\n_+2:_ _5_ shielding.
actors.hero.talent.toilsome_meal.title=Toilsome Meal
actors.hero.talent.toilsome_meal.desc=_+1:_ You may act while eating. Satiety is applied when the meal finishes, but attacking or being attacked wastes the food.\n\n_+2:_ An interrupted meal is not wasted.
actors.hero.talent.ionic_liquid.title=Ionic Liquid
actors.hero.talent.ionic_liquid.desc=_+1:_ Drinking or throwing a potion reduces the pulse cooldown by _15 turns_.\n\n_+2:_ _30 turns_.
actors.hero.talent.strong_pulse.title=Strong Pulse
actors.hero.talent.strong_pulse.desc=_+1:_ Pulse debuffs last _1_ turn longer.\n\n_+2:_ _2_ turns longer.
actors.hero.talent.resonant_sensing.title=Resonant Sensing
actors.hero.talent.resonant_sensing.desc=_+1:_ Killing an enemy with a pulse grants _3_ turns of wand recharging.\n\n_+2:_ _5_ turns.
actors.hero.talent.apart_anything.title=Apart Anything
actors.hero.talent.apart_anything.desc=_+1:_ You can dismantle pedestals like traps and gain _metal parts_ from them.\n\n_+2:_ You can also install modifications from the inventory screen of your armor and melee weapon.
actors.hero.talent.remote_destruction.title=Remote Destruction
actors.hero.talent.remote_destruction.desc=_+1:_ Throwing a metal part at a mechanical enemy consumes it and _cripples_ the enemy for 7 turns.\n\n_+2:_ Inorganic enemies are affected as well.
actors.hero.talent.durable_modifies.title=Durable Modifications
actors.hero.talent.durable_modifies.desc=_+1:_ Modification durability +_15%_.\n\n_+2:_ +_30%_.\n\n_+3:_ +_45%_.
actors.hero.talent.electronic_repair.title=Electronic Repair
actors.hero.talent.electronic_repair.desc=_+1:_ Firing a pulse at a spent trap repairs it for _4_ alchemical energy.\n\n_+2:_ _3_ energy.
actors.hero.talent.ionizing_radiation.title=Ionizing Radiation
actors.hero.talent.ionizing_radiation.desc=_+1:_ Pulses also deal half of their damage as _delayed damage_.\n\n_+2:_ Equal damage.\n\n_+3:_ One and a half times the damage.
actors.hero.talent.active_repair.title=Active Repair
actors.hero.talent.active_repair.desc=_+1:_ Adding the same modification to an already modified item _stacks_ its durability.\n\n_+2:_ A second modification type may be installed.
actors.hero.talent.multi_modify.title=Multi Modify
actors.hero.talent.multi_modify.desc=_+1:_ Weapon modifications on your multi-tool also affect the _melee weapon_ you are holding.\n\n_+2:_ Armor modifications can be installed on it as well, affecting the armor you wear.
actors.hero.talent.part_recycling.title=Part Recycling
actors.hero.talent.part_recycling.desc=_+1:_ When a modification on your gear breaks naturally, the craftsman has a 50% chance to gain 1 _metal part_.\n\n_+2:_ A 75% chance.
actors.hero.talent.favorite_work.title=Favorite Work
actors.hero.talent.favorite_work.desc=_+1:_ While using modified gear the craftsman gains _8.3%_ accuracy, evasion or a charge discount.\n\n_+2:_ _16.7%_.
actors.hero.talent.kinetic_fragment.title=Kinetic Fragment
actors.hero.talent.kinetic_fragment.desc=_+1:_ When a weapon modification breaks, the craftsman gains 2 _physical damage boosts_ of (level/2).\n\n_+2:_ Armor modifications trigger this too.
actors.hero.talent.backfire.title=Backfire
actors.hero.talent.backfire.desc=_+1:_ Each enemy affected by a pulse reduces its cooldown by _3 turns_.\n\n_+2:_ _5 turns_.
actors.hero.talent.diffraction.title=Diffraction
actors.hero.talent.diffraction.desc=_+1:_ Pulses pass through _soft solids_, such as doors and webs.\n\n_+2:_ They pass through _creatures_ as well.
actors.hero.talent.electric_charge.title=Electric Charge
actors.hero.talent.electric_charge.desc=_+1:_ A 3x3 _electric field_ lingers for 2 turns where the pulse lands.\n\n_+2:_ 3 turns.
actors.hero.talent.dark_magic.title=Dark Magic
actors.hero.talent.dark_magic.desc=_+1:_ Pulses have a _6.7%_ chance to _corrupt_ undead or demonic enemies.\n\n_+2:_ _13.3%_.
actors.hero.talent.charisma.title=Charisma
actors.hero.talent.charisma.desc=_+1:_ Enemies are _1.6 times_ as likely to be corrupted.\n\n_+2:_ Corrupted creatures have a 20% chance to raise the enemies they kill.
actors.hero.talent.explosion_proof.title=Explosion Proof
actors.hero.talent.explosion_proof.desc=_+1:_ The grenadier and her allies take _half_ damage from her bombs.\n\n_+2:_ Her bombs no longer destroy items.
actors.hero.talent.shockwave.title=Shockwave
actors.hero.talent.shockwave.desc=_+1:_ Enemies hit by the grenadier's bombs are knocked back _2 tiles_, and enemies within 3x3 are knocked back _1 tile_.\n\n_+2:_ Stronger knockback.
actors.hero.talent.added_powder.title=Added Powder
actors.hero.talent.added_powder.desc=_+1:_ The grenadier may choose a bomb when crafting a modification, spending 1 metal part to give it _+1 upgrade_.\n\n_+2:_ Bombs may be upgraded up to +2.
actors.hero.talent.magical_explosion.title=Magical Explosion
actors.hero.talent.magical_explosion.desc=_+1:_ Bombs have a _30%_ chance per target to trigger the enchantment on your multi-tool.\n\n_+2:_ _60%_.
actors.hero.talent.ballistica_calc.title=Ballistica Calculation
actors.hero.talent.ballistica_calc.desc=_+1:_ Throwing a weapon immediately after a bomb _costs no time_.\n\n_+2:_ That throw deals _+15% damage_.
actors.hero.talent.mechanical_refinement.title=Mechanical Refinement
actors.hero.talent.mechanical_refinement.desc=_+1:_ The force field absorbs _5_ more damage at both ends of its range.\n\n_+2:_ _10_ more.
actors.hero.talent.momentum_transform.title=Momentum Transform
actors.hero.talent.momentum_transform.desc=_+1:_ _20%_ of the damage absorbed by the field becomes physical empowerment.\n\n_+2:_ _40%_.
actors.hero.talent.active_defense.title=Active Defense
actors.hero.talent.active_defense.desc=_+1:_ When the field collapses, enemies within 2 tiles are knocked back _2 tiles_.\n\n_+2:_ _3 tiles_.
actors.hero.talent.repair_ability.title=Repair Ability
actors.hero.talent.repair_ability.desc=_+1:_ When the field collapses, you recover _3 HP_ and bleeding is cured.\n\n_+2:_ _6 HP_.
actors.hero.talent.powered_device.title=Powered Device
actors.hero.talent.powered_device.desc=_+1:_ The beacon is more likely to summon _golems_ and less likely to summon DM-100s.\n\n_+2:_ The bias is stronger.
actors.hero.talent.skynet.title=Skynet
actors.hero.talent.skynet.desc=_+1:_ The beacon has a _75%_ chance to summon an extra machine, which can chain.\n\n_+2:_ _150%_, guaranteeing one extra machine and a 50% chance of another.
actors.hero.talent.violent_leap.title=Violent Leap
actors.hero.talent.violent_leap.desc=_+1:_ Activating the beacon deals _10~15_ damage to adjacent enemies and knocks them back 1 tile.\n\n_+2:_ _15~25_ damage.
actors.hero.talent.assault.title=Assault
actors.hero.talent.assault.desc=_+1:_ Summoned machines gain _2.67_ turns of adrenaline.\n\n_+2:_ _3.67_ turns.
actors.hero.talent.stacked_charge.title=Stacked Charge
actors.hero.talent.stacked_charge.desc=_+1:_ The detonator explodes one extra time, for _3_ rounds in total, widening each round.\n\n_+2:_ _4_ rounds.
actors.hero.talent.alchemy_craft.title=Alchemy Craft
actors.hero.talent.alchemy_craft.desc=_+1:_ Each cell blasted by the detonator has an _8.3%_ chance to detonate a random special bomb instead.\n\n_+2:_ _16.7%_.
actors.hero.talent.decoy.title=Decoy
actors.hero.talent.decoy.desc=_+1:_ When attacked, the detonator lures enemies closer and delays detonation by _8 turns_.\n\n_+2:_ _12 turns_.
actors.hero.talent.portable_detonator.title=Portable Detonator
actors.hero.talent.portable_detonator.desc=_+1:_ The detonator can be placed within 2 tiles, and disarming it refunds _62.5%_ of the armor charge.\n\n_+2:_ 3 tiles, and _75%_ refunded.
actors.hero.dicemage.dicemagespell.target_not_visible=You can only cast this spell on a cell you can see.
actors.hero.tacticalthrowtalen4battlemage$rockarmor.desc=This armor cannot summon an earth guardian. It stacks with the wand's Rock Armor: while both layers can absorb their full share, each halves the damage it receives. Armor remaining: %1$d.

actors.blobs.waterofawareness.holy_spring_title=Holy Spring
actors.blobs.waterofawareness.holy_spring_desc=You can transform this well of awareness into scrolls!
actors.blobs.waterofawareness.holy_spring_normal=Drink normally
actors.blobs.waterofawareness.holy_spring_transform=Transform into scrolls
actors.blobs.waterofawareness.holy_spring_transformed=The power of the well turns into scrolls!
actors.blobs.waterofhealth.holy_spring_title=Holy Spring
actors.blobs.waterofhealth.holy_spring_desc=You can transform this well of health into scrolls!
actors.blobs.waterofhealth.holy_spring_normal=Drink normally
actors.blobs.waterofhealth.holy_spring_transform=Transform into scrolls
actors.blobs.waterofhealth.holy_spring_transformed=The power of the well turns into scrolls!
actors.buffs.berserk.roar1=_Vengeful Roar_ consumes _75%_ of your rage and _cripples_ all enemies in view for 5 turns. Using it takes 1 turn.
actors.buffs.berserk.roar2=_Vengeful Roar_ consumes _65%_ of your rage and _cripples and blinds_ all enemies in view for 5 turns. Using it takes no time.
actors.buffs.berserk.roar3=_Vengeful Roar_ consumes _50%_ of your rage and _cripples and blinds_ all enemies in view for 5 turns. Using it takes no time.
actors.buffs.berserk.roar4=_Vengeful Roar_ consumes _50%_ of your rage, _cripples and blinds_ all enemies in view for 5 turns, and deals damage equal to one attack. Using it takes no time.
actors.buffs.berserk.toberserk=_Berserk_ Consumes _100%_ rage. Damage dealt is increased by 50%. Bonus shielding is also granted, but no other rage moves can be used while berserking. After berserking ends, the Berserker must rest before he can build rage again.
actors.buffs.combo$combomove.parry.finish_desc=Blocks all attacks received within the next turn and retaliates against them. The retaliation deals _%d%%_ (combo*20%%) damage and always hits.
actors.buffs.combo$combomove.cleave.name=cleave
actors.buffs.combo$combomove.cleave.desc=Makes an attack against the target that always hits. If it kills the target, gain 2 additional combo.
actors.buffs.combo$combomove.cleave.finish_desc=Deals _%d%%_ (combo*25%%) damage to the target. If it kills the target, half of your combo is immediately refunded.
actors.buffs.combo$combomove.crush.finish_desc=The target and all enemies in the 7x7 area around it take _%d%%_ (combo*15%%) damage. This attack ignores armor and always hits.
actors.buffs.combo$combomove.fury.finish_desc=Rapidly attacks the target _%d_ (combo) times with reduced accuracy. Each attack deals 75%% damage and can trigger enchantments.
actors.buffs.combo$combomove.spurt.name=dash
actors.buffs.combo$combomove.spurt.desc=Dashes to a location 4 tiles away. Cannot pass through enemies or obstacles, but can leap over chasms.
actors.buffs.combo$combomove.spurt.finish_desc=Dashes to a location _%1$d_ (combo/2) tiles away and grants _%2$d_ (combo/2) turns of adrenaline.
actors.buffs.combo$combomove.finish.name=finish
actors.buffs.combo$combomove.finish.desc=Converts all of your moves into finishing moves. Finishing moves are empowered by your combo count, and reset combo when used.
actors.buffs.combo$combomove.calm.name=calm
actors.buffs.combo$combomove.calm.finish_desc=Removes most negative effects and grants slow healing equal to _%1$d%%_ (combo*2%%) of your currently missing health.
actors.buffs.cancelattackbuff.name=Cancel Attack
actors.buffs.cancelattackbuff.desc=You can make one attack that takes no time!\n\nThis effect is consumed when you attack.
actors.buffs.cancelattackcooldown.name=Cancel Attack Cooldown
actors.buffs.cancelattackcooldown.desc=You must wait a while before you can use Cancel Attack again.\n\nCooldown remaining: %s turns.
actors.buffs.wheelchairrush.name=Wheelchair Rush
actors.buffs.wheelchairrush.desc=The mysterious wheelchair carries you forward at astonishing speed!\n\nWhile you have Wheelchair Rush you move at 2x speed, but your other actions are still performed at their usual speed.\n\nTurns of Wheelchair Rush remaining: %s.
actors.buffs.catapultstartbuff.name=Catapult Start
actors.buffs.healing$starhealing.name=Nova Healing
actors.buffs.killboatswordwaitbuff.name=Ship-Cleaving Blade Guard
actors.buffs.killboatswordwaitbuff.desc=The heavy ship-cleaving blade takes a long time to use, but its enormous blade also helps you block a certain amount of damage. The amount blocked increases with the level of the ship-cleaving blade.\n\nCurrent damage blocked: %s~%s.
actors.hero.abilities.rector.lastprayer.name=last prayer
actors.hero.abilities.rector.lastprayer.short_desc=The Rector can use the _Last Prayer_, working a miracle to escape from danger.
actors.hero.abilities.rector.lastprayer.desc=The Rector reduces their own health to 1 and makes a leap to escape from danger, gaining 2 turns of invulnerability.\n\nAfterwards, the Rector gradually recovers health (1 HP every 1 turn) until their health, as a share of max health, reaches 30%.
actors.hero.abilities.rector.lastprayer.prompt=Choose a location to leap to
actors.hero.abilities.rector.shadowhymn.name=shadow hymn
actors.hero.abilities.rector.shadowhymn.short_desc=The Rector chants a _Shadow Hymn_. While the hymn lasts, the health they recover is converted into damage against enemies in view.
actors.hero.abilities.rector.shadowhymn.desc=The Rector has learned a forbidden incantation from another sect. For 30 turns, each point of health you recover deals the same amount of damage to all enemies in view, but this effect ends immediately when you use a Prayer effect.
actors.hero.abilities.rector.godspossesion.name=divine possession
actors.hero.abilities.rector.godspossesion.short_desc=The Rector invokes _Divine Possession_, briefly facing enemies as a holy avatar and gaining a variety of beneficial effects for the duration.
actors.hero.abilities.rector.godspossesion.desc=The Rector guides a god to descend into their own body, if only for a brief moment.\n\nGrants 30 turns of bless, and the effects of all champion types for 30 turns. After the ability ends, the Rector is weakened for 10 turns.
actors.hero.heroclass.moonlight=moonlight
actors.hero.heroclass.moonlight_desc_short=The Moonlight is a master gamer with a wealth of experience and skill, and a self-modified _wheelchair_ that lets them move freely around the battlefield. However, the Moonlight is physically somewhat frail.
actors.hero.heroclass.moonlight_desc=The Moonlight is a master gamer with a wealth of experience and skill. The Moonlight starts with the starting weapons of every hero, and switching weapons takes no time. This effect has a _20_ turn cooldown.\n\nThe Moonlight also carries a _wheelchair_ that they modified themselves. Using the _wheelchair_ performs a short-range jump and grants a burst of speed for a while.\n\nThe Moonlight also starts with cloth armor, a waterskin, and a magical holster.\n\nThe Moonlight automatically identifies:\n_-_ Potions of Strength\n_-_ Scrolls of Upgrade\n_-_ Scrolls of Identify\n_-_ As well as four _random scrolls and potions_.
actors.hero.heroclass.moonlight_unlock=To unlock the Moonlight _beat a run of Slice & Dice on Unfair difficulty._
actors.hero.heroclass.rector=rector
actors.hero.heroclass.rector_desc_short=The Rector starts with a _metal cross_, a _winged ring_, a ration of food, a waterskin, and a scroll holder.
actors.hero.heroclass.rector_desc=The Rector builds up _faith_ by gaining experience in the dungeon, forming a connection with their god. Faith skills can deal damage, grant _temporary HP_, grant _speed_, and _remove curses_, and the Rector can also pray to the god for a possible boon.\n\nThe Rector also starts with a _metal cross_, a _winged ring_, a ration of food, a waterskin, and a scroll holder.\n\nAgainst _undead_ and _demonic_ enemies, the Rector's accuracy modifier is 120%. After the Rector uses a _wand_ or _any spell crystal_, their connection with the god is disrupted, and faith skills cannot be used for a while.\n\nThe Rector automatically identifies:\n_-_ Scrolls of Identify\n_-_ Potions of Experience\n_-_ Scrolls of Remove Curse
actors.hero.heroclass.rector_unlock=The Rector is still in testing, but development is complete, so give it a try!\n\nIf you find a bug, you can join the main Radish group from the title screen to report it to the developers.
actors.hero.herosubclass.battlepreist=battle priest
actors.hero.herosubclass.battlepreist_short_desc=The _Battle Priest_'s Smite is more powerful and strikes an additional target. The effects of Light Infusion and Prayer are enhanced.
actors.hero.herosubclass.battlepreist_desc=The _Battle Priest_'s Smite has its damage increased by 50%. It also strikes an additional random target in view. Light Infusion is changed to grant region number*12 temporary HP and region number*4 turns of adrenaline.\n\nThe Prayer skill is replaced with a benediction skill that grants bonus damage, damage reduction, and blessing.
actors.hero.herosubclass.redcardinal=red cardinal
actors.hero.herosubclass.redcardinal_short_desc=The _Red Cardinal_ gains more faith from experience, uses faith skills without spending a turn, and learns two new skills.
actors.hero.herosubclass.redcardinal_desc=The _Red Cardinal_ has a deeper understanding of faith. For every 10 experience gained, the Red Cardinal gains 1 additional faith. Using faith skills takes no time, and two new skills are learned.\n\n_-_ Holy Fire: ignites the target with holy fire, which is different from ordinary fire, and greatly increases the damage the target takes.\n_-_ Holy Land: slows the movement of enemies that step onto holy land. It is more effective against undead and demons, and also damages them.
actors.hero.herosubclass.dead_knight=executor
actors.hero.herosubclass.dead_knight_short_desc=The _Executor_ gains faith in a different way, and faith skills are replaced with more aggressive ones.
actors.hero.herosubclass.dead_knight_desc=The _Executor_ is the dark side of the church, tasked with clearing the way for the spread of the faith. Faith is instead gained by killing enemies with physical or bleeding damage.\n\n_Faith skills are changed to inflict bleeding on enemies or to kill large numbers of enemies outright_.\n\nThe Executor can switch between _Normal and Execution modes_ without spending a turn. _Kills made by the Executor in Execution Mode_ grant no experience; instead, _all enemies in view take damage equal to the experience that would have been gained_.
actors.hero.herosubclass.jutte_champion=jutte champion
actors.hero.herosubclass.jutte_champion_short_desc=The _Jutte Champion_ can convert any weapon into a high-performance jutte of the same tier. However, this powerful weapon is not very durable.
actors.hero.herosubclass.jutte_champion_desc=The _Jutte Champion_ can convert any weapon into a high-performance jutte of the same tier. The jutte attacks fairly quickly, has some blocking, and can be thrown, but both attacking and throwing consume its durability. The jutte's strength requirement is fixed at _10_, its damage by tier is _5/6/8/9/10~20/24/32/36/40_, its attack delay is _0.75_, its blocking is _2/2/3/3/4~4/5/6/7/8_, its accuracy is 1.25x, and it has 50 durability. Both melee and thrown hits consume durability. _It cannot be upgraded_.
actors.hero.herosubclass.little_knight=little knight
actors.hero.herosubclass.little_knight_short_desc=When switching weapons, the _Little Knight_ can perform a Cancel Attack that takes no time, and can also kick nearby monsters away when there are many of them around.
actors.hero.herosubclass.super_desc=Below is a preview of the demonic power talents for _%s_.
actors.buffs.rector.wndbless.not_enough_credibility=You do not have enough faith to use this skill.
actors.buffs.rector.belief.action_name=Power of Faith
actors.buffs.rector.wndbless.select_skills=Choose a skill to cast
actors.buffs.rector.wndbless$rewardwindow.ac_ask=Cast
actors.buffs.rector.wndbless.not_talent=The skill granted by Divine Authority is still on cooldown...
actors.hero.talent$dueldancemissiletracker.name=Duel Dance (Faster Throws)
actors.hero.talent$dueldancemissiletracker.desc=Keep up the rhythm of battle!\n\nYou use thrown weapons faster.
actors.hero.talent$dueldancewandtracker.name=Duel Dance (Faster Casting)
actors.hero.talent$dueldancewandtracker.desc=Keep up the rhythm of battle!\n\nYou use wands faster.
actors.hero.talent$holdbreathtracker.name=Hold Breath
actors.hero.talent$holdbreathtracker.desc=Fully focused, preparing for the next shot.\n\nCurrent crit chance bonus: _%1$s%%_\nCurrent crit damage multiplier bonus: _%2$s_
actors.hero.talent$hideincrowdcooldown.name=Hide in Crowd Cooldown
actors.hero.talent$hideincrowdcooldown.desc=You have recently used this talent, and must wait before using it again.\n\nCooldown remaining: %s turns.
actors.hero.talent.armsmasters_intuition.title=armsmaster's intuition
actors.hero.talent.armsmasters_intuition.desc=_+1:_ The Warrior identifies weapons and armor _twice as fast_.\n\n_+2:_ The Warrior instantly identifies weapons and armor _that he equips_.
actors.hero.talent.emergency_protection.title=emergency protection
actors.hero.talent.emergency_protection.desc=_+1:_ Whenever the Warrior takes physical damage that directly reduces his health, he gains _2_ shielding that only lasts through the next turn.\n\n_+2:_ Whenever the Warrior takes physical damage that directly reduces his health, he gains _4_ shielding that only lasts through the next turn.
actors.hero.talent.keep_vigilance.title=stay vigilant
actors.hero.talent.keep_vigilance.desc=_+1:_ The time before the Gladiator's combo is lost is extended to _6 turns_.\n\n_+2:_ The time before the Gladiator's combo is lost is extended to _15 turns_.\n\n_+3:_ The Gladiator's _combo is no longer lost over time_.
actors.hero.talent.vent_noplace.title=enhanced combo
actors.hero.talent.vent_noplace.desc=_+1:_ When the Gladiator uses a finishing move, he immediately gains _+1 combo_.\n\n_+2:_ The Gladiator can use combo moves as soon as his _combo reaches 5_.\n\n_+3:_ When the Gladiator uses a finishing move, he immediately gains _2 combo_.
actors.hero.talent.iron_muscle.title=iron muscle
actors.hero.talent.iron_muscle.desc=_+1:_ The Warrior's resistance to _bleeding_ is 50%.\n\n_+2:_ The Warrior's resistance to _bleeding_ and _cripple_ is 50%.\n\n_+3:_ The Warrior's resistance to _bleeding_, _cripple_, and _blindness_ is 50%.\n\n_+4:_ In addition to the benefits of +3, while below _50%_ health the Warrior takes _25%_ less damage.
actors.hero.talent.moving_defense.title=mobile fortress
actors.hero.talent.moving_defense.desc=_+1:_ Each time the Warrior moves, he has a _34%_ chance to gain 1 shielding.\n\n_+2:_ Each time the Warrior moves, he has a _67%_ chance to gain 1 shielding.\n\n_+3:_ Each time the Warrior moves, he gains 1 shielding.\n\n_+4:_ In addition to the benefits of +3, the Warrior's armor is increased by _2~8_ while he has shielding.\n\nShielding gained from this talent cannot exceed the Warrior's level.
actors.hero.definition.subclasses.artificer$readymod.name=ready modification
actors.hero.definition.subclasses.artificer$readymod.desc=The Artificer has fitted a piece of gear onto this ally. It gains that gear's attack or defense, along with bonus max health and evasion.
actors.hero.talent.fanaticism_magic.title=fanatical casting
actors.hero.talent.fanaticism_magic.desc=_+1:_ Any _magic damage_ dealt by the Berserker builds rage at a _rate of 50%_.\n\n_+2:_ In addition to the bonus of the +1 talent, all of the Berserker's wands are treated as having _1 extra virtual level_ each time his current rage reaches another 75%.\n\n_+3:_ In addition to the bonus of the +1 talent, all of the Berserker's wands are treated as having _1 extra virtual level_ each time _his rage reaches another 50%_.
actors.hero.talent.pain_scar.title=pain scar
actors.hero.talent.pain_scar.desc=_+1:_ When the Berserker takes lethal damage while his rage is above _20%_, he negates that damage by losing _20%_ rage and _20_ max health.\n\n_+2:_ When the Berserker takes lethal damage while his rage is above _15%_, he negates that damage by losing _15%_ rage and _15_ max health.\n\n_+3:_ When the Berserker takes lethal damage while his rage is above _10%_, he negates that damage by losing _10%_ rage and _10_ max health.
actors.hero.talent.resistdeath=The lethal damage was blocked!
actors.hero.talent.revenge_roar.title=vengeful roar
actors.hero.talent.revenge_roar.desc=The Berserker learns the skill _Vengeful Roar_, which takes 1 turn to use and inflicts debuffs on all enemies in view.\n\n_+1:_ Inflicts 5 turns of _cripple_ and costs _75%_ rage.\n\n_+2:_ Inflicts 5 turns of _cripple and blindness_, costs _65%_ rage, and no longer takes any time.\n\n_+3:_ Inflicts 5 turns of _cripple and blindness_, costs _50%_ rage, and no longer takes any time.\n\n_+4:_ Inflicts 5 turns of _cripple and blindness_ plus the damage of one weapon attack, costs _50%_ rage, and no longer takes any time.
actors.hero.talent.thirsty_blade.title=thirsty blade
actors.hero.talent.thirsty_blade.desc=_+1:_ When the Berserker attacks, he heals for _2%_ of the damage dealt.\n\n_+2:_ When the Berserker attacks, he heals for _4%_ of the damage dealt.\n\n_+3:_ When the Berserker attacks, he heals for _6%_ of the damage dealt.\n\n_+4:_ When the Berserker attacks, he heals for _8%_ of the damage dealt.\n\nThis talent has a 20 turn cooldown.
actors.hero.talent.defensive_strike.title=defensive strike
actors.hero.talent.defensive_strike.desc=_+1:_ When hit by a physical attack, there is a _25%_ chance to gain one combo.\n\n_+2:_ When hit by a physical attack, there is a _50%_ chance to gain one combo.\n\n_+3:_ When hit by a physical attack, there is a _75%_ chance to gain one combo.\n\n_+4:_ When hit by a physical attack, there is a _100%_ chance to gain one combo.
actors.hero.talent.devastate.title=devastate
actors.hero.talent.devastate.desc=_+1:_ For each 1 combo the Gladiator has, his weapon damage is increased by _0~1_.\n\n_+2:_ For each 1 combo the Gladiator has, his weapon damage is increased by _0~2_.\n\n_+3:_ For each 1 combo the Gladiator has, his weapon damage is increased by _0~3_.\n\n_+4:_ For each 1 combo the Gladiator has, his weapon damage is increased by _0~4_.\n\nThis talent counts at most _10_ combo.
actors.hero.talent.energizing_upgrade.title=energizing upgrade
actors.hero.talent.energizing_upgrade.desc=_+1:_ Reading a scroll instantly restores _0.67_ charges to all of the Mage's wands. This effect is doubled when reading an exotic scroll.\n\n_+2:_ Reading a scroll instantly restores _1_ charge to all of the Mage's wands. This effect is doubled when reading an exotic scroll.
actors.hero.talent.spell_queue.title=spell queue
actors.hero.talent.spell_queue.desc=_+1:_ Gain a two-slot spell queue. You can spend one turn to cast all of the spells in its slots at once. Spells in the spell queue cost 2 charges, but 0.5 charges are refunded after casting.\n\n_+2:_ The spell queue has three slots.\n\n_+3:_ After casting with the spell queue, an additional _0.25_ charges are refunded.\n\nReloading a completed spell queue consumes an _unstable spell_.
actors.hero.talent.ghost_root.title=haunting wraiths
actors.hero.talent.ghost_root.desc=_+1:_ Allied wraiths are guaranteed to dodge the first 3 instances of damage they would take.\n\n_+2:_ When an allied wraith is created or appears through corruption, it gains invisibility and haste until it attacks its first enemy.\n\n_+3:_ When an allied wraith spawns, the chance that it is a special variant able to cast ranged spells (the spells deal the same damage as its physical attacks) is 25%.\n\n_+4:_ The bonuses of the talent above also apply to mirror images.\n\n_This talent is temporarily disabled due to a design flaw. It will be replaced once a new talent is available to take its place_
actors.hero.talent.war_throw.title=tactical throw
actors.hero.talent.war_throw.desc=_+1:_ The Battlemage's thrown weapons benefit from the melee effects of his staff and the effects of its imbued wand at an _efficiency of 50%_.\n\n_+2:_ The Battlemage's thrown weapons benefit from the melee effects of his staff and the effects of its imbued wand at an _efficiency of 100%_.\n\n_+3:_ The Battlemage's thrown weapons benefit from the melee effects of his staff and the effects of its imbued wand at an _efficiency of 150%_.
actors.hero.tacticalthrowtalen4battlemage$rockarmor.name=Rock Armor (Tactical)
actors.hero.talent.magic_refining.title=arcane refinement
actors.hero.talent.magic_refining.desc=+1: When the Mage uses a scroll, he has a _50%_ chance to recover its corresponding _runestone_.\n\n+2: When the Mage uses an exotic scroll, he has a _25%_ chance to recover its corresponding _scroll_.\n\n+3: When the Mage uses an _unstable spell_, he is offered _3 scrolls_ and can choose _1_ of them to use, but this cannot trigger the effect of a _scroll of upgrade_.\n\n+4: The Mage gains an additional _alchemy recipe_:\nArcane resin: crafted from _3 unstable spells_ and _6 energy_.
actors.hero.talent.magic_tactics.title=tactical casting
actors.hero.talent.magic_tactics.desc=+1: When the Mage zaps a wand other than his staff, there is a _7%_ chance that it takes no time.\n\n+2: When the Mage zaps a wand other than his staff, there is a _15%_ chance that it takes no time.\n\n+3: When the Mage zaps a wand other than his staff, there is a _22%_ chance that it takes no time.\n\n+4: When the Mage zaps a wand other than his staff, there is a _30%_ chance that it takes no time.
actors.hero.talent.magic_stick.title=stick fighting
actors.hero.talent.magic_stick.desc=+1: When the staff surprise attacks an enemy in melee, _its battlemage effect always triggers_.\n\n+2: After a melee attack with the staff, the chance to gain one _evasion_ is 15%.\n\n+3: Melee attacks with the staff have a _chance of 30%_ to inflict one of _8 turns of vulnerable/hexed/vertigo/weakened_ on the enemy.\n\n+4: For 2 turns after zapping a wand other than the staff, the next melee attack or zap with the staff takes no time.
actors.hero.talent.magic_workman.title=staff artisan
actors.hero.talent.magic_workman.desc=+1: You can spend _arcane resin_ to enchant your staff.\n\n+2: You can spend _arcane resin_ to enchant your staff, and can choose one of three options.\n\n+3: Even when cursed, the staff will not unleash _cursed wand effects_.\n\n+4: The maximum charges of the staff are increased by 2.
actors.hero.talent.duel_dance.title=duel dance
actors.hero.talent.duel_dance.desc=_+1:_ When alternating between thrown weapons and wands, the time taken to use them is reduced by _33%_.\n\n_+2:_ When alternating between thrown weapons and wands, the time taken to use them is reduced by _50%_.
actors.hero.talent.rogues_instinct.title=rogue's instinct
actors.hero.talent.rogues_instinct.desc=_+1:_ When the Rogue buys from a shop, there is a _25%_ chance that it costs no gold.\n\n_+2:_ When the Rogue buys from a shop, there is a _40%_ chance that it costs no gold.
actors.hero.talent.deathblow.title=deathblow
actors.hero.talent.deathblow.desc=_+1:_ Surprise attacks have _15%_ bonus crit chance.\n\n_+2:_ In addition to the benefits of +1, surprise attacks have _+25%_ crit damage (can exceed the limit).\n\n_+3:_ In addition to the benefits of +1 and +2, surprise attack damage is increased by _15%_.
actors.hero.talent.hide_in_crowd.title=hide in crowd
actors.hero.talent.hide_in_crowd.desc=_+1:_ When there are more than _5_ monsters in the Rogue's field of view, he gains 8 turns of invisibility.\n\n_+2:_ When there are more than _4_ monsters in the Rogue's field of view, he gains 8 turns of invisibility.\n\n_+3:_ When there are more than _3_ monsters in the Rogue's field of view, he gains 8 turns of invisibility.\n\n_+4:_ When there are more than _2_ monsters in the Rogue's field of view, he gains 8 turns of invisibility.\n\nThis talent has a 50 turn cooldown.
actors.hero.talent.dark_armor.title=dark veil armor
actors.hero.talent.dark_armor.desc=_+1:_ For every 1 empty charge on the Rogue's cloak of shadows, his armor's defense is increased by _0~1_.\n\n_+2:_ For every 1 empty charge on the Rogue's cloak of shadows, his armor's defense is increased by _0.5~1_.\n\n_+3:_ For every 1 empty charge on the Rogue's cloak of shadows, his armor's defense is increased by _0.5~1.5_.\n\n_+4:_ For every 1 empty charge on the Rogue's cloak of shadows, his armor's defense is increased by _1~2_.\n\n_This talent has no effect while the cloak of shadows is not equipped._
actors.hero.talent.brace_yourself.title=brace yourself
actors.hero.talent.brace_yourself.desc=_+1:_ If the Assassin stays still while invisible, the bonus damage of his next attack is increased to 25/50/80/110%.\n\n_+2:_ If the Assassin stays still while invisible, the bonus damage of his next attack is increased to 30/60/95/130%.\n\n_+3:_ If the Assassin stays still while invisible, the bonus damage of his next attack is increased to 35/70/110/150%.\n\n_+4:_ If the Assassin stays still while invisible, the bonus damage of his next attack is increased to 40/80/125/170%.\n\nNote: originally 10/20/35/50%.
actors.buffs.magicstick.name=Stick Fighting
actors.buffs.magicstick.desc=For %s turns, zapping or attacking in melee with your staff takes no time.
actors.buffs.calm.name=Calm
actors.buffs.calm.desc=For every 1% of your max HP that you have lost, your crit damage is increased by 2%. (Can exceed the limit)
actors.buffs.criticalattack.name=Critical Hit
actors.buffs.criticalattack.desc=If your crit damage is at least 300%, your attacks are guaranteed to crit.
actors.buffs.braceyourself.name=Hidden Edge
actors.buffs.braceyourself.desc=The Assassin is standing ready and waiting for his moment. The bonus damage of his next assassination will be increased.
actors.hero.talent.power_recycle.title=energy recycling
actors.hero.talent.power_recycle.desc=_+1:_ After the Assassin kills an enemy with a prepared strike, he gains _4 turns of recharging_.\n\n_+2:_ In addition to the benefits of +1, after the Assassin kills an enemy with a prepared strike, he gains _2 turns of artifact recharging_.\n\n_+3:_ In addition to the benefits of +1 and +2, enemies killed by the Assassin's prepared strike restore _25_ satiety to him.\n\n_+4:_ The benefits of +1, +2, and +3 have a _50%_ chance to also apply to kills not made with a prepared strike.
actors.hero.talent.kinetic_energy.title=kinetic conversion
actors.hero.talent.kinetic_energy.desc=_+1:_ The rate at which the Freerunner's artifacts and wands naturally recharge over time is multiplied by _tiles moved this turn x 0.25_ (never lower than the original value).\n\n_+2:_ The rate at which the Freerunner's artifacts and wands naturally recharge over time is multiplied by _tiles moved this turn x 0.5_ (never lower than the original value).\n\n_+3:_ The rate at which the Freerunner's artifacts and wands naturally recharge over time is multiplied by _tiles moved this turn x 0.75_ (never lower than the original value).\n\n_+4:_ The rate at which the Freerunner's artifacts and wands naturally recharge over time is multiplied by _tiles moved this turn_ (never lower than the original value).
actors.hero.talent.storm_rush.title=storm rush
actors.hero.talent.storm_rush.desc=_+1:_ After killing an enemy, the Freerunner gains _3 turns of haste_.\n\n_+2:_ In addition to the benefits of +1, the remaining turns of freerunning do not decrease while the Freerunner has haste, adrenaline, or stamina.\n\n_+3:_ In addition to the benefits of +1 and +2, the Freerunner is immune to _crippled, chilled, and slowed_.\n\n_+4:_ In addition to the benefits of +1, +2, and +3, when the Freerunner moves, if his movement speed exceeds 4, he gains _1 turn of levitation_.
actors.hero.talent.underestimated.title=odds and ends
actors.hero.talent.underestimated.desc=_+1:_ When trampling tall grass, there is a chance to gain a clump of magic roots, up to a maximum of _6_.\n\n_+2:_ When trampling tall grass, there is a chance to gain a clump of magic roots, up to a maximum of _10_.
actors.hero.talent.herb_mixture.title=herb mixing
actors.hero.talent.herb_mixture.desc=Activating this talent grants an _herb-making kit_. While this talent is held, seeds can be made into medicinal herbs.\n\n_+1:_ Requires _4_ seeds of any kind to make.\n\n_+2:_ Requires _3_ seeds of any kind to make.\n\nA medicinal herb instantly restores _15 HP_ and provides slow healing for a while.
actors.hero.talent.hold_breath.title=hold breath
actors.hero.talent.hold_breath.desc=_+1:_ Each turn, the Huntress's thrown weapons and spirit bow gain _2%_ crit chance and _1%_ crit damage. The count resets when she hits an enemy with them.\n\n_+2:_ Each turn, the Huntress's thrown weapons and spirit bow gain _3%_ crit chance and _1.5%_ crit damage. The count resets when she hits an enemy with them.\n\n_+3:_ Each turn, the Huntress's thrown weapons and spirit bow gain _4%_ crit chance and _2%_ crit damage. The count resets when she hits an enemy with them.
actors.hero.talent.bow_dules.title=archery duel
actors.hero.talent.bow_dules.desc=_+1:_ While a sniper's mark is active, overall attack speed is increased by 50%.\n\n_+2:_ Outside of the special attack, successfully surprise attacking an enemy with the spirit bow also applies a sniper's mark.\n\n_+3:_ Outside of the special attack, hitting an enemy that has a ranged attack with the spirit bow applies a sniper's mark even without a surprise attack.\n\n_+4:_ The damage of the special attack is _increased by 35%_.
actors.hero.talent.storm_attack.title=tempest
actors.hero.talent.storm_attack.desc=_+1:_ When the Sniper shoots, she also fires 1 extra arrow at the target with its damage fixed at 1.\n\n_+2:_ When the Sniper shoots, she also fires 1 extra arrow at the target with its damage fixed at 25%.\n\n_+3:_ When the Sniper shoots, she also fires 2 extra arrows at the target with a damage of 1.\n\n_+4:_ When the Sniper shoots, she also fires 2 extra arrows at the target with a damage of 25%.
actors.hero.talent.medart_specialist.title=tipped dart specialist
actors.hero.talent.medart_specialist.desc=_+1:_ The Warden can now use _1_ potion to tip _4_ darts.\n\n_+2:_ Tipped darts always hit when thrown, regardless of any conditions.\n\n_+3:_ When a tipped dart hits, it has a _33% chance_ to not lose durability.\n\n_+4:_ The damage of tipped darts is increased to _2x_.
actors.hero.talent.land_heart.title=heart of the land
actors.hero.talent.land_heart.desc=_+1:_ The Warden gains _50%_ bonus movement speed in tall grass.\n\n_+2:_ When trampling tall grass, there is a _10%_ chance to add _1_ dewdrop directly to your waterskin.\n\n_+3:_ When there is tall grass or furrowed grass in the _9 tiles_ around herself or the target, surprise attacks ignore the enemy's armor.\n\n_+4:_ Shooting an enemy standing on grass or embers with the spirit bow or a tipped dart has a _15%_ chance to trigger a harmful plant effect.
actors.hero.talent$highgrss_speed.name=Earth Stride
actors.hero.talent$highgrss_speed.desc=The Warden gains _50%%_ bonus movement speed in tall grass.
actors.hero.talent.vine_trap.title=vine trap
actors.hero.talent.vine_trap.desc=Tall grass trampled by the Warden is rigged with a vine trap. Enemies that step on a vine trap are debuffed.\n\n_+1:_ 5 turns of _weakness_.\n\n_+2:_ 5 turns of _weakness and hex_.\n\n_+3:_ 5 turns of _weakness, hex, and vulnerability_.
actors.mobs.radishboss.bigsnake_zikk.name=Zikk the Great Snake
actors.mobs.radishboss.bigsnake_zikk.desc=This snake is longer and thicker than any snake you have seen before. As it sits near the top of the sewer food chain, it has no need for its markings to blend in with nature.\nIt is said that this snake is highly venomous, as well as sinister and cunning, making it very hard to deal with.
actors.mobs.radishboss.bigsnake_zikk.notice=Hiss~
actors.mobs.radishboss.bigsnake_zikk.poison=Hiss!~ Hiss~~
actors.mobs.radishboss.bigsnake_zikk.defeated=...
actors.mobs.radishboss.gnollking.name=Gnoll King
actors.mobs.radishboss.gnollking.desc=The Gnoll King is the supreme being of the gnoll tribe. Thanks to the mysterious magic held within the glaive it wields, it has long reigned over the gnolls.
actors.mobs.radishboss.gnollking.leap=The Gnoll King is preparing to lunge!
actors.mobs.radishboss.gnollking.eye=The Gnoll King glares at you through the darkness. You will have nowhere to hide.
actors.mobs.radishboss.gnollking.notice=You vermin! You stand before your king, so why do you not bow? Those who defy me shall be executed on the spot!
actors.mobs.radishboss.gnollking.defeated=No...
actors.mobs.radishboss.gnollking$eyeattack.name=Keen Eyes
actors.mobs.radishboss.gnollking$eyeattack.desc=The Gnoll King is channeling magical power to its allies, and you now have nowhere to hide.\n\nNo matter what state you are in, all enemies will keep tracking your position.\n\nTurns remaining: %s.
actors.mobs.radishboss.gnollshamanking.name=Gnoll High Priest
actors.mobs.radishboss.gnollshamanking.desc=The Gnoll High Priest is the highest guardian at the King's side. Its vicious magic strikes terror into its enemies, and it will do everything in its power to keep the King safe.
actors.mobs.radishboss.gnollshamanking.notice=If thou wouldst venture deeper, thou must pass this trial. If thou lackest the will, begone at once!
actors.mobs.radishboss.gnollshamanking.rock_down=The Gnoll High Priest strikes the ground with its staff. In an instant, the rocks around you no longer seem stable... they are about to collapse...
actors.mobs.radishboss.gnollshamanking.bolt_kill=The blast of the Gnoll High Priest's magic shattered you...
actors.mobs.radishboss.gnollshamanking.reach_attack=The Gnoll High Priest's staff gives off an eerie light, and nearby gnoll guards are granted the ability to make one ranged attack.
actors.mobs.radishboss.gnollshamanking.defeated=But...
actors.buffs.rector.belief.name=Devout Faith
actors.buffs.rector.belief.no_target=No target found. This Smite has been cancelled.
actors.buffs.rector.belief.desc=The Rector is closely bound to their god, and relies on _faith_ to maintain that connection.\n\nBy gaining experience in the dungeon, the Rector builds up _faith_ and forms a link with their god. Faith skills can _deal damage, grant temporary HP, grant speed, and remove curses_, and the Rector can also pray to their god for a possible _boon_.\n\nCurrent faith: _%s_.
actors.buffs.rector.belief.desc2=The Rector is closely bound to their god, and relies on _faith_ to maintain that connection.\n\nBy gaining experience in the dungeon, the Rector builds up _faith_ and forms a link with their god. Faith skills can _deal damage, grant temporary HP, grant speed, and remove curses_, and the Rector can also pray to their god for a possible _boon_.\n\nCurrent faith: _%1$s_\n\nIron Sun damage bonus: _%2$s_.
actors.buffs.rector.belief.not_link_error=Your connection to your god has been temporarily interrupted, so you cannot use skills through faith.
actors.buffs.rector.belief.prayers_success=Prayer successful! You gained %s.
actors.buffs.rector.belief.experience_success=Prayer successful! You gained %s experience.
actors.buffs.rector.belief.curse_remove_success=Prayer successful! All of your curses have been removed.
actors.buffs.rector.belief.heal_success=Prayer successful! You feel yourself being healed.
actors.buffs.rector.faithobstruction.name=Faith Obstruction
actors.buffs.rector.faithobstruction.desc=Your connection to your god has been temporarily interrupted, so you cannot use skills through faith.\n\nTurns of obstruction remaining: %s.
actors.buffs.rector.soulstaker.name=Soul-Devouring Hymn
actors.buffs.rector.soulstaker.desc=Your abundant life force has now become your enemies' nightmare.
actors.hero.talent.prayer_before_meals.title=prayer before meals
actors.hero.talent.prayer_before_meals.desc=_+1:_ After eating, the Rector gains _1 faith_.\n\n_+2:_ After eating, the Rector gains _2 faith_.
actors.hero.talent.mental_telepathy.title=telepathy
actors.hero.talent.mental_telepathy.desc=_+1:_ The Rector _instantly identifies_ equipped, uncursed _weapons/armor_.\n\n_+2:_ The Rector _instantly identifies_ equipped, uncursed _rings_.
actors.hero.talent.rain_grace.title=rain of grace
actors.hero.talent.rain_grace.desc=_+1:_ Whenever the Rector kills an enemy, _all characters in view recover 1 HP_. This talent has a 5 turn cooldown.\n\n_+2:_ Whenever the Rector kills an enemy, _all characters in view recover 2 HP_. This talent has a 5 turn cooldown.
actors.hero.talent$rain_grace_cooldown.name=Rain of Grace Cooldown
actors.hero.talent$rain_grace_cooldown.desc=You have recently triggered this effect, and must wait before using it again.\n\nTurns remaining: %s.
actors.hero.talent.devotional.title=devout prayer
actors.hero.talent.devotional.desc=_+1:_ After using a skill, the Rector gains _4 shielding_.\n\n_+2:_ After using a skill, the Rector gains _8 shielding_.
actors.hero.talent.bless_food.title=blessed meal
actors.hero.talent.bless_food.desc=_+1:_ Eating takes the Rector only one turn, and grants _12 turns of blessing_.\n\n_+1:_ Eating takes the Rector only one turn, and grants _20 turns of blessing_.
actors.hero.talent.soul_nowifi.title=soul interference
actors.hero.talent.soul_nowifi.desc=_+1:_ The Rector gains vision of all enemies whose _current HP_ is no higher than _25% of max HP_.\n\n_+2:_ The Rector gains vision of all enemies whose _current HP_ is no higher than _40% of max HP_.
actors.hero.talent.light_step.title=devout believer
actors.hero.talent.light_step.desc=_+1:_ Immediately gain a potion of experience, but lose one talent point from this tier.\n\n_+2:_ Immediately gain a potion of experience, but lose one talent point from this tier.
actors.hero.talent.god_body.title=divine protection
actors.hero.talent.god_body.desc=_+1:_ When a debuff on the Rector has fewer than 2 turns remaining, it is removed immediately. (For corrosion, this talent's effect is 1 turn)\n\n_+2:_ When a debuff on the Rector has fewer than 3 turns remaining, it is removed immediately. (For corrosion, this talent's effect is 1 turn)
actors.hero.talent.nohope_lang.title=prayer of despair
actors.hero.talent.nohope_lang.desc=_+1:_ When the Rector's current HP is less than or equal to 25% of max HP, the effects of Smite and Light Infusion are multiplied by 1.5.\n\n_+2:_ When the Rector's current HP is less than or equal to 25% of max HP, Purification fully removes curses and the durations of the illumination and blessing it grants are doubled, and Prayer triggers twice.
actors.hero.talent.act_godprogress.title=divine authority
actors.hero.talent.act_godprogress.desc=_+1:_ When faith is insufficient, the Rector can, _without spending faith_, use _the Smite skill_. This talent has a _500 turn_ cooldown.\n\n_+2:_ When faith is insufficient, the Rector can, _without spending faith_, use _all of the Rector's skills_. This talent has a _425 turn_ cooldown.\n\n_+3:_ When faith is insufficient, the Rector can, _without spending faith_, use _all of the Rector's skills_. This talent has a _350 turn_ cooldown.
actors.hero.talent.smart_blessing.title=flexible faith
actors.hero.talent.smart_blessing.desc=_+1:_ Using wands and spell crystals _no longer adds to_ the cooldown of faith skills.\n\n_+2:_ _Killing an enemy directly_ with wand damage grants _0.33 faith_.\n\n_+3:_ After using a spell crystal other than _magical infusion/curse infusion_, there is a _33% chance_ to recover one.
actors.hero.talent.iron_sun.title=iron sun
actors.hero.talent.iron_sun.desc=_+1:_ For _each kind of buff_ the Battle Priest has, their _melee damage_ is increased by _3_.\n\n_+2:_ After using _any prayer skill_, the Battle Priest gains _shielding equal to their level_ (Physical Prayer does not trigger this).\n\n_+3:_ After _gaining experience_, the Battle Priest gains _shielding equal to the experience gained_.
actors.hero.talent.pharcis_bless.title=physical prayer
actors.hero.talent.pharcis_bless.desc=_+1:_ After making a successful melee attack, the Battle Priest has a _13% chance_ to use _the Smite skill_ on that target, _taking no time and costing no faith_.\n\n_+2:_ After making a successful melee attack, the Battle Priest has a _26% chance_ to use _the Smite skill_ on that target, _taking no time and costing no faith_.\n\n_+3:_ After making a successful melee attack, the Battle Priest has a _40% chance_ to use _the Smite skill_ on that target, _taking no time and costing no faith_.
actors.hero.talent.ben_work.title=potent healing
actors.hero.talent.ben_work.desc=_+1:_ After the Battle Priest _loses 10 or more_ HP in a single hit, they gain _slow recovery of 40% of the HP lost_. This talent has a _50 turn_ cooldown.\n\n_+2:_ After the Battle Priest _loses 10 or more_ HP in a single hit, they gain _slow recovery of 60% of the HP lost_. This talent has a _40 turn_ cooldown.\n\n_+3:_ After the Battle Priest _loses 10 or more_ HP in a single hit, they gain _slow recovery of 80% of the HP lost_. This talent has a _30 turn_ cooldown.
actors.hero.talent$slowhealingdeadcooldown.name=Potent Healing Cooldown
actors.hero.talent$slowhealingdeadcooldown.desc=You have already used this effect, and must wait %s more turns before you can use it again.
actors.hero.talent.fire_glass.title=holy wildfire
actors.hero.talent.fire_glass.desc=_+1:_ Smite also _applies holy fire to the target_.\n\n_+2:_ Holy fire can now spread to _flammable terrain_, and its damage is _the same as ordinary fire_.\n\n_+3:_ Holy fire can now spread to flammable terrain, and _deals more damage to enemies_.
actors.hero.talent.light_wash.title=baptism of holy light
actors.hero.talent.light_wash.desc=_+1:_ After using a prayer skill, the Red Cardinal _recovers 3 HP_.\n\n_+2:_ After using a prayer skill, the Red Cardinal _recovers 6 HP_.\n\n_+3:_ After using a prayer skill, the Red Cardinal _recovers 9 HP_.
actors.hero.talent.sky_tower.title=tower to heaven
actors.hero.talent.sky_tower.desc=_+1:_ The area of holy land created is expanded to a _5x5 square_.\n\n_+2:_ The area of holy land created is expanded to a _7x7 circle_. The Red Cardinal _gains 25% bonus movement speed_ within the area of holy land.\n\n_+3:_ The area of holy land created is expanded to a _7x7 square_. Holy land now _deals damage to all types of monsters_.
actors.hero.talent.black_love.title=dark devotion
actors.hero.talent.black_love.desc=_+1:_ The group damage dealt in Execution Mode also inflicts additional _bleeding starting at 2_ on enemies.\n\n_+2:_ The group damage dealt in Execution Mode also inflicts additional _bleeding starting at 4_ on enemies.\n\n_+3:_ The group damage dealt in Execution Mode also inflicts additional _bleeding starting at 6_ on enemies.
actors.hero.talent.dead_power.title=martyr's power
actors.hero.talent.dead_power.desc=_+1:_ For each cursed item the Executor has equipped, the _faith they gain is increased by 16%_.\n\n_+2:_ For each cursed item the Executor has equipped, the _faith they gain is increased by 32%_.\n\n_+3:_ For each cursed item the Executor has equipped, the _faith they gain is increased by 50%_.
actors.hero.talent.exp_impotion.title=experience infusion
actors.hero.talent.exp_impotion.desc=_+1:_ _If the Executor's level is less than or equal to the current depth_, then after killing an enemy the Executor is _forced to gain 6 experience_ and _2 extra HP_.\n\n_+2:_ _If the Executor's level is less than or equal to the current depth_, then after killing an enemy the Executor is _forced to gain 9 experience_ and _2 extra HP_.\n\n_+3:_ _If the Executor's level is less than or equal to the current depth_, then after killing an enemy the Executor is _forced to gain 12 experience_ and _2 extra HP_.
actors.hero.talent.superstition.title=astral communion
actors.hero.talent.superstition.desc=_+1:_ The Rector's wands and artifacts recharge _15%_ slower, but for every _20_ experience gained the Rector gains 1 extra faith.\n\n_+2:_ The Rector's wands and artifacts recharge _30%_ slower, but for every _16_ experience gained the Rector gains 1 extra faith.\n\n_+3:_ The Rector's wands and artifacts recharge _45%_ slower, but for every _12_ experience gained the Rector gains 1 extra faith.\n\n_+4:_ The Rector's wands and artifacts recharge _60%_ slower, but for every _8_ experience gained the Rector gains 1 extra faith.
actors.hero.talent.vitae_boost.title=bulwark of life
actors.hero.talent.vitae_boost.desc=_+1:_ Whenever the Rector gains temporary HP, they gain _1_ more.\n\n_+2:_ Whenever the Rector gains temporary HP, they gain _2_ more.\n\n_+3:_ While the Rector has temporary HP, they are immune to weakened, vulnerable, hexed, and degraded.\n\n_+4:_ While the Rector has temporary HP, all damage they take is reduced by 2. (Except hunger)
actors.hero.talent.adrenal_combat.title=combat thrill
actors.hero.talent.adrenal_combat.desc=_+1:_ After killing any enemy, the Battle Priest gains _3_ turns of adrenaline; however, after recovering HP in any way, all stacks of adrenaline are cleared.\n\n_+2:_ After killing any enemy, the Battle Priest gains _4_ turns of adrenaline; however, after recovering HP in any way, all stacks of adrenaline are cleared.\n\n_+3:_ After killing any enemy, the Battle Priest gains _5_ turns of adrenaline; however, after recovering HP in any way, all stacks of adrenaline are cleared.\n\n_+4:_ After killing any enemy, the Battle Priest gains _6_ turns of adrenaline; however, after recovering HP in any way, all stacks of adrenaline are cleared.
actors.hero.talent.gift.title=divine gift
actors.hero.talent.gift.desc=_+1:_ The Battle Priest's weapon and armor have a true level of at least _2_. While blessed, they gain a further +2.\n\n_+2:_ The Battle Priest's weapon and armor have a true level of at least _3_. While blessed, they gain a further +2.\n\n_+3:_ The Battle Priest's weapon and armor have a true level of at least _4_. While blessed, they gain a further +2.\n\n_+4:_ The Battle Priest's weapon and armor have a true level of at least _5_. While blessed, they gain a further +2.
actors.hero.talent.soul_possession.title=sanctified conversion
actors.hero.talent.soul_possession.desc=_+1:_ Enemies afflicted by holy fire and enemies that step onto holy land have a _1.5%_ chance each turn to become enthralled and be healed to full HP.\n\n_+2:_ Enemies afflicted by holy fire and enemies that step onto holy land have a _2%_ chance each turn to become enthralled and be healed to full HP.\n\n_+3:_ Enemies afflicted by holy fire and enemies that step onto holy land have a _2.5%_ chance each turn to become enthralled and be healed to full HP.\n\n_+4:_ Enemies afflicted by holy fire and enemies that step onto holy land have a _3%_ chance each turn to become enthralled and be healed to full HP.
actors.hero.talent.bloody_vitae.title=holy light barrier
actors.hero.talent.bloody_vitae.desc=_+1:_ When the Red Cardinal's HP is reduced by an external physical/magical attack, they immediately gain _3_ temporary HP.\n\n_+2:_ When the Red Cardinal's HP is reduced by an external physical/magical attack, they immediately gain _4_ temporary HP.\n\n_+3:_ When the Red Cardinal's HP is reduced by an external physical/magical attack, they immediately gain _5_ temporary HP.\n\n_+4:_ When the Red Cardinal's HP is reduced by an external physical/magical attack, they immediately gain _6_ temporary HP.
actors.hero.talent.error.title=talent in development
actors.hero.talent.error.desc=This talent is still in development. Stay tuned.
actors.hero.talent.bless_return.title=blessing of the holy spirit
actors.hero.talent.bless_return.desc=_+1:_ After the leap, the Rector is blessed for a number of turns equal to _0.75_ times the HP lost to this effect.\n\n_+2:_ After the leap, the Rector is blessed for a number of turns equal to _1_ times the HP lost to this effect.\n\n_+3:_ After the leap, the Rector is blessed for a number of turns equal to _1.25_ times the HP lost to this effect.\n\n_+4:_ After the leap, the Rector is blessed for a number of turns equal to _1.5_ times the HP lost to this effect.
actors.hero.talent.inertial_charge.title=inertial dash
actors.hero.talent.inertial_charge.desc=_+1:_ After landing from the leap, the Rector gains 3 turns of haste.\n\n_+2:_ After landing from the leap, the Rector gains 4 turns of haste.\n\n_+3:_ After landing from the leap, the Rector gains 5 turns of haste.\n\n_+4:_ After landing from the leap, the Rector gains 6 turns of haste.
actors.hero.talent.efficient_healing.title=efficient recovery
actors.hero.talent.efficient_healing.desc=_+1:_ After the leap, HP is restored up to _40%_ of max HP, and the rate of HP recovery rises to _1.5_ per turn.\n\n_+2:_ After the leap, HP is restored up to _45%_ of max HP, and the rate of HP recovery rises to _1.75_ per turn.\n\n_+3:_ After the leap, HP is restored up to _50%_ of max HP, and the rate of HP recovery rises to _2_ per turn.\n\n_+4:_ After the leap, HP is restored up to _55%_ of max HP, and the rate of HP recovery rises to _2.5_ per turn.
actors.hero.talent.sacrifice.title=dark pact
actors.hero.talent.sacrifice.desc=_+1:_ When using the armor ability, immediately lose HP equal to current level x 2, and recover half of that HP when the ability ends.\n\n_+2:_ When using the armor ability, immediately lose HP equal to current level x 2, and recover the same amount of HP when the ability ends.\n\n_+3:_ When using the armor ability, immediately lose HP equal to current level x 2 and gain shielding equal to half that amount, and recover the same amount of HP when the ability ends.\n\n_+4:_ When using the armor ability, immediately lose HP equal to current level x 2 and gain an equal amount of shielding, and recover the same amount of HP when the ability ends.
actors.hero.talent.blocking_reading.title=devoted study
actors.hero.talent.blocking_reading.desc=_+1:_ Each scroll read while the armor ability is active grants _5_ temporary HP. The effect is doubled for exotic scrolls.\n\n_+2:_ Each scroll read while the armor ability is active grants _6_ temporary HP. The effect is doubled for exotic scrolls.\n\n_+3:_ Each scroll read while the armor ability is active grants _7_ temporary HP. The effect is doubled for exotic scrolls.\n\n_+4:_ Each scroll read while the armor ability is active grants _8_ temporary HP. The effect is doubled for exotic scrolls.
actors.hero.talent.tai_chi_poise.title=dual-path rector
actors.hero.talent.tai_chi_poise.desc=_+1:_ Faith skills that cost _5_ faith or less no longer end Shadow Hymn.\n\n_+2:_ Faith skills that cost _10_ faith or less no longer end Shadow Hymn.\n\n_+3:_ Faith skills that cost _15_ faith or less no longer end Shadow Hymn.\n\n_+4:_ Faith skills that cost _20_ faith or less no longer end Shadow Hymn.
actors.hero.talent.avatar.title=divine touch
actors.hero.talent.avatar.desc=_+1:_ Gain 30 turns of magical sight when the armor ability is activated.\n\n_+2:_ While the armor ability is active, the Rector's attack speed is increased by _33%_.\n\n_+3:_ While the armor ability is active, the Rector's attack speed is increased by _67%_.\n\n_+4:_ While the armor ability is active, the Rector's attack speed is increased by _100%_.
actors.hero.talent.godhood.title=inviolable
actors.hero.talent.godhood.desc=_+1:_ Each time a faith skill is used while the armor ability is active, gain _2_ turns of invulnerability.\n\n_+2:_ Each time a faith skill is used while the armor ability is active, gain _3_ turns of invulnerability.\n\n_+3:_ Each time a faith skill is used while the armor ability is active, gain _4_ turns of invulnerability.\n\n_+4:_ Each time a faith skill is used while the armor ability is active, gain _5_ turns of invulnerability.
actors.hero.talent.holy_shockwave.title=healing revelation
actors.hero.talent.holy_shockwave.desc=_+1:_ Using Divine Possession restores _10_ HP and knocks back all enemies in view by _2_ tiles.\n\n_+2:_ Using Divine Possession restores _15_ HP and knocks back all enemies in view by _3_ tiles.\n\n_+3:_ Using Divine Possession restores _20_ HP and knocks back all enemies in view by _4_ tiles.\n\n_+4:_ Using Divine Possession restores _20_ HP and knocks back all enemies in view by _5_ tiles.
actors.hero.talent.hunting_intuition.title=hunting intuition
actors.hero.talent.hunting_intuition.desc=_+1:_ Every 20 times the Moonlight gains experience, the Moonlight receives a piece of mystery meat.\n\n_+2:_ Every 15 times the Moonlight gains experience, the Moonlight receives a piece of mystery meat.
actors.hero.talent.sharpening_edge.title=honed edge
actors.hero.talent.sharpening_edge.desc=_+1:_ The Moonlight can sacrifice an identified weapon or armor to identify one item of the same type.\n\n_+2:_ The Moonlight can sacrifice any weapon or armor to identify one item of the same type.
actors.hero.talent.weapon_mastery.title=weapon mastery
actors.hero.talent.weapon_mastery.desc=_+1:_ For every _125_ consecutive turns the Moonlight has had the same weapon equipped, attacks with that weapon gain a damage bonus of _0-1_.\n\n_+2:_ For every _100_ consecutive turns the Moonlight has had the same weapon equipped, attacks with that weapon gain a damage bonus of _0-1_.\n\nThe damage bonus of this talent stacks up to 5 times.
actors.hero.talent.war_trample.title=war stomp
actors.hero.talent.war_trample.desc=_+1:_ When the Moonlight tramples tall grass, the chance of not losing any turns of beneficial effects is 75%.\n\n_+2:_ When the Moonlight tramples tall grass, the chance of not losing any turns of beneficial effects is 100%.
actors.hero.talent.meal_utilization.title=resourceful meal
actors.hero.talent.meal_utilization.desc=_+1:_ The Moonlight eats in moderation, eating only half of the food at a time and spending only 1 turn on it.\n\n_+2:_ The other half of the food can still trigger the food's special effects in full.
actors.hero.talent.strong_body.title=strong body
actors.hero.talent.strong_body.desc=_+1:_ The Moonlight's max HP and max HP growth are restored.\n\n_+2:_ The Moonlight gains 1 additional point of max HP growth.\n\n_After this talent is taken, one more level up is needed before it takes effect._
actors.hero.talent.holy_spring.title=holy spring
actors.hero.talent.holy_spring.desc=_+1:_ The Moonlight can choose to convert a well of awareness or a well of health into 1 scroll of upgrade.\n\n_+2:_ The Moonlight can choose to convert a well of awareness or a well of health into 1 scroll of upgrade and 2 scrolls of remove curse.\n\nThis talent can only take effect once for each kind of well.
actors.hero.talent.triple_insurance.title=triple insurance
actors.hero.talent.triple_insurance.desc=_+1:_ The Moonlight gains 6 shielding after eating, or after using a potion or scroll.\n\n_+2:_ The Moonlight gains 9 shielding after eating, or after using a potion or scroll.
actors.hero.talent.catapult_start.title=catapult start
actors.mobs.npcs.ratking.no_skills=You don't even have an armor ability! And you think you're fit to trade with me?
actors.mobs.npcs.ratking.crown_gold=Oh my, how come you have accepted the power of a demon? My royal abilities conflict with it, you know. As compensation, I shall bestow upon you a portion of my treasured vault!
actors.mobs.npcs.shopkeeper.talk_prison_rector=Oh ho, if it isn't one of the Church's upper crust. Let's be clear, down in this dungeon you get what you pay for. Whatever your reason for coming down here, the monsters in this place won't go easy on you...
actors.mobs.npcs.shopkeeper.talk_prison_moonlight=A kitty? You're giving off energy from another world, I can tell you're certainly no ordinary person... Let me guess, you've already obtained the Amulet of Yendor, haven't you? And not just the Amulet of Yendor of this world, either...
actors.mobs.npcs.shopkeeper.talk_prison_cardtrickster=Oh, a card sharp? That deck of yours doesn't look like any ordinary pack of cards. Let's be clear up front: I don't gamble, and I don't fall for sleight of hand. Gold first, goods after.
actors.mobs.npcs.moonlight.name=Moonlight
actors.mobs.npcs.moonlight.msg0=I used to be a shield guard, until my shield was stolen...
actors.mobs.npcs.moonlight.msg1=Actually, I also had a one-handed sword, but that was stolen too...
actors.mobs.npcs.moonlight.msg2=Adventurer, if you bring me any melee weapon, I'll give you a tier 2 uncursed melee weapon.
actors.mobs.npcs.moonlight.loop=Good luck, adventurer!
actors.mobs.npcs.moonlight.desc=This cat-like humanoid creature is smooth and snow-white all over. It is rumored to have once been a shield guard, and now plies the trade of a scrap dealer.
actors.mobs.npcs.moonlight.the_catist.name=The Catist's cat
actors.mobs.npcs.moonlight.the_catist.msg0=Purrr... meow... you're finally here.
actors.mobs.npcs.moonlight.the_catist.msg1=Normally there would be someone else here, but he's away today, so the Catist asked me to fill in.
actors.mobs.npcs.moonlight.the_catist.msg2=The Catist asked me to take any one weapon from you, and then give you a tier 2 uncursed weapon.
actors.mobs.npcs.moonlight.the_catist.loop=Bye-bye, meow~ Off home to eat my canned food~
actors.mobs.npcs.moonlight.the_catist.desc=This is a cat-shaped creature that resembles a cat, and it looks just like a tabby cat. In fact, this creature really is a tabby cat.
actors.mobs.npcs.moonlight$wndweapontransform.weapon_transform=Moonlight's Request
actors.mobs.npcs.moonlight$wndweapontransform.transform_message=You can give me any weapon, and I will transform it into a random tier 2 uncursed weapon for you.
actors.mobs.npcs.moonlight$wndweapontransform.transform=Exchange
actors.mobs.frog.name=frog
actors.mobs.frog.desc=Frogs live in abandoned mossy burrows in the sewers. They don't much like being disturbed, and they pose a greater threat than marsupial rats.
actors.mobs.frog$poulwater.name=teal slime
actors.mobs.frog$poulwater.desc=Disgusting slime spat out by a frog. You can't find any sensible way to clean it off. Fortunately, as time passes, the slime will gradually clot and fall off.\n\nTurns until this slime falls off: %s.
actors.mobs.frog$poulwater.fade=The slime dries up and falls off, taking the shielding on you along with it.
actors.mobs.frog.water=The frog spits nauseating slime out of its mouth...
actors.mobs.radishenemy.giantworm.name=giant worm
actors.mobs.radishenemy.giantworm.desc=After mutating, these worms have grown far larger, feeding organs and all, yet they have not evolved any other body parts, which is fortunate enough for cleaners and adventurers.\n\nThe worm drains a small amount of your blood.
actors.mobs.radishenemy.giantworm.rankings_desc=You were drained to death by the giant worm...
actors.mobs.radishenemy.goblin.name=goblin
actors.mobs.radishenemy.goblin.desc=Goblins as a race are dim-witted, but they are thick-skinned and know how to throw the stones that can be found lying by any roadside. These are the only two reasons they have managed to gain a foothold in the sewers and in forests elsewhere.
actors.mobs.radishenemy.goblin.stone_remain=\n\n\nThis goblin has _%d_ throwing stones left.
actors.mobs.radishenemy.goblin.rock_punk_kill=You were killed by a throwing stone...
actors.mobs.radishenemy.goblin.rankings_desc=You were beaten to death by the goblin...
actors.mobs.radishenemy.dog.name=dog
actors.mobs.radishenemy.dog.desc=Hounds are among the more dangerous of domesticated animals. They will viciously tear a chunk of flesh from an enemy's leg while the enemy is too busy to cope.\n\nThe fangs of these dogs don't look very clean...
actors.mobs.radishenemy.dog.rankings_desc=The dog savagely tore you apart...
actors.mobs.radishenemy.mayfly.name=mayfly
actors.mobs.radishenemy.mayfly.desc=These wandering creatures generously bestow healing upon other targets, and will not stop until they die.\n\nThe mayfly applies a weak healing effect to its nearby allies.
actors.mobs.radishenemy.prisoner.name=prisoner
actors.mobs.radishenemy.prisoner.desc=The main clientele of the underground prison. After order broke down, these hulking brutes were temporarily freed from their cells, yet they still cannot escape their fate of clashing with the guards, even though none of them are as sane as they used to be.\n\nThe prisoner still remembers the officers of the prison. If they happen to be present as well, he will not target you for the time being.
actors.mobs.radishenemy.prisoner.kill=You were beaten to a pulp by the prisoner...
actors.mobs.radishenemy.jailer.name=patrolman
actors.mobs.radishenemy.jailer.desc=Patrolmen work day and night without rest, holding the most hard-working post in the underground prison. A mental breakdown under heavy pressure has made them mistake the corridors for cells. In truth, this place imprisons everyone equally.\n\nIf you are not within the patrolman's sight, he will patrol faster.\nThe patrolman may drop more experience.\n
actors.mobs.radishenemy.jailer.kill=You tried to stand up to the patrolman...
actors.mobs.radishenemy.torturer.name=torturer
actors.mobs.radishenemy.torturer.desc=These masked higher-ups of the prison carry iron chains about twice the length of a man's body. Their daily routine is flogging prisoners in the hope of getting some information that could bring release to the prisoners or to themselves. Most people, however, simply call this torture.\n\nBecause of their deep mastery of blunt weapons, their attacks can bypass armor to damage you.
actors.mobs.radishenemy.torturer.kill=You were tortured to death...
actors.mobs.radishenemy.grudge.name=haunting wraith
actors.mobs.radishenemy.grudge.desc=A monster formed when the shapeless souls of those who died unjustly are steeped in dark power. Their spectral form makes it easier for them to dodge an opponent's attacks, and the dark energy left behind also brings trouble to whoever executes these things.\n\nThe haunting wraith's dark energy will be inflicted upon you.
actors.mobs.radishenemy.grudge.kill=You were tormented to death...
actors.mobs.radishenemy.grudge$haunted.name=Haunted
actors.mobs.radishenemy.grudge$haunted.desc=You must have been possessed by something unclean!\nAccuracy and evasion are both reduced by _5_ while this lasts.
actors.mobs.radishenemy.gnollzealot.name=gnoll zealot
actors.mobs.radishenemy.gnollzealot.desc=A bizarre group that has forsaken the teachings of the gnoll warlocks. They firmly believe that unity is strength, and have survived to this day by using healing arts in place of going hungry.\n\nThey will share your healing effects.
actors.mobs.radishenemy.gnollzealot.kill=You were killed by the gnoll zealot...
actors.mobs.radishenemy.gnollzealot.crazy_dance_kill=You were killed by the gnoll zealot's spell wave...
actors.mobs.radishenemy.gnollzealot.rage=Jaaaaaa! Waaaaaa!
actors.mobs.radishenemy.drake.name=subterranean drake
actors.mobs.radishenemy.drake.desc=A drake species born from the union of dragons and lizard-like creatures. It likes to sleep buried underground, but it wakes up in quite a foul temper.\n\nNone of your means of attack can reach into the soil.
actors.mobs.radishenemy.drake.kill=The subterranean drake killed you...
actors.mobs.radishenemy.drake.rock_punk_kill=You were killed by the earth and rocks thrown up by the subterranean drake's burrowing...
actors.mobs.radishenemy.drake.reveal=You have enraged this drake, get away quickly!
actors.mobs.radishenemy.drake.shock=%s was knocked back by the subterranean drake's burrowing!
actors.mobs.radishenemy.drake.revealing=You can feel that something is coming...
actors.mobs.radishenemy.stonespirit.name=stone spirit
actors.mobs.radishenemy.stonespirit.desc=Shaped from the pure souls of the earth and stone deep underground. Nothing can command these unfettered products of nature, but their connection with their creator is also easily severed.\n\nThe stone spirit's power is supplied by the earth, so try not to let the two come into contact.
actors.mobs.radishenemy.stonespirit.kill=The stone spirit crushed you flat as a pancake...
actors.mobs.radishenemy.stonespirit.boost=Pure earthen power is covering the stone spirit, don't let it stand on pure ground!
actors.mobs.radishenemy.dm175.name=DM-175
actors.mobs.radishenemy.dm175.desc=Its makers came up with the breakthrough idea of wrapping machines in shielding to raise their temporary durability, but the project came to nothing because the final cost was too high. Nearly all of these failed products were dumped into the caves.\n\nThis type of machine is wrapped in thick arcane shielding.
actors.mobs.radishenemy.dm175.kill=You were eliminated as an intruder...
actors.mobs.radishenemy.royalguard.name=royal guard
actors.mobs.radishenemy.royalguard.desc=The most elite guard of the King of Dwarves. They are equipped with all sorts of weapons from the royal treasury, and are sworn to serve unto death only the one and only king of the dwarven kingdom.
actors.mobs.radishenemy.royalguard.equipment=You can see them holding _%s_ in their hands. Better to be careful.
actors.mobs.radishenemy.royalguard.kill=You were slaughtered by the guard wielding the %s...
actors.mobs.radishenemy.artillerist.name=dwarven artillerist
actors.mobs.radishenemy.artillerist.desc=The odd ones out in the dwarven army. They are better at tinkering with gunpowder than at fighting bare-handed or casting spells. Fortunately, their firepower is considerable and their aim is decent too.\n\nWatch out for their heavy cannons! They operate portable mortars to shell the area centered on you.
actors.mobs.radishenemy.artillerist.kill=You were killed by the dwarven artillerist...
actors.mobs.radishenemy.artillerist.bomb_party_kill=You were blown away by cannon fire...
actors.mobs.radishenemy.shieldmage.name=dwarven shield mage
actors.mobs.radishenemy.shieldmage.desc=They once worked with the dwarven guard to hold back the demons as members of the "Final Line of Defense". But as the kingdom's strength waned, the line fell back again and again, and part of the underground city has already been ceded.\n\nThey grant shielding to nearby allies. Stay careful, as they are not without melee ability.\n\nThey fire shielding spells that protect allied units.
actors.mobs.radishenemy.shieldmage.kill=The dwarven shield mage killed you...
actors.mobs.radishenemy.clusteredskeleton.name=clustered skeleton
actors.mobs.radishenemy.clusteredskeleton.desc=A malicious product of the King of Dwarves' black magic. Many skeletons have been reused by dark energy and pieced together into a twisted, enormous combined frame of bones, whose might is no less than that of a carefully crafted mechanical golem.\n\nThe giant skeleton explodes too. There is no simple way to describe the power of this skeleton's explosion, and you can faintly make out one or two fully intact skeletons that have also been fused into this big fellow...
actors.mobs.radishenemy.clusteredskeleton.kill=You were crushed by the giant skeleton...
actors.mobs.radishenemy.clusteredskeleton.hart_hanson_kill=A massive explosion reduced you to ashes...
actors.mobs.radishenemy.clusteredskeleton.death_warning=The clustered skeleton's structure is becoming unstable and a violent explosion is imminent, run away!
actors.mobs.radishenemy.clusteredskeleton$deathclock.name=Collapse warning
actors.mobs.radishenemy.clusteredskeleton$deathclock.desc=The giant skeleton is about to explode, run!\nShielding remaining: _%s_.
actors.mobs.radishenemy.deminion.name=imprinter
actors.mobs.radishenemy.deminion.desc=One of the lowlier demons of hell. However, because its marks are so convenient, the other demons give it preferential treatment at every turn.\n\nThe imprinter's mark greatly strengthens the effects of demons.
actors.mobs.radishenemy.deminion.kill=You have already... huh, how did you die?
actors.mobs.radishenemy.deminion.zap_kill=You were killed by the imprinter's feeble magic...
actors.mobs.radishenemy.deminion$sigil.name=Sigil
actors.mobs.radishenemy.deminion$sigil.desc=Something new has appeared on the back of your neck. Not only does it hurt, it also gives off demonic energy. You can feel that the demons' malice has grown stronger.
actors.hero.talent.title=Lethal Damage Immunity
actors.hero.talent.desc=You can currently resist lethal damage with either the Pain Scar talent or an ankh. Please choose.
actors.hero.talent.prompt=Pain Scar
actors.hero.talent.cancel=Ankh
actors.hero.talent.time_pause.title=persistence of time
actors.hero.talent.time_pause.desc=_+1:_ Up to _2_ checks within the same turn will consume only one RNG check.\n\n_+2:_ Up to _3_ checks within the same turn will consume only one RNG check.\n\n_+3:_ Up to _4_ checks within the same turn will consume only one RNG check.\n\n_+4:_ Up to _5_ checks within the same turn will consume only one RNG check.
actors.hero.talent.better_item.title=better items
actors.hero.talent.better_item.desc=_+0:_ Generates tier _1-2_ items.\n\n_+1:_ Generates tier _2-3_ items.\n\n_+2:_ Generates tier _3-4_ items.\n\n_+3:_ Generates tier _4-5_ items.\n\n_+4:_ Generates tier _5-6_ items.
actors.hero.talent.extra_pocket.title=extra pockets
actors.hero.talent.extra_pocket.desc=_+0:_ The backpack can hold at most _1_ toy in total, and only _1_ toy can be attached at a time.\n\n_+1:_ The backpack can hold at most _3_ toys in total, and _1_ toy can be attached at a time.\n\n_+2:_ The backpack can hold at most _5_ toys in total, and _1_ toy can be attached at a time.\n\n_+3:_ The backpack can hold at most _7_ toys in total, and _2_ toys can be attached at a time.\n\n_+4:_ The backpack can hold at most _10_ toys in total, and _2_ toys can be attached at a time.
actors.hero.talent.accept_challenge.title=challenge per fight: standard challenge
actors.hero.talent.accept_challenge.desc=_+1/+2/+3/+4:_ A challenge spawns 1-3 random monsters of the current region, or 1 random monster of the next region plus 0-1 random monsters of the current region; the chance of the latter is 15%/30%/45%/60%; monsters of the next region are never spawned in side branches. The contents of the challenge and 1-2 random toy effects are decided and shown in advance; the harder the challenge, the higher the chance of getting 2 effects. Once accepted, the effects last 25/50/75/100 turns, take up no backpack capacity or armor toy slots, and can be viewed in the toy backpack info of the armor. The effects gained from each challenge are timed separately; even if the same toy effect is drawn again, the durations are not merged.
actors.mobs.npcs.moonlight$wndweapontransform.new_weapon_gained=You received %s!
actors.mobs.npcs.moonlight$wndweapontransform.weapon_removed=Your %s has been taken away by Moonlight.
actors.mobs.npcs.moonlight$wndweapontransform.the_catist.weapon_transform=The Catist's Cat's Request
actors.mobs.npcs.moonlight$wndweapontransform.the_catist.transform_message=I take away any one weapon, then give you a tier 2 uncursed weapon.
actors.mobs.npcs.moonlight$wndweapontransform.the_catist.transform=Exchange
actors.mobs.npcs.moonlight$wndweapontransform.the_catist.new_weapon_gained=Here's %s for you, meow...
actors.mobs.npcs.moonlight$wndweapontransform.the_catist.weapon_removed=Rules are rules, I'm taking %s.
actors.hero.hero.detour_title=Detour Protection
actors.hero.hero.detor_desc=The path between you and your destination is far longer than the straight-line distance between you and your destination. Perhaps something is blocking the way, or perhaps it is because of the fog of war. Do you want to keep going?
actors.hero.hero.detour_yes=Yes, take the long way around
actors.hero.hero.detour_no=No, cancel movement
actors.hero.moonlight.cancel_attack_gained=You cancelled your attack recovery by switching weapons.
actors.hero.talent.one_jutte.title=one jutte
actors.hero.talent.one_jutte.desc=_+1:_ The jutte's durability is increased by 10. Throwing speed is increased by 20%.\n\n_+2:_ The jutte's durability is increased by 17. Throwing speed is increased by 35%.\n\n_+3:_ The jutte's durability is increased by 25. Throwing speed is increased by 50%.
actors.hero.talent.iron_quench.title=iron quenching
actors.hero.talent.iron_quench.desc=_+1:_ If an upgraded weapon is converted into a jutte, the attack power of that jutte is additionally increased by its number of upgrades*10%. A jutte that has levels returns one scroll of upgrade when it breaks.\n\n_+2:_ If an upgraded weapon is converted into a jutte, the attack power of that jutte is additionally increased by its number of upgrades*20%. A jutte that has levels returns one scroll of upgrade when it breaks.\n\n_+3:_ If an upgraded weapon is converted into a jutte, the attack power of that jutte is additionally increased by its number of upgrades*30%. A jutte that has levels returns one scroll of upgrade when it breaks.
actors.hero.talent.surprise_jutte.title=caught off guard
actors.hero.talent.surprise_jutte.desc=_+1:_ The Jutte Champion's surprise attacks with a jutte do not consume durability.\n\n_+2:_ The Jutte Champion's surprise attacks with a jutte take only 0.66 turns.\n\n_+3:_ The Jutte Champion's surprise attacks with a jutte take only 0.33 turns.
actors.hero.talent.fated_twice.title=fated second draw
actors.hero.talent.fated_twice.desc=_+1:_ The number of RNG checks is increased to _5_.\n\n_+2:_ The number of RNG checks is increased to _6_.\n\n_+3:_ The number of RNG checks is increased to _7_.\n\n_+4:_ The number of RNG checks is increased to _8_.
actors.hero.talent.loot_ground.title=scour the land
actors.hero.talent.loot_ground.desc=_+1:_ If the Moonlight still has RNG checks left after killing an enemy, one check is consumed to gain drop rewards equivalent to a +2 ring of wealth.\n\n_+2:_ If the Moonlight still has RNG checks left after killing an enemy, one check is consumed to gain drop rewards equivalent to a +4 ring of wealth.\n\n_+3:_ If the Moonlight still has RNG checks left after killing an enemy, one check is consumed to gain drop rewards equivalent to a +6 ring of wealth.\n\n_+4:_ If the Moonlight still has RNG checks left after killing an enemy, one check is consumed to gain drop rewards equivalent to a +8 ring of wealth.
actors.hero.talents.moonlight.huntingintuitiontalent.loot=You notice that this monster is edible!
actors.buffs.championhero$blazing.name=Blazing Champion
actors.buffs.championhero$blazing.desc=Melee damage is increased by 25%%. Ignites enemies it attacks and is immune to fire.\n\nTurns of elite effect remaining: %s.
actors.buffs.championhero$blazing.descforshow=Melee damage is increased by 25%. Ignites enemies it attacks and is immune to fire.
actors.buffs.championhero$projecting.name=Projecting Champion
actors.buffs.championhero$projecting.desc=Melee damage is increased by 25%%. Can attack any target in sight.\n\nTurns of elite effect remaining: %s.
actors.buffs.championhero$projecting.descforshow=Melee damage is increased by 25%. Can attack any target in sight.
actors.buffs.championhero$antimagic.name=Antimagic Champion
actors.buffs.championhero$antimagic.desc=Damage taken is reduced by 25%%. Completely immune to all magical effects and some negative effects.\n\nTurns of elite effect remaining: %s.
actors.buffs.championhero$antimagic.descforshow=Damage taken is reduced by 25%. Completely immune to all magical effects and some negative effects.
actors.buffs.championhero$giant.name=Giant Champion
actors.buffs.championhero$giant.desc=Takes 75%% less damage and has a base melee reach of two tiles (or the reach of the wielded weapon, whichever is longer), but movement speed in enclosed spaces is reduced by 50%%.\n\nTurns of elite effect remaining: %s.
actors.buffs.championhero$blessed.name=Blessed Champion
actors.buffs.championhero$blessed.desc=Accuracy and evasion are increased by 200%%.\n\nTurns of elite effect remaining: %s.
actors.buffs.championhero$blessed.descforshow=Accuracy and evasion are increased by 200%.
actors.buffs.championhero$growing.name=Growing Champion
actors.buffs.championhero$growing.desc=Gains a steadily increasing bonus to accuracy, evasion, melee damage, and damage reduction.\n\nCurrent acc/eva/dmg boost: %1$d%%\nCurrent damage reduction: %2$d%%\n\nTurns of elite effect remaining: %3$s.
actors.buffs.championhero$growing.descforshow=Gains a steadily increasing bonus to accuracy, evasion, melee damage, and damage reduction.
actors.buffs.championhero$battlerector.name=Benediction
actors.buffs.championhero$battlerector.desc=Melee damage is increased by 25%%, and damage taken is reduced by 25%%.\n\nTurns remaining: %s.
actors.buffs.championhero$giant.descforshow=Takes 75% less damage and has a base melee reach of two tiles (or the reach of the wielded weapon, whichever is longer), but movement speed in enclosed spaces is reduced by 50%.
actors.hero.talent$nobeliefusedcooldown.name=Divine Authority Cooldown
actors.hero.talent$nobeliefusedcooldown.desc=You have already used this effect, and must wait %s more turns before you can use it again.
actors.buffs.rector.rectorskills$correct.name=smite
actors.buffs.rector.rectorskills$correct.desc=Target an area and deal _%s damage_ to the nearest enemy in it. This damage is multiplied by _1.5x_ against _undead and demonic enemies_.\n\nThis skill costs _5 faith_.
actors.buffs.rector.rectorskills$correct.name_plus=divine retribution
actors.buffs.rector.rectorskills$correct.desc_plus=Target an area and deal _%s damage_ to the nearest enemy in it. This damage is multiplied by _1.5x_ against _undead and demonic enemies_.\n\nThis skill costs _5 faith_.\n\nSmite has been specially enhanced by your subclass: _damage +50%%_, and before it is cast it will _additionally pick a random target in view_ and apply the same _Divine Retribution_ effect to it. If the additional cast has been completed, faith is deducted.
actors.buffs.rector.rectorskills$clean.name=purification
actors.buffs.rector.rectorskills$clean.desc=Select a piece of equipment and weaken the curse on it, and grant yourself _100 turns of illumination_ and _20 turns of blessing_.\n\nThis skill costs _15 faith_.
actors.buffs.rector.rectorskills$lightimuee.name=light infusion
actors.buffs.rector.rectorskills$lightimuee.desc=Gain _%1$s points_ of temporary HP, and gain _%2$s turns_ of stamina.\n\nTemporary HP does not fade away, can _block any damage_, _including starvation_, and is shown as a _yellow bar_.\n\nThis skill costs _12 faith_.
actors.buffs.rector.belief.lightimuee_success=You feel your vitality being replenished.
actors.buffs.rector.rectorskills$lightimuee.name_plus=domain of light
actors.buffs.rector.rectorskills$lightimuee.desc_plus=Gain _%1$s turns_ of temporary HP.\n\nTemporary HP does not fade away, can _block any damage_, _including starvation_, and is shown as a _yellow bar_.\n\nThis skill costs _12 faith_.\n\nLight Infusion has been specially enhanced by your subclass: _%2$s points of stamina_ and _%3$s turns_ of adrenaline.
actors.buffs.rector.rectorskills$prayers.name=devout prayer
actors.buffs.rector.rectorskills$prayers.desc=Pray for divine protection. The possible effects of the prayer are listed below.\n\n_-_ Gain a _random mid-tier drop_ (blue) of the _ring of wealth_.\n\n_-_ Gain _1/2 of the experience_ needed to level up at your current level.\n\n_-_ _Fully cleanse_ _all equipment_ in your backpack and equipped.\n\n_-_ Restore _1/3_ of your max HP, and gain blessing for _as many turns as the HP restored_.\n\nThis skill costs _20 faith_.
actors.buffs.rector.rectorskills$bless.name=holy radiance
actors.buffs.rector.rectorskills$bless.desc=Enter Benediction form for _60 turns_, during which your _physical damage is increased by 25%_ and _all damage you take is reduced by 25%_.\n\nThis skill costs _15 faith_.
actors.buffs.rector.rectorskills$apower.name=verdict of forgiveness
actors.buffs.rector.rectorskills$apower.desc=Instantly kill one non-boss _enemy whose HP is below 60%_ within your attack range.\n\nThis skill costs _4 faith_.\n\nFaith is not deducted if the cast fails.
actors.buffs.rector.belief.deadkill_success=%s has received the Lord's forgiveness.
actors.buffs.rector.belief.deadkill_noattack=No target within attack range has HP below 60%.
actors.buffs.rector.belief.deadkill_nomobs=No suitable enemy was found, so Verdict of Forgiveness cannot be used.
actors.buffs.rector.belief.deadkill_prompt=Choose a target for Verdict of Forgiveness
actors.buffs.rector.belief.enddead_success=With a flash of red light, %s enemies received their final execution!
actors.buffs.rector.rectorskills$backmessage.name=perfidy
actors.buffs.rector.rectorskills$backmessage.desc=Target a point within your field of view. All creatures in the _3x3 area_ around it gain _bleeding with an initial value of depth+3_.\n\nThis skill costs _12 faith_.
actors.buffs.rector.rectorskills$deadmode.name=final execution
actors.buffs.rector.rectorskills$deadmode.desc=Instantly kill _up to 5 non-boss enemies_ within your field of view, and lose experience equal to _the experience gained from killing them_.\n\nThis skill costs _20 faith_.
actors.buffs.holylowburinng.name=Holy Burning
actors.buffs.holylowburinng.burnsup=%s is consumed by the waves of holy fire!
actors.buffs.holylowburinng.ondeath=You were consumed to death by the waves of holy fire...
actors.buffs.holylowburinng.desc=Few things are more distressing than being engulfed in holy fire.\n\nHoly fire will deal damage every turn until it expires on its own, and creatures engulfed in holy fire take 1.3x damage.\n\nTurns of holy burning remaining: %s.
actors.buffs.halomethaneburning.name=Holy Burning
actors.buffs.halomethaneburning.heromsg=Your soul is being scorched by holy fire!
actors.buffs.halomethaneburning.burnsup=%s is consumed by the waves of holy fire!
actors.buffs.halomethaneburning.ondeath=You were consumed to death by the waves of holy fire...
actors.buffs.halomethaneburning.desc=Few things are more distressing than being engulfed in holy fire.\n\nHoly fire will deal damage every turn until it expires on its own, and creatures engulfed in holy fire take 1.3x damage.\n\nAdditionally, holy burning will ignite any flammable terrain or items that it comes into contact with.\n\nTurns of holy burning remaining: %s.
actors.buffs.rector.rectorskills$holyfire.name=judgment of holy fire
actors.buffs.rector.rectorskills$holyfire.desc=Target a tile and create a _field of holy fire_ in the _3x3 area_ around it. _All creatures in the field take 1.3x damage_ and are set ablaze with _holy fire_.\n\nThis skill costs _10 faith_.
actors.buffs.rector.rectorskills$holyland.name=holy domain
actors.buffs.rector.rectorskills$holyland.desc=Target a tile and create an _area of holy land_ in a _%1$s_ centered on it.\n\n_Non-hero, non-flying characters_ on holy land _have their movement speed reduced by 33%%_, while _undead and demonic_ monsters _have theirs reduced by 50%%_, and take _%2$s damage_ each turn.\n\nThis skill costs _8 faith_.
actors.buffs.rector.rectorskills$holyland.radius3=7x7 circle
actors.buffs.rector.rectorskills$holyland.radius2=7x7 square
actors.buffs.rector.rectorskills$holyland.radius1=5x5 square
actors.buffs.rector.rectorskills$holyland.radius0=5x5 circle
items.wands.yetwand.holyland$mobslowspeed.name=Law of the Holy Land
items.wands.yetwand.holyland$mobslowspeed.desc=All _non-hero, non-flying characters_ on holy land have their _movement speed reduced by 33%_.
items.wands.yetwand.holyland$mobslowspeed.damage_desc=All _non-hero, non-flying characters_ on holy land have their _movement speed reduced by 33%%_.\n\n_Every turn_ they also take _%s magic damage from the holy land_.
items.wands.yetwand.holyland$demonslowspeed.name=Inquisition of the Holy Land
items.wands.yetwand.holyland$demonslowspeed.desc=_Demonic and undead_ creatures on holy land have their _movement speed reduced by 50%%_.\n\n_Every turn_ they also take _%s magic damage from the holy land_.
actors.blobs.halomethanefire.desc=Mysterious holy fire is burning wildly here, devouring everything unclean around it.
actors.hero.talents.moonlight.weaponmasterytalent$masterytracker.name=Weapon Mastery
actors.hero.talents.moonlight.weaponmasterytalent$masterytracker.desc=Current stacks: %d (max 5).\n\nTurns until the next stack: %d (1 stack is gained every %d turns).
actors.hero.talents.moonlight.weaponmasterytalent$masterytracker.desc_max=Current stacks: %d (maximum stacks reached).
items.kindofweapon.ac_sharpening_edge=HONED EDGE
items.armor.armor.ac_sharpening_edge=HONED EDGE
actors.hero.talents.moonlight.sharpeningedgetalent.no_target=There are no items of the same type that need identifying right now.
actors.hero.talents.moonlight.sharpeningedgetalent.prompt=Consume this identified piece of equipment to identify an item of the same type in your backpack.
actors.hero.talents.moonlight.sharpeningedgetalent.success=You hone your new gear against the old, and learn the quality of the new gear in the process.\nBut the honing test wore your old gear away to nothing!
actors.mobs.radishenemy.deviloon.name=fire rune demon
actors.mobs.radishenemy.deviloon.desc=One of the few demons in hell that are well versed in magic. Unlike the eyes of hell, which are naturally gifted with magic, they are better at making use of the flames found everywhere in hell. They create multiple fire runes, and the moment a rune touches something else or another rune, it explodes immediately!
actors.mobs.radishenemy.deviloon.kill=The fire rune demon killed you...
actors.mobs.radishenemy.deviloon$blastrune.name=fire rune
actors.mobs.radishenemy.deviloon$blastrune.desc=It will explode, do not get close.
actors.mobs.radishenemy.deviloon$blastrune.ondeath=You were blasted to ashes by a fire rune...
actors.mobs.radishenemy.gorgon.name=gorgon
actors.mobs.radishenemy.gorgon.desc=A highly dangerous creature that was once banished to hell. Her petrifying gaze, originally so sharp it was almost tangible, has had its power eroded by hell until barely a tenth remains, yet many demons and adventurers still dare not disturb her rashly.
actors.mobs.radishenemy.gorgon.kill=You were killed by a piercing gaze...
actors.mobs.radishenemy.gorgon$petrification.ondeath=You have been completely petrified...
actors.mobs.radishenemy.gorgon$petrification.name=Petrification
actors.mobs.radishenemy.gorgon$petrification.desc=You can feel your body growing heavier...\n\nCurrent petrification buildup: _%d_%%
actors.mobs.radishenemy.demonlord.name=demon lord
actors.mobs.radishenemy.demonlord.desc=High-ranking servants of the Old God, they command every demon beneath it. When facing a demon lord, being impure is dangerous in itself, yet no adventurer can face the Old God in a pure state, which makes demon lords dangerous at all times.
actors.mobs.radishenemy.demonlord.kill=The demon lord killed you with ease...
actors.mobs.radishenemy.demonlord.damage_boost=Current demon lord damage boost: _%d_%%.
actors.hero.hero.fear_no_melee=You are gripped by fear! Your hands tremble too much to use a melee weapon.
actors.buffs.catapultstartcooldown.name=Catapult Start Cooldown
actors.buffs.catapultstartcooldown.desc=You must wait a while before Catapult Start can trigger again.\n\nTurns remaining: %s.
actors.buffs.wheelchaircrashbuff.name=Wheelchair Crash
actors.buffs.wheelchaircrashbuff.desc=Your wheelchair is broken and is being repaired! You cannot move.\n\nTurns remaining: %s.
actors.hero.talent.sword_shield_knight.title=sword and shield knight
actors.hero.talent.sword_shield_knight.desc=_+1:_ The Moonlight's minimum armor value is at least the minimum damage of the Moonlight's weapon multiplied by 100%.\n\n_+2:_ The Moonlight's minimum armor value is at least the minimum damage of the Moonlight's weapon multiplied by 125%.\n\n_+3:_ The Moonlight's minimum armor value is at least the minimum damage of the Moonlight's weapon multiplied by 150%.\n\nThis talent cannot raise the minimum armor value above the maximum armor value.
items.kindofweapon.sword_shield_knight=Due to the _sword and shield knight_ talent, your minimum armor value has been set to %d.
actors.hero.talent.wheelchair_crash.title=wheelchair crash
actors.hero.talent.wheelchair_crash.desc=_+1:_ While under any speed-boosting effect, the Moonlight can bring the wheelchair to a sudden stop and crash it, thereby dealing _15 + the turns of the speed-boosting effect_ physical damage to enemies within a _5*5 circular_ area centered on the Moonlight.\n\n_+2:_ Deals _23 + the turns of the speed-boosting effect_ physical damage to enemies within a _5*5 circular area_ centered on the Moonlight.\n\n_+3:_ Deals _30 + the turns of the speed-boosting effect_ physical damage to enemies _within a 5*5 circular area_ centered on the Moonlight.\n\nIf there are several speed-boosting effects, the highest number of turns is used.
actors.hero.herosubclass.little_knight_desc=When switching weapons, the Little Knight can launch a cancel attack against an enemy, which has a cooldown of 50 turns, and the Little Knight's thrown weapons poison enemies. When there are 3 or more enemies nearby, the Little Knight can also instantly kick them 3 tiles away.
actors.hero.talent.wont_lose.title=I won't lose
actors.hero.talent.wont_lose.desc=_+1:_ The cooldown of cancel attack is reduced to _40_ turns.\n\n_+2:_ The cooldown of cancel attack is reduced to _33_ turns.\n\n_+3:_ The cooldown of cancel attack is reduced to _25_ turns.
actors.hero.talent.wet_enchant.title=wet enchantment
actors.hero.talent.wet_enchant.desc=_+1:_ If the Little Knight's weapon has no enchantment, it is treated as having the wet enchantment. (The weapon deals 0 to weapon level extra magic damage, and its chance to weaken enemies for 3 turns is 25%.)\n\n_+2:_ The Little Knight's weapon is always treated as having the wet enchantment.\n\n_+3:_ Upgrading the Little Knight's weapon will not remove its enchantment.
actors.hero.talent.left_bow_rapid.title=left-bow rapid fire
actors.hero.talent.left_bow_rapid.desc=_+1:_ If the target already has the pincushion*3 status, thrown weapons launched at it by the Little Knight do not take a turn.\n\n_+2:_ If the target already has the pincushion*2 status, thrown weapons launched at it by the Little Knight do not take a turn.\n\n_+3:_ If the target already has the pincushion*1 status, thrown weapons launched at it by the Little Knight do not take a turn.
actors.hero.talent.gather.title=gather
actors.hero.talent.gather.desc=_+1:_ When paralysis is inflicted on you, you have a 75% chance to gain 2 MP.\n\n_+2:_ When paralysis is inflicted on you, you always gain 2 MP.
