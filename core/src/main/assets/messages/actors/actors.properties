actors.hero.abilities.moonlight.toybackpack.destroy_title=Discard a Toy
actors.hero.abilities.moonlight.toybackpack.destroy_message=You can own at most %d toys. Choose one existing toy to destroy permanently before generating a new one. Cancelling costs no charge.
actors.hero.abilities.moonlight.toybackpack.challenge_message=Enemies:\n%s\n\nTemporary toy effects:
actors.hero.abilities.moonlight.toybackpack.challenge_accept=Accept
actors.hero.abilities.moonlight.toybackpack.challenge_decline=Decline
