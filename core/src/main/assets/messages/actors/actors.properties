actors.hero.dicemage.spells.gatherspell.desc=Mana L1. Costs 1 MP: pull all items on the ground within 8 cells to your feet. Items are not collected into your backpack. Thrown weapons stuck in monsters are retrieved as well.
actors.hero.dicemage.spells.gatherspell.grab_success=Gathered %d items.
actors.hero.dicemage.spells.gatherspell.no_item=No items to gather nearby.
actors.hero.dicemage.spells.prophecyspell.name=Prophecy
actors.hero.dicemage.spells.prophecyspell.desc=Mana L2. Costs 2 MP: gain Magical Sight for 10 turns.
actors.hero.dicemage.spells.starfirespell.name=Starfire
actors.hero.dicemage.spells.starfirespell.desc=Mana L3. Costs 4 MP: for 3 turns, when enemies in view take non-spell damage, every 10 damage grants 1 MP. 50 turn cooldown.
actors.hero.dicemage.spells.lacerationspell.name=Laceration
actors.hero.dicemage.spells.lacerationspell.desc=Blood L1. Costs 1 MP: you take 8-12 damage, dealing 17-31 to a random topmost enemy in view. 10 turn cooldown.
