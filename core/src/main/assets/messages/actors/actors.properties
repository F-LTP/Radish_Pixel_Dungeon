actors.hero.abilities.cardtrickster.deckrestore.short_desc=Store your held card in a temporary slot.
actors.hero.abilities.cardtrickster.deckrestore.desc=Spends charge to create a _temporary storage slot_ and keep your held card in it. The slot lasts _20_ turns; when draw cooldown ends you may play the stored card. When it expires the card is played and put at the bottom of the deck.
actors.hero.abilities.cardtrickster.deckrestore.placeholder=Temporary management is not implemented yet.
