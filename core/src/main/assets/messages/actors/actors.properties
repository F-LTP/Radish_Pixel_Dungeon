actors.hero.dicemage.spells.lightningspell.desc=Conjuration L2. Costs 1 MP: a lightning bolt deals 15-25 lightning damage + current MP to one enemy. 50 turn cooldown.
actors.hero.dicemage.spells.lightningspell.prompt=Select lightning target
actors.hero.dicemage.spells.lightningspell.invalid_target=You must select an enemy.
 actors.hero.dicemage.spells.hexspell.name=Evil Curse
 actors.hero.dicemage.spells.hexspell.desc=Conjuration L3. Costs 3 MP: afflict a target within 3 tiles with weakness, vulnerable, hex, blindness, cripple, and healing block for 7-15 turns. 50 turn cooldown.
