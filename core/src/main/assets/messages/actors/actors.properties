actors.hero.abilities.cardtrickster.cardbarrage.name=emergency evade
actors.hero.abilities.cardtrickster.cardbarrage.short_desc=Temporarily turns your held card into a teleport card.
actors.hero.abilities.cardtrickster.cardbarrage.desc=Spends charge to temporarily turn your held card into a _teleport card_. Playing it teleports you up to _2_ tiles away, crossing enemies but not walls or obstacles. The card then reverts.
actors.hero.abilities.cardtrickster.cardbarrage.placeholder=Emergency evade is not implemented yet.
