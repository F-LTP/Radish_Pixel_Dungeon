actors.buffs.challengetoyeffects.expired=The challenge effect from %s has expired.
actors.hero.abilities.moonlight.toybackpack.short_desc=Moonlight generates various magical toys through armor charge, each with unique effects.
actors.hero.abilities.moonlight.toybackpack.desc=Moonlight can generate various magical toy items through armor charge. Each toy has unique effects that can provide various help in combat.

actors.hero.abilities.moonlight.fateddraw.name=Fated Draw
actors.hero.abilities.moonlight.fateddraw.short_desc=Moonlight manipulates RNG in desperate situations.
actors.hero.abilities.moonlight.fateddraw.desc=Moonlight gains power to manipulate random numbers. The next several RNG checks for damage, defense, evasion, and hit will always take the maximum value.
actors.hero.abilities.moonlight.fateddraw.activated=Fated Draw activated!
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.name=Fated Draw
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.desc=Moonlight is under fate control. RNG checks will consume check count. Remaining checks: %d
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.expired=Fated Draw has expired.
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.loot_drop=Loot on Kill triggered! Dropping items equivalent to +%d Ring of Wealth.
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.consume_attack_hit=Hit check consumed! Remaining: %d
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.consume_attack_damage=Damage check consumed! Remaining: %d
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.consume_defense_evasion=Evasion check consumed! Remaining: %d
actors.hero.abilities.moonlight.fateddraw$fateddrawtracker.consume_defense_block=Defense check consumed! Remaining: %d

actors.hero.abilities.moonlight.ashking.name=Ash King Incarnation
actors.hero.abilities.moonlight.ashking.short_desc=Moonlight transforms artifacts/wands/missile weapons into three combat forms.
actors.hero.abilities.moonlight.ashking.desc=The final form of the undead Moonlight who became fuel for the flame. The spirit and power of past Ash Kings converge here. After activation, the next use of an artifact, wand, or missile weapon triggers the corresponding Ash King form.
actors.hero.abilities.moonlight.ashking.ready=Ash King Incarnation ready, waiting for trigger...
actors.hero.abilities.moonlight.ashking.already_active=An Ash King form is already active, cannot activate again.
actors.hero.abilities.moonlight.ashking$incarnationready.name=Ash King Ready
actors.hero.abilities.moonlight.ashking$incarnationready.desc=Next artifact/wand/missile weapon use will trigger the corresponding Ash King form.
actors.hero.abilities.moonlight.ashking$incarnationready.holy_lance=Holy Lance form activated!
actors.hero.abilities.moonlight.ashking$incarnationready.soul_stream=Soul Stream form activated!
actors.hero.abilities.moonlight.ashking$incarnationready.fatal_blade=Fatal Blade form activated!
actors.hero.abilities.moonlight.ashking$holylanceform.name=Holy Lance
actors.hero.abilities.moonlight.ashking$holylanceform.desc=Moonlight is in Holy Lance form, gaining light effect and +1 attack reach. Remaining turns: %s
actors.hero.abilities.moonlight.ashking$holylanceform.activated=Holy Lance form activated! Duration: %d turns.
actors.hero.abilities.moonlight.ashking$holylanceform.knockback=Knocked back %d enemies!
actors.hero.abilities.moonlight.ashking$soulstreamform.name=Soul Stream
actors.hero.abilities.moonlight.ashking$soulstreamform.desc=Moonlight is in Soul Stream form, wand attacks pierce enemies. Remaining turns: %s, free casts: %d
actors.hero.abilities.moonlight.ashking$soulstreamform.activated=Soul Stream form activated! Duration: %d turns, %d free casts.
actors.hero.abilities.moonlight.ashking$soulstreamform.cast_used=Wand free cast consumed! Remaining: %d
actors.hero.abilities.moonlight.ashking$fatalbladeform.name=Fatal Blade
actors.hero.abilities.moonlight.ashking$fatalbladeform.desc=Moonlight is in Fatal Blade form, missile weapons create poison gas, movement speed doubled when enemies nearby. Remaining turns: %s
actors.hero.abilities.moonlight.ashking$fatalbladeform.activated=Fatal Blade form activated! Duration: %d turns.
actors.mobs.npcs.moonlight$wndweapontransform.select_weapon=Select a weapon to transform
actors.mobs.npcs.moonlight$wndweapontransform$3.select_weapon=Select a weapon to transform

actors.hero.talent.holy_lance.title=Holy Lance
actors.hero.talent.holy_lance.desc=_+0/1/2/3/4：_Use an artifact to enter this form for 10/15/20/25/30 turns. Knock back enemies in 7x7 radius 5 tiles away. Gain permanent light and +1 attack reach during this form.
actors.hero.talent.soul_stream.title=Soul Stream
actors.hero.talent.soul_stream.desc=_+0/1/2/3/4：_Use a wand to enter this form for 10/15/20/25/30 turns. Gain 5 free wand casts. All wands pierce enemies during this form.
actors.hero.talent.fatal_blade.title=Fatal Blade
actors.hero.talent.fatal_blade.desc=_+0/1/2/3/4：_Use a missile weapon to enter this form for 10/15/20/25/30 turns. Missile weapons release 250 gas volume poison cloud at target location. Movement speed doubled when enemies are in 3x3 range.

actors.hero.detour_title=War Fog in Path
actors.hero.detor_desc=There is war fog between you and the destination, but there is a far path to reach it. Do you want to take the long route?
actors.hero.detour_yes=Yes, take the long route
actors.hero.detour_no=No, cancel movement
items.armor.ac_toy=Toy Backpack
items.armor.ac_attach=Generate Toy
actors.buffs.poembuff.name=poem
actors.buffs.poembuff.desc=The next blows seek a rhyme. Targets whose names rhyme with your weapon or armor take _%d%% bonus final damage_. For non-Chinese names, the first character must match instead.
actors.buffs.poembuff.rhymed=A verse echoes: %s rhymes with %s!

### NEW T4 TALENTS - TALENT OVERHAUL
# Warrior T4-2: High Diet
actors.hero.talent.high_diet.title=high diet
actors.hero.talent.high_diet.desc=_+1:_Warrior's max satiety is increased to 550. When satiety is above 450, natural HP regen is increased by 50%.\n\n_+2:_Max satiety is increased to 600. When satiety is above 450, natural HP regen is increased by 100%.\n\n_+3:_Max satiety is increased to 650. When satiety is above 450, natural HP regen is increased by 150%.\n\n_+4:_Max satiety is increased to 700. When satiety is above 450, natural HP regen is increased by 200%.

# Gladiator T4-4: Weapon Master
actors.hero.talent.weapon_master.title=weapon master
actors.hero.talent.weapon_master.desc=_+1:_After switching weapons, Gladiator's combo is set to 3 and gains 2 turns of 50% attack speed boost.\n\n_+2:_Combo set to 3, gains 3 turns of 50% attack speed boost.\n\n_+3:_Combo set to 4, gains 3 turns of 50% attack speed boost.\n\n_+4:_Combo set to 4, gains 4 turns of 50% attack speed boost.
actors.hero.talent.weapon_master_activated=Weapon Master triggered! Combo set to %d, attack speed boost for %d turns.

# Battlemage T4-3: Wand Dodge
actors.hero.talent.wand_dodge.title=wand dodge
actors.hero.talent.wand_dodge.desc=_+2:_After a melee attack with the starting wand, Battlemage has a 15% chance to gain an evasion. The wand deals 4 more physical damage.\n\n_+3:_20% chance to gain an evasion, wand deals 6 more physical damage.\n\n_+4:_25% chance to gain an evasion, wand deals 8 more physical damage.

# Warlock T4-4: Corrupt Spirit
actors.hero.talent.corrupt_spirit.title=corrupt spirit
actors.hero.talent.corrupt_spirit.desc=_+1:_Each new floor, Warlock spawns 2 corrupted spirits nearby. When a spirit dies, all monsters on that floor lose 1 evasion and accuracy.\n\n_+2:_Spawns 2 spirits, each death reduces evasion and accuracy by 2.\n\n_+3:_Spawns 3 spirits, each death reduces evasion and accuracy by 2.\n\n_+4:_Spawns 3 spirits, each death reduces evasion and accuracy by 3.
actors.mobs.corruptspirit.name=corrupt spirit
actors.mobs.corruptspirit.desc=A corrupted spirit summoned by the Warlock. When they die, they reduce the evasion and accuracy of all monsters on the same floor.

# Sniper T4-3: Common Shot
actors.hero.talent.common_shot.title=common shot
actors.hero.talent.common_shot.desc=_+1:_Sniper's melee attacks have a 33% chance to apply a sniper mark.\n\n_+2:_66% chance to apply a sniper mark.\n\n_+3:_Melee attacks always apply a sniper mark.\n\n_+4:_Sniper always has vision of marked enemies.

# Warden T4-3/4-4
actors.hero.talent.more_darts.title=more darts
actors.hero.talent.more_darts.desc=_+1:_ Warden can use one potion to coat _4_ darts.\n\n_+2:_ Can use one potion to coat _6_ darts.\n\n_+3:_ Tipped darts deal _50%_ more damage and have _100%_ more accuracy.\n\n_+4:_ Tipped darts deal _100%_ more damage and have _150%_ more accuracy.
actors.hero.talent.grass_vision.title=grass vision
actors.hero.talent.grass_vision.desc=_+1:_ The Warden can see every _grass_ tile on the map, including anything standing on it.\n\n_+2:_ Also sees every _high grass_ tile.\n\n_+3:_ Also sees every _furrowed grass_ tile.\n\n_+4:_ Enemies standing on any of these grass tiles move 20% slower.

# Moonlight T4-1/4-2
actors.hero.talent.light_eternity.title=light eternity
actors.hero.talent.light_eternity.desc=_+1:_Whenever Moonlight loses HP from a monster attack, their natural HP regen is increased by 15% for 8 turns. Each stack is independent.\n\n_+2:_Regen increased by 23%.\n\n_+3:_Regen increased by 31%.\n\n_+4:_Regen increased by 40%.
actors.hero.talent.moon_glory.title=moon glory
actors.hero.talent.moon_glory.desc=_+1:_Every 12 wand charges used, restore 2 random charges to the carried wand.\n\n_+2:_Every 12 charges used, restore 3 random charges.\n\n_+3:_Every 11 charges used, restore 3 random charges.\n\n_+4:_Every 10 charges used, restore 3 random charges.

# Little Knight T4-3/4-4
actors.hero.talent.shield_poke.title=shield poke
actors.hero.talent.shield_poke.desc=_+1:_Little Knight's ambush damage is increased by 5. If equipped with a shield weapon, attacks become a 15-20 damage guaranteed ambush poke.\n\n_+2:_Ambush damage +6, shield poke deals 15-25 damage.\n\n_+3:_Ambush damage +7, shield poke deals 15-30 damage.\n\n_+4:_Ambush damage +8, shield poke deals 15-35 damage. Pokes inherit enchantments and benefit from attack speed bonuses.
actors.hero.talent.knight_spirit.title=knight spirit
actors.hero.talent.knight_spirit.desc=_+1:_Little Knight gains 25% of the target's block/damage reduction/damage/evasion/accuracy for 1 turn when hitting an enemy.\n\n_+2:_Gains 25% for 2 turns.\n\n_+3:_Gains 25% for 3 turns.\n\n_+4:_Gains 25% for 4 turns. Effects last until the enemy leaves attack range.

# Dice Mage T4-3/4-4
actors.hero.talent.spell_empower.title=dumb luck
actors.hero.talent.spell_empower.desc=The Dice Mage's intelligence is 0 (intelligence does not exist in the game, so this has no practical effect). The Dice Mage casts using strength. For each point of strength above _16 / 14 / 12 / 10_, spells deal 0-2 additional damage.
actors.hero.talent.egg_basket.title=egg basket
actors.hero.talent.egg_basket.desc=_+1:_All wands' minimum damage becomes 1. Maximum damage is increased by (min change) * 125%.\n\n_+2:_Maximum damage increased by (min change) * 150%.\n\n_+3:_Maximum damage increased by (min change) * 175%.\n\n_+4:_Maximum damage increased by (min change) * 200%.
actors.mobs.whiteplasticchair.name=white plastic chair
actors.mobs.whiteplasticchair.desc=An ordinary-looking white plastic chair. Looking at it fills you with a strange urge to kick it.
actors.mobs.whiteplasticchair.kick=Kick it
actors.mobs.whiteplasticchair.too_far=You need to stand next to the chair to kick it.
actors.mobs.whiteplasticchair.kicked=The chair flies away, leaving a blade behind!
actors.hero.talent.school_fire.title=Fire
actors.hero.talent.school_fire.desc=Invest points to level the Fire school. Level determines the usable spell: +1 Scorch, +2 Scald, +3 Deflagration (only the spell matching the school level is usable).
actors.hero.talent.school_blades.title=Blades
actors.hero.talent.school_blades.desc=Invest points to level the Blades school. +1 Cut, +2 Hack, +3 Blade Rain.
actors.hero.talent.school_conjuration.title=Conjuration
actors.hero.talent.school_conjuration.desc=Invest points to level the Conjuration school. +1 Execute, +2 Lightning, +3 Evil Curse. Holding this school lets you see monsters' actual HP.
actors.hero.talent.school_mana.title=Mana
actors.hero.talent.school_mana.desc=Invest points to level the Mana school. +1 Gather, +2 Prophecy, +3 Starfire.
actors.hero.talent.school_blood.title=Blood
actors.hero.talent.school_blood.desc=Invest points to level the Blood school. +1 Laceration, +2 Combustion, +3 Drain.
actors.hero.talent.school_nature.title=Nature
actors.hero.talent.school_nature.desc=Invest points to level the Nature school. +1 Hemlock, +2 Vine, +3 Miasma.
actors.hero.talent.school_medical.title=Medical
actors.hero.talent.school_medical.desc=Invest points to level the Medical school. +1 Bandage, +2 Inject, +3 Soothe.
actors.hero.talent.school_physical.title=Physical
actors.hero.talent.school_physical.desc=Invest points to level the Physical school. +1 Light Poke, +2 Flick, +3 Reap.
actors.hero.talent.school_emergency.title=Emergency
actors.hero.talent.school_emergency.desc=Invest points to level the Emergency school. +1 Mend, +2 Refresh, +3 Surgery.
actors.hero.talent.school_special.title=Special
actors.hero.talent.school_special.desc=Invest points to level the Special school. Three special spells are randomly assigned to its levels each run; after picking the first special spell you can view this run's assignment.
actors.hero.herosubclass.dice_mage=dice mage
actors.hero.herosubclass.dice_mage_short_desc=The _Dice Mage_ builds up MP from using wands, the passage of time, and the deaths of enemies, then spends it to cast school spells from another world.
actors.hero.herosubclass.dice_mage_desc=The Dice Mage gains _0.2 + 0.2 x wand level_ MP whenever a wand is used, _1_ MP every _20_ turns, and _1_ MP whenever a monster dies in view. _1_ alchemical energy can also be exchanged for _1_ MP at an alchemy pot.\n\nWhen MP is insufficient, wand charges in the backpack can be spent to cover the difference: each charge provides _1 + 0.33 x wand level_ MP. A window will ask for confirmation and list the wands that will be drained.\n\nEvery _25_ turns, any MP above _3_ is cleared. Tap your MP buff icon to see when the next clear happens.\n\nThe Dice Mage starts with the _Burst_ spell.\n\nThe Dice Mage cannot pick talents normally when levelling up. Instead, choose one of 2 random schools to advance by 1 point, advance a random school, or skip. The effects of every school's spells can be viewed in the journal.
actors.hero.dicemage.dicemagespell.no_mp=Not enough MP.
actors.hero.dicemage.spells.burstspell.name=Burst
actors.hero.dicemage.spells.burstspell.desc=Costs 2 MP: select yourself or any unit within 3 cells. Grants 15 shielding to yourself or an ally; deals 14-21 fire damage to an enemy.
actors.hero.dicemage.spells.burstspell.prompt=Select yourself or a unit within 3 cells
actors.hero.dicemage.spells.burstspell.invalid_target=You must select a unit.
actors.hero.dicemage.spells.burstspell.out_of_range=The target must be within 3 cells.
actors.hero.dicemage.spells.burstspell.shield=Burst! The target gains %d shielding.
actors.hero.dicemage.spells.burstspell.damage=Burst! Dealt %d fire damage to the target.
actors.hero.dicemage.dicemagespell.ondeath=Your own spell has taken your life...
actors.hero.dicemage.dicemagespell.rankings_desc=Killed by their own spell: %s
actors.hero.dicemage.spells.scorchspell.name=Scorch
actors.hero.dicemage.spells.scorchspell.desc=Fire L1. Costs 2 MP: enemies in a 3x3 area immediately suffer all remaining fire damage and are reignited; burning ground instantly burns out and turns to ash. 5 turn cooldown.
actors.hero.dicemage.spells.scorchspell.prompt=Select scorch center
actors.hero.dicemage.spells.scaldspell.name=Scald
actors.hero.dicemage.spells.scaldspell.desc=Fire L2. Costs 3 MP: enemies in view below 80% HP take 15-21 fire damage.
actors.hero.dicemage.spells.scaldspell.none=Scald! No enemies below 80% HP in view.
actors.hero.dicemage.spells.blazespell.name=Deflagration
actors.hero.dicemage.spells.blazespell.desc=Fire L3. Costs 6 MP: deal 100-150 fire damage to a burning enemy and detonate it. Its own fire is extinguished and fire spreads to enemies and ground in a 5x5 area.
actors.hero.dicemage.spells.blazespell.prompt=Select an enemy
actors.hero.dicemage.spells.blazespell.invalid_target=You must select a burning enemy.
actors.hero.dicemage.spells.cutspell.name=Cut
actors.hero.dicemage.spells.cutspell.desc=Blades L1. Costs 3 MP: all enemies in view take 7-11 physical damage, plus 33% of weapon damage and a strength bonus, and trigger weapon enchantments.
actors.hero.dicemage.spells.cutspell.no_enemy=No enemies in view.
actors.hero.dicemage.spells.hackspell.name=Hack
actors.hero.dicemage.spells.hackspell.desc=Blades L2. Costs 3 MP: unleash a 60-degree cone slash (up to 7 cells) toward the aimed direction, dealing weapon damage + strength bonus to all enemies hit and triggering weapon enchantments. Always hits; cannot pass walls.
actors.hero.dicemage.spells.hackspell.prompt=Select slash direction
actors.hero.dicemage.spells.bladerainspell.name=Blade Rain
actors.hero.dicemage.spells.bladerainspell.desc=Blades L3. Costs 4 MP: fires 16 blade projectiles across a 120-degree fan toward the aimed direction, each hitting the first enemy along its ray for 20-30 physical damage + a strength bonus; each enemy can be hit up to 3 times, extra projectiles cannot be blocked.
actors.hero.dicemage.spells.bladerainspell.prompt=Choose a direction
actors.hero.dicemage.spells.bladerainspell.none=Blade Rain! No hits.
actors.hero.dicemage.spells.executespell.name=Execute
actors.hero.dicemage.spells.executespell.desc=Conjuration L1. Costs 3 MP: kill one enemy in view with HP up to 30 + STR. 15 turn cooldown.
