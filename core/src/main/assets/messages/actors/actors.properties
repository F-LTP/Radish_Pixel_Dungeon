actors.buffs.magicpoint.name=Magic Points
actors.buffs.magicpoint.desc=You have _%d_ MP, which can be used to cast Dice Mage spells.\n\nYou gain _1_ MP every _20_ turns, and _1_ MP when a monster dies in view. Every _25_ turns, MP above _3_ is cleared (in _%d_ turns).
