actors.buffs.jumblechangebuff.name=Jumble Shift
actors.buffs.jumblechangebuff.desc=The Jumble is unstable, and will spontaneously shift into a new form every so often.\n\nEach shift, your talents are randomized and your equipped artifact, ring, weapon, and armor are transmuted into new items of the same kind.
actors.buffs.jumblechangebuff.countdown=Next shift in %d turns.
actors.buffs.jumblechangebuff.transform=Your essence shifts like the ebb and flow of the tide!

### Card Trickster
actors.hero.heroclass.cardtrickster=card trickster
actors.hero.heroclass.cardtrickster_desc_short=The Card Trickster fights with a _deck of cards_, drawing one card at a time and weaving tactics between the draw pile and discard pile.
actors.hero.heroclass.cardtrickster_desc=The Card Trickster starts with a _paper cutter_, a _card drawer_ and a deck of _20 blank cards_.\n\nOnly one card may be held at a time, and drawing has a _10 turn_ cooldown. Played cards go to the discard pile; when the draw pile is empty the discard pile is shuffled back automatically.
actors.hero.heroclass.cardtrickster_unlock=The Card Trickster is automatically unlocked.

actors.hero.herosubclass.illusionist=collector
actors.hero.herosubclass.illusionist_short_desc=The _Collector_ turns weapons and armor into attack and defense cards.
actors.hero.herosubclass.illusionist_desc=The Collector's weapon and Ring of Force no longer deal damage. The Collector may target themselves with a blank card to convert an identified, non-cursed weapon or armor into an _attack card_ or _defense card_. Attack cards benefit from blank card talents and deal _1-5_ extra base damage; defense cards do not benefit from blank card talents, grant _3_ shielding (higher values override lower ones), and cancel draw cooldown.
actors.hero.herosubclass.spin_master=spin master
actors.hero.herosubclass.spin_master_short_desc=The _Spin Master_ deals damage by cycling the deck and spinning blanks.
actors.hero.herosubclass.spin_master_desc=Every time the Spin Master cycles the deck, all visible enemies take armor-ignoring physical damage equal to the hero level. When the cycle counter reaches the deck size it counts as one cycle and the counter is reduced. The Spin Master also spins _1_ every _50_ turns.\n\nSpin _n_: move all blank cards among the top _n_ cards to the bottom. Spun blanks increase the cycle counter but are not played.
actors.hero.herosubclass.joker=trapper
actors.hero.herosubclass.joker_short_desc=The _Trapper_ turns traps into trap cards.
actors.hero.herosubclass.joker_desc=The Trapper may use a blank card on a trap to convert it into a _trap card_. A trap card records that trap, releases its effect when played and reverts to a blank card. Trap cards have their own _25 turn_ cooldown.

actors.hero.talent.food_card.title=food card
actors.hero.talent.food_card.desc=_+1:_ Gain _1_ small ration card. It restores _50_ satiety, takes _3_ turns, and after restoring satiety this way you cannot gain satiety from it again for _100_ turns.\n\n_+2:_ Gain _2_ small ration cards in total. They restore _50_ satiety, take _3_ turns, and after restoring satiety this way you cannot gain satiety from them again for _100_ turns.
actors.hero.talent.identify_card.title=identify card
actors.hero.talent.identify_card.desc=_+1:_ Gain _1_ identify card, which identifies a random scroll, potion or ring.\n\n_+2:_ Gain _1_ identify card, which identifies a random scroll, potion or ring and may be destroyed after use.
actors.hero.talent.blank_empowerment.title=blank empowerment
actors.hero.talent.blank_empowerment.desc=_+1:_ Blank cards deal _0-2_ more damage to enemies.\n\n_+2:_ Blank cards deal _1-3_ more damage to enemies.
actors.hero.talent.blank_protection.title=card protection
actors.hero.talent.blank_protection.desc=_+1:_ Playing any card grants _2_ shielding. This shielding does not stack.\n\n_+2:_ Playing any card grants _3_ shielding. This shielding does not stack.
actors.hero.talent.advanced_food.title=instant nutrition
actors.hero.talent.advanced_food.desc=_+1:_ Using small ration cards takes no turn.\n\n_+2:_ Using small ration cards takes no turn. Eating or using a small ration card cancels draw cooldown.
actors.hero.talent.scroll_conditioning.title=scroll conditioning
actors.hero.talent.scroll_conditioning.desc=_+1:_ After using a scroll, your next draw is free. Exotic, upgrade and transmutation scrolls double this. Stackable items such as crystals use an alchemy-count-based chance.\n\n_+2:_ After using a scroll, your next _2_ draws are free. Exotic, upgrade and transmutation scrolls double this. Stackable items such as crystals use an alchemy-count-based chance.
actors.hero.talent.rigid_card.title=rigid card
actors.hero.talent.rigid_card.desc=_+1:_ Gain _1_ rigid card, which paralyses a target for _5_ turns and cancels draw cooldown.\n\n_+2:_ Gain _1_ enhanced rigid card, which paralyses a target for _5_ turns and cancels draw cooldown. Each card you play moves it one step toward the top of the deck.
actors.hero.talent.hormone_card.title=hormone card
actors.hero.talent.hormone_card.desc=_+1:_ Gain _1_ hormone card, granting _2_ turns of Adrenaline and Haste and cancelling draw cooldown.\n\n_+2:_ Gain _1_ enhanced hormone card, granting _2_ turns of Adrenaline and Haste and cancelling draw cooldown. Each card you play moves it one step toward the top of the deck.
actors.hero.talent.borrow_wind_cut.title=borrow wind cut
actors.hero.talent.borrow_wind_cut.desc=_+1:_ Blank cards deal _1-2_ more damage per tile of distance, up to _4_ tiles.\n\n_+2:_ Blank cards deal _2-3_ more damage per tile of distance, up to _4_ tiles.
actors.hero.talent.streamline.title=streamline
actors.hero.talent.streamline.desc=_+1:_ Gain _1_ card deletion.\n\n_+2:_ Gain _2_ card deletions in total.\n\n_+3:_ Gain _3_ card deletions in total.
actors.hero.talent.blank_fill.title=blank fill
actors.hero.talent.blank_fill.desc=_+1:_ Gain _1_ blank card.\n\n_+2:_ Gain _2_ blank cards in total.\n\n_+3:_ Gain _3_ blank cards in total.
actors.hero.talent.card_enchant.title=curated collection
actors.hero.talent.card_enchant.desc=_+1:_ Converted attack cards inherit _1/4_ of the original weapon panel and its attack delay; converted defense cards inherit _1/4_ of the original armor cap. Temporary levels are not counted.\n\n_+2:_ Converted attack cards inherit _1/3_ of the original weapon panel and its attack delay; converted defense cards inherit _1/3_ of the original armor cap.\n\n_+3:_ Converted attack cards inherit _1/2_ of the original weapon panel and its attack delay; converted defense cards inherit _1/2_ of the original armor cap.
actors.hero.talent.refined_attack_defense.title=royal vault
actors.hero.talent.refined_attack_defense.desc=_+1:_ Each attack card in the deck increases attack card base damage by _1_, and each defense card increases defense card shielding by _1_.\n\n_+2:_ Each attack card in the deck increases attack card base damage by _1-2_, and each defense card increases defense card shielding by _2_.\n\n_+3:_ Each attack card in the deck increases attack card base damage by _2-3_, and each defense card increases defense card shielding by _3_.
actors.hero.talent.card_assist.title=defense as offense
actors.hero.talent.card_assist.desc=_+1:_ Playing a defense card grants _1_ turn of Stamina.\n\n_+2:_ Playing a defense card grants _1_ turn of Stamina. If the next card is an attack card, it reduces draw cooldown by _5_.\n\n_+3:_ Playing a defense card grants _1_ turn of Stamina. If the next card is an attack card, it reduces draw cooldown by _5_ and costs no turn. This effect does not stack.
actors.hero.talent.spin_card.title=spin card
actors.hero.talent.spin_card.desc=_+1:_ Gain _1_ spin card, spinning _3_.\n\n_+2:_ Gain _1_ spin card, spinning _4_.\n\n_+3:_ Gain _2_ spin cards, spinning _5_.
actors.hero.talent.grand_finale.title=grand finale
actors.hero.talent.grand_finale.desc=_+1:_ Gain _1_ grand finale, dealing _5-10_ base damage plus _5-10_ per blank card, then spinning _2_.\n\n_+2:_ Gain _1_ grand finale, dealing _5-10_ base damage plus _5-10_ per blank card, then spinning _3_.\n\n_+3:_ Gain _1_ grand finale, dealing _5-10_ base damage plus _5-10_ per blank card and _1/3_ of the original weapon panel, then spinning _3_.
actors.hero.talent.prepared.title=well prepared
actors.hero.talent.prepared.desc=_+1:_ Gain _1_ well prepared, inspecting the top _2_ cards and moving up to _1_ to the bottom, which counts as spinning.\n\n_+2:_ Gain _1_ well prepared, inspecting the top _3_ cards and moving up to _1_ to the bottom, which counts as spinning.\n\n_+3:_ Gain _1_ well prepared, inspecting the top _4_ cards and moving up to _2_ to the bottom, which counts as spinning.
